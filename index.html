nation to trod the path of maximal encounter and comprehensive maturation. The man who fails to do so merely indicates by his inaction or avoidance his equally faith-based belief, but in the spirit diametrically opposed to progress; in the one that calls to continued infantile dependence. There is no nonfaith choice in the decision to move forward or not. The former is the sacrificial pathway of ever-expanding horizon. The latter is a deadening and stagnating stasis of spirit. This was Abram’s life, before the call of God, the beckoning of great opportunity—even the appeal of conscience.","page":"249","tags":"action, commitment, revealed-preference"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"True hospitality enables the fundamental and basic sharing that truly unites us. We must all eat, drink and talk, however casually, lightly, and entertainingly. If we can manage in a spirit of good will, fellowship, and play, maybe we could risk more difficult ventures together.","page":"300","tags":"trust, relationships, culture"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"One fundamental principle that is not well understood nor embraced in many companies is that we plan not for the sake of planning, but to achieve business objectives.","page":"6","tags":"means-vs-ends, strategy, planning"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Planning is the activity that brings together people within an organization to share objectives, prioritize, and create common understanding.","page":"6","tags":"strategy, planning, alignment"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Demand is what your customers need, when and where they need it… the focus is on what a company’s customers need, not what the company is capable of supplying… Separation of customer demand from supply capability is critical to better serving customers in the most profitable way.","page":"15","tags":"customer-value, supply-demand, strategy"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"It is not uncommon to find the role of demand planning being thought of as a supply chain activity… When the commercial side of the business fails to take responsibility, for whatever reason, for creating a robust demand plan, the supply side of the business often takes control out of necessity. There are two problems with that approach. First, the supply organization is often detached from the functions responsible for marketing, product development, and sales. The supply organization is not accountable for generating demand and is not involved in knowing the actions that the commercial teams are taking to influence and generate demand. Second, a demand plan generated by the supply organization often relies heavily on historical data and statistical modeling. The problem with this approach is that history doesn’t always repeat itself. Models based on history alone rarely deliver a plan that meets business objectives. Models based predominantly on history and statistics do not consider the business decisions and commercial activities that will generate new demand in the future.","page":"25","tags":"responsibility, organizational-structure, misalignment"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"The value of a piece of information should be based on its ability to influence a decision. Gathering data and processing it into information that does not impact a decision is, therefore, a waste of energy and resources.","page":"28","tags":"decision-making, information-advantage, efficiency"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Culture eats strategy for breakfast.","page":"63","tags":"culture, organizational-structure, strategy"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"What separates companies with exceptional planning processes from those that are regularly frustrated by their processes comes down to one word: trust.","page":"63","tags":"trust, planning, organizational-structure"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Trust is a two-way street. We trust people who trust us. We don’t trust people who don’t trust us… building trust is not something for someone else to do. Everybody has a role to play, and it is best to focus first on making yourself and your deliverables trustworthy before expecting others to trust and rely on them.","page":"68-70","tags":"trust, relationships, accountability"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"There are no facts in the future, and therefore, the demand plan can only reflect beliefs or assumptions of what will happen along with the associated consequences to demand.","page":"85","tags":"uncertainty, planning, conservative-assumptions"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"To create a reliable plan, it is far more important to focus on the assumptions upon which the result it based.","page":"85","tags":"planning, conservative-assumptions, decision-making"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"The story surrounding the demand plan and its implications to the business, and not necessarily the most robust analytics, [is] far more important. Executive business leaders are focused on running the business, not on understanding the nitty-gritty of statistics.","page":"85","tags":"communication, simplicity, management"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Used well, assumptions drive clear communications and fact-based discussions. By debating the assumptions rather than the numbers, accountability is strengthened.","page":"86","tags":"conservative-assumptions, accountability, communication"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Capturing and time-stamping assumptions is critical… By keeping and dating the source documents, I can always point back to the source of the assumption. I can better explain the rationale behind a planning assumption as well. I also can call upon the person who communicated the information in order to get more detail if needed.","page":"94","tags":"accountability, documentation, conservative-assumptions"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Most organizations do a good job of getting the demand volume and revenue numbers on the page. Quite often I encounter what I call the wall of numbers… What the wall of numbers lacks, however, is a distillation of the key assumptions that have the most significant impact on the plan numbers. It is insufficient to simply show a set of numbers and expect the commercial leaders to figure out what the number represent in terms of the actions they and their teams will need to take for those numbers to be realized.","page":"121","tags":"simplicity, communication, conservative-assumptions"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Another approach to telling the story during the demand review is the use of a table that outlines key assumptions over the planning horizon… The assumption table has several advantages. It is easy for a sales or marketing leader to scan the list of assumptions and verify that their understanding is properly reflected in the demand plan. It allows business leaders to see what is most relevant to the business.","page":"124","tags":"communication, conservative-assumptions, clarity"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Using risks and opportunities as a foundation for scenario planning will help to avoid becoming paralyzed by evaluating an infinite number of future possibilities. It makes visible a manageable range of possible demand outcomes.","page":"145","tags":"scenario-planning, uncertainty, risk"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Paying attention to consumers and end users can pay big dividends. It frequently leads to better planning, better decision making, and more credible and trustworthy demand plans.","page":"169","tags":"consumer-behavior, decision-making, trust"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Measurement of demand plan performance is not a number, it’s a story. Stating that the demand plan was 78 percent accurate tells us very little that will help us understand the challenges in execution and how to make better decisions.","page":"184","tags":"context, performance-measurement, planning"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"In my view, business goals and objectives should be the primary measuring stick against which execution of the demand plan is evaluated.","page":"185","tags":"standards, planning, performance-measurement"},{"book":"Trust the Plan","author":"Greg Spira","year":"2023","text":"Demand planners must be competent in skills beyond forecasting and analysis. They must be skilled in developing trusting relationships and collaborating well with others. Building trust involves more than just having the right answers. It requires being respected for judgment and business acumen.","page":"198","tags":"trust, judgment, relationships"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"First, bad forecasts are worse than no forecasts. If you have no forecast, you will at least be alert; you will always have a look out posted. A poor forecast, on the other hand, can foster dangerous complacency or misinform decision-making.” (p. xvii)","page":"","tags":"planning, risk, decision-making"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"What I, as an experienced analyst, want from you is a projection with some ranges around it, a good idea of what is driving the uncertainty and a convincing plan of how you are going to mitigate the risk or exploit the opportunity.","page":"11","tags":"uncertainty, risk-reward, communication"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Contrary to what many people might believe, a forecast, if it is to be an effective management tool, does not have to be a good prediction of the future.","page":"37","tags":"prediction, planning, decision-making"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"We might think that we want to ‘know the future’, but in reality we only want to know the future in order to be able to do something about it. In other words, we want to change the future to make it more acceptable to us.","page":"37","tags":"action, agency, planning"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"What businesses need are forecasts not predictions. A prediction is a statement of what will happen. A forecast is a statement of what you think will happen, based on certain assumptions about the world – assumptions about the external environment and about your own future actions and those of others. In other words, it is the very fact that the forecasted future might not come about – because the assumptions might be wrong or have been changed – as a result of decisions you make based on forecasts – that makes forecasting useful.","page":"38","tags":"prediction, conservative-assumptions, planning"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"The reason why we forecast is that we need to make informed decisions. Decisions that lead to action, whether that action is to make a change in the business to respond to a forecast, to invalidate a forecast, or to communicate something to an outside stakeholder about a forecast.","page":"45","tags":"decision-making, planning, action"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"A good forecast needs to be:\nT = Timely\nA = Actionable\nR = Reliable\nA = Aligned\nC = Cost Effective.","page":"45","tags":"decision-making, planning, cost-effectiveness"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Timely. The first requirement of a forecast is that it is timely. That is, in time for appropriate action to be taken. The frequency and speed of forecasting should be related to the speed of change of key variables… It makes little sense to have a process which produces a forecast every month but spend most of the month producing it.","page":"45","tags":"planning, timing, action"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Actionable. The detail which a forecast should contain depends on the nature of decisions that need to be taken… only forecasts that are based on an explicit set of assumptions are actionable… In summary, the main requirement of a good forecast is that it should be actionable. This means that it should have the minimum amount of detail required to provide management with a clear understanding of what is driving future performance.” (p. 47, 49)","page":"","tags":"planning, decision-making, assumptions"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Reliable. Reliability is the most desirable quality for a forecast, not accuracy… By reliability, we mean forecasts that are accurate enough for our purpose: decision-making.","page":"49","tags":"planning, decision-making, accuracy"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Aligned. Different forecasts need to be aligned where coordinated action is called for.","page":"51","tags":"planning, alignment, coordination"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Cost Effective. The value derived from a forecast should be greater than the cost of producing it… If you do not know what you are producing forecasts for – that is you do not do anything different as a result – you should question whether you should be forecasting at all, or at the very least question the way you produce forecasts.","page":"52","tags":"cost-effectiveness, value-creation, planning"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"So, put at its simplest, the need to forecast is determined by an inability to respond, specifically because of the existence of a lead time between taking a decision and the decision taking effect.","page":"59","tags":"planning, timing, decision-making"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Since we need to be able to respond continuously, rolling forecast horizons are necessary. From a theoretical point of view then, if our ‘longest lead time’ is 12 months we need, at all times, a 12-month horizon. That is what we call a ‘rolling forecast’: a forecast where the horizon ‘rolls forward’ such that there is always a consistent level of visibility. This differs from the conventional approach where the length of the horizons expands and contracts depending on when the forecast is conducted.","page":"64","tags":"planning, time-horizon, flexibility"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"A model is a simplified representation of the world constructed for a specific purpose… Forecasting is a process: a model is used to transform a set of assumptions about the world (input) into a forecast (output).","page":"90-91","tags":"mental-models, simplicity, assumptions"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"We stand very little chance of forecasting successfully unless we measure our performance continuously and correct our forecasts accordingly.","page":"127","tags":"performance-measurement, continuous-improvement, learning"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Errors are assumed to be evidence of poor forecasting, and success in ‘delivering the numbers’ is regarded as good forecasting… We can only confidently measure the quality of forecasts within decision-making lead times. This means that we can only reliably measure forecast error within decision-making lead times, that is, before any decisions we make in response to the forecast have had time to take effect.","page":"131","tags":"performance-measurement, decision-making, time-horizon"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"How frequently should me measure forecasts? Here the simple rule is… OFTEN! Why? The more often we forecast, the quicker we will be able to act to correct any problems with our process.","page":"132","tags":"performance-measurement, continuous-improvement, action"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"It is not possible to measure forecast accuracy over the longer term; instead we should be assessing forecast credibility… The further ahead we look the more we are measuring the results of actions we took in response to the previous forecast rather than the quality of the forecast itself.","page":"158-159","tags":"performance-measurement, cause-and-effect, time-horizon"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"The approach we recommend is Scenario Planning. This involves the creation of a limited number of credible, but different, alternative ‘futures’ based on very different assumptions about the world.","page":"170","tags":"scenario-planning, assumptions, planning"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"A good forecaster is not smarter than everyone else; he merely has his ignorance better organized.","page":"183","tags":"intellectual-humility, self-knowledge, planning"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Rule Number 1 – Going with the flow: organize your process in a logical sequence… Put simply, a process is made up of three things; an input, an output and a set of routines (tasks) that transform the inputs into outputs.","page":"184","tags":"organizational-structure, simplicity, logic"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Rule Number 2 – Design out bias: remove or treat the sources of bias ‘infection’… Ensure that forecast assumptions are properly documented and widely shared. The discussions that take place about the forecast should be discussions about the validity of assumptions (inputs into the process), not whether the forecast (output) is correct or ‘acceptable.’ Try to exclude all reference to targets in forecast discussions.","page":"186","tags":"decision-making, documentation, assumptions"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Rule Number 3 – When you have designed your process, stick to it and continuously improve by learning from experience.","page":"187","tags":"continuous-improvement, learning, discipline"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"If your organization treats change as evidence of bad forecasting then information will be suppressed and suppression leads to surprises. Indeed, if forecasts do not change between iterations then there is something wrong. Either you are forecasting far too frequently or, more likely, the numbers are being ‘massaged’ in order to avoid unwelcome challenges like ‘why has the forecast changed – do you know what you’re doing?’","page":"193","tags":"adaptation, flexibility, learning"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"Forecasting is not a discrete, technical exercise; it is a BUSINESS process. It should be ‘owned’ by everyone – and in particular by the leaders of the business. There should be collective responsibility for the forecast outcomes. The forecast process should be treated as part of the way that the business is run – the engine of decision-making – rather than an exercise in producing a ‘prediction’ of the future.","page":"214","tags":"forecasting, organizational-structure, collective-responsibility, business-process"},{"book":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","text":"As human beings we swim in a deep ocean of data, most of which is irrelevant to our purpose. If we are to survive we need to discard most of it to isolate that tiny proportion that we can use.","page":"258","tags":"information-advantage, noise-vs-signal, epistemology, focus"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"At its core, organizational health is about integrity, but not in the ethical or moral way that integrity is defined so often today. An organization has integrity—is healthy—when it is whole, consistent, and complete, that is, when its management, operations, strategy, and culture fit together and make sense.","page":"5","tags":"organizational-structure, alignment, integrity, culture"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"Any organization that really wants to maximize its success must come to embody two basic qualities: it must be smart, and it must be healthy… Smart organizations are good at those classic fundamentals of business—subjects like strategy, marketing, finance, and technology—which I consider to be decision sciences… But being smart is only half the equation. Yet somehow it occupies almost all the time, energy, and attention of most executives. The other half of the equation, the one that is largely neglected, is about being healthy. A good way to recognize health is to look for the signs that indicate that an organization has it. These include minimal politics and confusion, high degrees of morale and productivity, and very low turnover among good employees.","page":"5","tags":"organizational-structure, competitive-advantage, business-quality, knowledge"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"In this world of ubiquitous information and nanosecond technology exchange, it’s harder than is has ever been in history to maintain a competitive advantage based on intelligence or knowledge.","page":"8","tags":"competitive-advantage, information-advantage, knowledge, markets"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"I have yet to meet a group of leaders who made me think, Wow, these people just don’t know enough about their business to succeed… I’ve become absolutely convinced that the seminal differences between successful companies and mediocre or unsuccessful ones has little, if anything, to do with what they know or how smart they are; it has everything to do with how healthy they are.","page":"8-9","tags":"organizational-structure, knowledge, success, competitive-advantage"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"An organization that is healthy will inevitably get smarter over time. That’s because people in a healthy organization, beginning with the leaders, learn from one another, identify critical issues, and recover quickly from mistakes.","page":"9","tags":"organizational-structure, learning, continuous-improvement, adaptation"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"A good way to look at organizational health… is to see it as the multiplier of intelligence. The heathier an organization is, the more of its intelligence it is able to tap into and use.","page":"11","tags":"organizational-structure, efficiency, knowledge, competitive-advantage"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"A leadership team is a small group of people who are collectively responsible for achieving a common objective for their organization.","page":"21","tags":"management, organizational-structure, accountability, collective-responsibility"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"When everyone on a team knows that everyone else is vulnerable enough to say and mean those things, and that no one is going to hide his or her weaknesses or mistakes, they develop a deep and uncommon sense of trust. They speak more freely and fearlessly with one another and don’t waste time and energy putting on airs or pretending to be someone they’re not.","page":"27","tags":"trust, organizational-structure, transparency, culture"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"When there is trust, conflict becomes nothing but the pursuit of truth, an attempt to find the best possible answer. It is not only okay but desirable. Conflict without trust, however, is politics, an attempt to manipulate others in order to win an argument regardless of the truth.","page":"38","tags":"trust, truth, decision-making, organizational-structure"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"Most people are generally reasonable and can rally around an idea that wasn’t their own as long as they know they’ve had a chance to weigh in. But when there has been no conflict, when different opinions have not been aired and debated, it becomes virtually impossible for team members to commit to a decision, at least not actively.","page":"49","tags":"decision-making, commitment, organizational-structure, participation"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"An organization’s strategy is simply its plan for success. It’s nothing more than the collection of intentional decisions a company makes to give itself the best chance to thrive and differentiate from competitors. That means every single decision, if it is made intentionally and consistently, will be part of the overall strategy.","page":"107-108","tags":"strategy, competitive-advantage, decision-making, consistency"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"Bringing the right people into an organization, and keeping the wrong ones out, is as important as any activity that a leadership team must oversee… Hiring without clear and strict criteria for cultural fit greatly hampers the potential for success.","page":"156","tags":"management, culture, selectivity, organizational-structure"},{"book":"The Advantage","author":"Patrick Lencioni","year":"2012","text":"Direct, personal feedback really is the simplest and most effective form of motivation.","page":"167","tags":"management, communication, motivation, feedback"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"The arrival fallacy is the false assumption that reaching some achievement or goal will create durable feelings of satisfaction and contentment in our lives.","page":"7","tags":"happiness, gratification, expectations, psychology"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"Your entire life can change in one year. Not ten, not five, not three. One. One year of asking the right questions. One year of measuring and prioritizing the right things. One year of focused, daily effort on the right actions.","page":"12","tags":"focus, time-horizon, priorities, action"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"Once you’ve achieved a baseline level of financial well-being, more money is unlikely to meaningfully affect your overall happiness. In other words, the default scoreboard—focused on money—may be a useful asset in the earliest days of your journey, but it is a liability when you’re attached to it in the later days.","page":"20","tags":"wealth, happiness, perspective, priorities"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"The most important lesson, the one that sits at the heart of this book: Your wealthy life may be enabled by money, but in the end, it will be defined by everything else.","page":"21","tags":"wealth, values, life-philosophy, perspective"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"The Five Types of Wealth:\n1.\tTime Wealth\na.\tTime Wealth is the freedom to choose how to spend your time, whom to spend it with, where to spend it, and when to trade it for something else.\n2.\tSocial Wealth\na.\tSocial Wealth is the connection to others in your personal and professional worlds—the depth and breadth of your connection to those around you.\nb.\tSocial Wealth is defined by a few deep, meaningful, healthy relationships and a fulfilling breadth of surface ties throughout your community or culture.\n3.\tMental Wealth\na.\tMental Wealth is the connection to a higher-order purpose and meaning that provides motivation and guides your short- and long-term decision making.\n4.\tPhysical Wealth\na.\tPhysical Wealth is your health, fitness, and vitality.\n5.\tFinancial Wealth\na.\tFinancial Wealth is typically defined as financial assets minus financial liabilities, a figure often referred to as net worth. On your new scoreboard, there is an added nuance: Your liabilities include your expectations of what you need, your definition of enough.","page":"25-27","tags":"wealth, time, relationships, priorities"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"You do not rise to the level of your goals. You fall to the level of your systems. Systems are the daily actions that create forward progress. Leverage amplifies the output of a single unit of input. Combining the two ideas, high-leverage systems are the daily actions that create amplified, asymmetric forward progress.","page":"46","tags":"systems, leverage, habits, compounding"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"The three core pillars of Time Wealth:\nAwareness: an understanding of the finite, impermanent nature of time.\nAttention: The ability to direct your attention and focus on the things that matter (and ignore the rest)\nControl: The freedom to own your time and choose exactly how to spend it.","page":"78","tags":"time, attention, focus, priorities"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"The paradox of time: You are subconsciously aware of the immense value of your time, but you regularly and consciously take actions that disregard that value… You know how important your time is, yet you ignore its passage and engage in low-value activities that pull you away from the things that really matter.","page":"79","tags":"time, priorities, trade-offs, self-awareness"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"Outcomes follow attention. Scattered attention leads to random, ordinary outcomes; concentrated attention leads to focused, extraordinary outcomes.","page":"82","tags":"attention, focus, outcomes, discipline"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"The freedom to allocate time according to your preferences—to choose how you spend it, where you spend it, and whom you spend it with—is the ultimate goal. This is the desired end state of true control over your time.","page":"84","tags":"time, independence, priorities, control"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"Work on big projects in one- to three-hour focus blocks. Get a simple focus app on your computer or phone and set the timer. Start at sixty minutes and work your way up. The time constraint will make you more efficient, and the breaks in between will reset your mental energy.","page":"101","tags":"focus, productivity, discipline, systems"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"When you establish long fixed hours to do your work, you find unproductive ways to fill it—you work longer but get less done. The better way, to paraphrase entrepreneur Naval Ravikant, is to work like a lion: Sprint, rest, repeat.","page":"101","tags":"productivity, efficiency, focus, work"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"The concept of time-blocking is simple: Windows of time are blocked to work on distinct, specific tasks. Rather than manage your life through a to-do list, you manage your life through your calendar… Planning your day in this manner will allow you to focus deeply on the specific task at hand, limit the negative impact of distractions, and give you a degree of control over what you do and when you do it.","page":"116","tags":"planning, focus, discipline, systems"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"Investing in your Social Wealth now through daily, deliberate actions to improve your social fitness is the clearest path to developing a life rich in connections, from depth to breadth and beyond.","page":"150","tags":"relationships, habits, continuous-improvement"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"Depth is built through three primary actions, behaviors, and attitudes:\nHonesty: Sharing your inner truth and weakness, listening to theirs.\nSupport: Sitting in the darkness during their struggle.\nShared Experience: Encountering positive and negative experiences together.","page":"151","tags":"relationships, trust, honesty, experience"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"Mental Wealth is about building on the foundation of curiosity that encourages you to search, explore, question, and learn. It is through curiosity that you go on the journey to uncover and live by your purpose, unlock new insights and lifelong growth, and seek out the space necessary to think, reset, wrestle with questions, and recharge.","page":"207","tags":"curiosity, learning, self-awareness, purpose"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"The fight against normalcy is the most important fight of your life. To maintain your uniqueness, to live on your terms in a world that pulls you to blend in, is the only way to realize your full potential and live a fulfilled, texture-rich existence.","page":"215","tags":"independence, authenticity, contrarian, self-awareness"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"If you want to get better at anything, do it for thirty minutes per day for thirty straight days. It’s easy to over-engineer progress; a little dedicated effort each day is all you need. Nine hundred minutes of accumulated effort is enough for you to make dramatic improvements in literally anything.","page":"230","tags":"habits, discipline, continuous-improvement, persistence"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"Frugality, quite simply, is about choosing the things you love enough to spend extravagantly on—and then cutting costs mercilessly on the things you don’t love.","page":"341","tags":"priorities, discipline, trade-offs, simplicity"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"If you want to make a lot of money, stop focusing on your investments, stop focusing on your plan, stop focusing on your strategy, and start focusing on how you can create immense value for everyone around you. If you do that, the money will follow.","page":"346","tags":"value-creation, service, priorities, wealth"},{"book":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","text":"Build a Reputation for Figuring It Out. \nAt every step of your career, you’ll be given a lot of tasks you have no idea how to complete. Impostor syndrome will inevitably set in—you’ll wonder how you can possibly do this thing that you’ve never done before (let alone do it well!). There’s nothing more valuable than someone who can just figure it out. Ask the key questions, do some work, get it done. If you do that, people will fight over you.","page":"347","tags":"learning, adaptation, reputation, problem-solving"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"Acquire worldly wisdom and adjust your behavior accordingly. If your new behavior gives you a little temporary unpopularity with your peer group… then to hell with them.","page":"5","tags":"independent-thinking, wisdom, contrarian, behavior"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"It’s kind of fun to sit there and outthink people who are way smarter than you are because you’ve trained yourself to be more objective and more multidisciplinary. Furthermore, there is a lot of money in it, as I can testify from my own personal experience.","page":"59","tags":"mental-models, discipline, objectivity, edge"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"We have three baskets for investing: yes, no, and too tough to understand. To identify potential ‘yes’ candidates, Charlie looks for an easy-to-understand, dominant business franchise that can sustain itself and thrive in all market conditions.","page":"59","tags":"circle-of-competence, business-quality, selectivity, simplicity"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"While poor outcomes are excusable in the Munger-Buffett world—given the fact that some outcomes are outside of their control—sloppy preparation and decision-making are never excusable because they are controllable…he practices extreme patience combined with extreme decisiveness.","page":"62","tags":"patience, discipline, due-diligence, decisiveness"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"An Investing Principles Checklist\n\nPreparation\n•\tThe only way to win is to work, work, work, work, and hope to have a few insights.\n•\tDevelop into a lifelong self-learner through voracious reading: cultivate curiosity and strive to become a little wiser every day.\n•\tIf you want to get smart, the question you have to keep asking is ‘Why, why, why?’\n\nIntellectual Humility\n•\tAbove all, never fool yourself, and remember that you are the easiest person to fool.\n\nAllocation\n•\tProper allocation of capital is an investor’s number one job.\n•\tRemember that the highest and best use is always measured by the next best use (opportunity cost).\n•\tGood ideas are rare—when the odds are greatly in your favor, bet (allocate) heavily.\nDon’t fall in love with an investment—be situation dependent and opportunity-driven..\n\nPatience\n•\tBe alert for the arrival of luck.\n\nDecisiveness\n•\tWhen proper circumstances present themselves, act with decisiveness and conviction.\n•\tOpportunity doesn’t come often, so seize it when it does.\n•\tOpportunity meeting the prepared mind—that’s the game.","page":"64-65","tags":"continuous-learning, curiosity, preparation, checklist"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"We’re partial to out large amounts of money where we won’t have to make another decision. If you buy something because it’s undervalued, then you have to think about selling it when it approaches your calculation of intrinsic value. That’s hard. But if you can buy a few great companies, then you can sit on your ass. That’s a good thing.","page":"67","tags":"business-quality, patience, compounding, decision-making"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"[My first prescription for misery is to] be unreliable. Do not faithfully do what you have engaged to do. If you will only master this one habit, you will more than counterbalance the combined effect of all your virtues, howsoever great. If you like being distrusted and excluded from the best human contribution and company, this prescription is for you.","page":"77","tags":"reliability, trust, integrity, character"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"My second prescription for misery is to learn everything you possibly can from your own experience, minimizing what you learn vicariously from the good and bad experiences of others, living and dead. This prescription is a sure-shot producer of misery and second-rate achievement.","page":"77","tags":"learning, experience, humility, transfer-of-knowledge"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"My third prescription to you for misery is to go down and stay down when you get your first, second, or third severe reverse in the battle of life.","page":"78","tags":"resilience, adversity, persistence, temperament"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"The constant curse of scale is that it leads to big, dumb bureaucracy—which, of course, reaches its highest and worst form in government, where the incentives are really awful.","page":"94","tags":"economies-of-scale, incentives, government, organizational-structure"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"Every person is going to have a circle of competence. And it’s going to be very hard to enlarge that circle… So you have to figure out what your own aptitudes are. If you play games where other people have the aptitudes and you don’t, you’re going to lose. And that’s as close to certain as any prediction you can make. You have to figure out where you’ve got an edge. And you’ve got to play within your own circle of competence.","page":"101","tags":"circle-of-competence, self-knowledge, selectivity, competitive-advantage"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"Is the stock market so efficient that people can’t beat it? Well, the efficient-market theory is obviously roughly right, meaning that markets are quite efficient and it’s quite hard for anybody to beat the market by significant margins as a stock picker by just being intelligent and working in a disciplined way.","page":"102","tags":"efficient-market-theory, market-inefficiency, difficulty, outperformance"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"The model I like—to sort of simplify the notion of what goes on in a market for common stocks—is the pari-mutuel system at the racetrack. If you stop to think about it, a pari-mutuel system is a market. Everybody goes there and bets, and the odds change based on what’s bet. That’s what happens in the stock market. Any damn fool can see that a horse carrying a light weight with a wonderful win rate and a good post position, etc., etc., is way more likely to win than a horse with a terrible record and extra weight and so on and so on. But if you look at the damn odds, the bad horse pays 100 to 1, whereas the good horse pays 3 to 2. Then it’s not clear which is statistically the best bet… The prices change in such a way that it’s very hard to beat the system.","page":"102","tags":"markets, pricing, supply-demand, mr-market"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"It’s not given to human beings to have such talent that they can just know everything about everything all the time. But it is given to human beings who work hard at it—who look and sift the world for a mispriced bet—that they can occasionally find one. And the wise ones bet heavily when the world offers them that opportunity. They bet big when they have the odds. And the rest of the time, they don’t. It’s just that simple.","page":"104","tags":"selectivity, mispricing, concentration, opportunity"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"How many insights do you need? Well, I’d argue that you don’t need many in a lifetime. If you look at Berkshire Hathaway and all of its accumulated billions, the top 10 insights account for most of it.","page":"104","tags":"concentration, selectivity, insights, simplicity"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"So you can get very remarkable investment results if you think more like a winning pari-mutuel player. Just think of it as heavy-odds-against game full of bullshit and craziness with an occasional mispriced something or other. And you’re probably not going to be smart enough to find thousands in a lifetime. And when you get a few, you really load up. It’s just that simple.","page":"105","tags":"selectivity, patience, market-inefficiency, discipline"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"In the stock market, some railroad that’s beset by better competitors and tough unions may be available at one-third of its book value. In contrast, IBM in its heyday might be selling at six times book value. So it’s just like the pari-mutuel system. Any damn fool could plainly see that IBM had better business prospects than the railroad. But once you put the price into the formula, it wasn’t so clear anymore what was going to work best for a buyer choosing between the stocks. So it’s a lot like a pari-mutuel system. And, therefore, it gets very hard to beat.","page":"106","tags":"business-quality, valuation, comparative-analysis, obvious"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"Over the long term, it’s hard for a stock to earn a much better return than the business that underlies it earns. If the business earns 6 percent on capital over 40 years and you hold it for that 40 years, you’re not going to make much different than a 6 percent return, even if you originally buy it at a huge discount. Conversely, if a business earns 18 percent on capital over 20 or 30 years, even if you pay an expensive-looking price, you’ll end up with one hell of a result.","page":"110","tags":"return-on-capital, long-term, business-quality, compounding"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"You do get an occasional opportunity to get into a wonderful business that’s being run by a wonderful manager. And, of course, that’s hog heaven day. If you don’t load up when you get those opportunities, it’s a big mistake.","page":"111","tags":"concentration, opportunity, management, business-quality"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"How do you get worldly wisdom? What system do you use to rise into the tiny top percentage of the world in terms of having sort of an elementary, practical wisdom?... What you need is a latticework of mental models in your head. And you hand your actual experience and your vicarious experience that you get from reading and so forth on this latticework of powerful models. And with that system, things gradually get to fit together in a way that enhances cognition.","page":"123","tags":"mental-models, learning, experience, worldview"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"Ideology does some strange things and distorts cognition terribly. If you get a lot of heavy ideology young, and then you start expressing it, you are really locking your brain into a very unfortunate pattern. And you are going to distort your general cognition.","page":"129","tags":"ideology, cognition, independent-thinking, rigidity"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"You must stop slop early. It’s very hard to stop slop and moral failure if you let it run for a while.","page":"136","tags":"ethics, discipline, slippery-slope, early-action"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"What makes investment hard is that it’s easy to see that some companies have better businesses than others. But the price of the stock goes up so high that all of a sudden, the question of which stock is the best to buy gets quite difficult.","page":"136","tags":"valuation, price-vs-value, business-quality, difficulty"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"Each of you will have to figure out where your talents lie. And you’ll have to use your advantages. But if you try to succeed in what you’re worst at, you’re going to have a very lousy career. I can almost guarantee it.","page":"139","tags":"circle-of-competence, self-knowledge, comparative-advantage, success"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"I believe in the discipline of mastering the best that other people have ever figured out. I don’t believe in just sitting down and trying to dream it all up yourself. Nobody’s that smart.","page":"160","tags":"learning, mental-models, humility, continuous-learning"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"There’s too much emphasis on macroeconomics and not enough on microeconomics. I think this is wrong. It’s like trying to master medicine without knowing anatomy and chemistry. Also, the discipline of microeconomics is a lot of fun. It helps you correctly understand macroeconomics, and it’s a perfect circus to do. In contrast, I don’t think macroeconomics people have all that much fun. For one thing, they are often wrong because of extreme complexity in the system they wish to understand.","page":"244","tags":"economics, microeconomics, first-principles"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"Self-pity is always counterproductive. It’s the wrong way to think. And when you avoid it you get a great advantage over everybody else, or almost everybody else, because self-pity is a standard response. And you can train yourself out of it.","page":"275","tags":"temperament, psychology, self-awareness, resilience"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"Another thing that I have found is that intense interest in any subject is indispensable if you’re really going to excel in it. I could force myself to be fairly good in a lot of things, but I couldn’t excel in anything in which I didn’t have an intense interest. So, to some extent, you’re going to have to do as I did. If at all feasible, you want to maneuver yourself into doing something in which you have an intense interest.","page":"278-279","tags":"passion, excellence, circle-of-competence"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"A great and simple precaution in life: Never, ever, think about something else when you should be thinking about the power of incentives.","page":"295","tags":"incentives, focus, psychology"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"The brain of man conserves programming space by being reluctant to change, which is a form of inconsistency avoidance… Few people can list a lot of bad habits that they have eliminated, and some people cannot identify even one of these. Instead, practically everyone has a great many of bad habits he has long maintained despite their being known bad… The rare life that is wisely lives has in it many good habits maintained and bad habits avoided or cured… inconsistency-avoidance tendency makes it much easier to prevent a habit than to change it.","page":"306","tags":"psychology, habits, cognitive-bias, self-improvement"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"It is easy to see that a quickly reached conclusion, triggered by doubt-avoidance tendency, when combined with a tendency to resist any change in that conclusion, will naturally cause of lot of errors in cognition for modern man.","page":"307","tags":"cognitive-bias, decision-making, mistakes"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"Learn how to ignore the examples from others when they are wrong, because few skills are more worth having.","page":"333","tags":"independent-thinking, judgment, contrarian"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"Throughout his life, a wise man engages in practice of all his useful, rarely used skills, many of them outside his discipline, as a sort of duty to his better self.","page":"338","tags":"continuous-improvement, preparation, discipline"},{"book":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","text":"It is essential for a thinking man to assemble his skills into a checklist that he routinely uses. Any other mode of operation will cause him to miss much that is important. Skills of a very high order can be maintained only with daily practice.","page":"338","tags":"checklist, discipline, mental-models"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The greatest investment reward comes to those who by good luck or good sense find the occasional company that over the years can grow in sales and profits far more than the industry as a whole... such companies need not be young and small. Instead, regardless of size, what really counts is a management having both a determination to attain further important growth and an ability to bring its plans to completion.","page":"14","tags":"growth, management, business-quality, long-term"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 1. Does the company have products or services with sufficient market potential to make possible a sizable increase in sales for at least several years?","page":"19","tags":"growth, market-potential, product-analysis"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Not even the most outstanding growth companies need necessarily be expected to show sales for every single year larger than those of the year before... The vagaries of the business cycle will also have a major influence on year-to-year comparisons. Therefore growth should not be judged on an annual basis but, say, by taking units of several years each. Certain companies give promise of greater than normal growth not only for the next several-year period, but also for a considerable time beyond that.","page":"20","tags":"growth, cyclicals, long-term, context"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The investor must be alert as to whether the management is and continues to be of the highest order of ability; without this, the sales growth will not continue. Correctly judging the long-range sales curve of a company is of extreme importance to the investor.","page":"22","tags":"management, growth, long-term"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 2. Does the management have a determination to continue to develop products or processes that will still further increase total sales potentials when the growth potentials of currently attractive product lines have largely been exploited?","page":"25","tags":"innovation, management, growth, reinvestment"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 3. How effective are the company's research and development efforts in relation to its size?","page":"26","tags":"innovation, research-development, business-quality"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 4. Does the company have an above-average sales organization?","page":"31","tags":"sales-organization, competitive-advantage, business-quality"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 5. Does the company have a worthwhile profit margin?","page":"34","tags":"profitability, margins, business-quality"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Marginal companies--that is, those with smaller profit margins--nearly always increase their profit margins by a considerably greater percentage in the good years than do the lower-cost companies, whose profit margins also get better but not to so great a degree... However, it should also be remembered that these earnings will decline correspondingly more rapidly when the business tide turns. For this reason I believe the greatest long-range investment profits are never obtained by investing in marginal companies.","page":"34","tags":"margins, cyclicals, cost-advantage, business-quality"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 6. What is the company doing to maintain or improve profit margins?","page":"35","tags":"margins, profitability, competitive-advantage"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The success of a stock purchase does not depend on what is generally known about a company at the time the purchase is made. Rather it depends upon what gets to be known about it after the stock has been bought. Therefore it is not the profit margins of the past but those of the future that are basically important to the investor.","page":"36","tags":"future-orientation, information-advantage, long-term, profitability"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"When profit margins of a whole industry rise because of repeated price increases, the indication is not a good one for the long-range investor.","page":"37","tags":"pricing, margins, sustainability, contrarian"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 7. Does the company have outstanding labor and personnel relations?","page":"37","tags":"management, labor, corporate-culture, business-quality"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 8. Does the company have outstanding executive relations?","page":"39","tags":"management, corporate-governance, organizational-structure"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 9. Does the company have depth to its management?","page":"40","tags":"management, succession-planning, organizational-depth"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Sooner or later a company will reach a size where it just will not be able to take advantage of further opportunities unless it starts developing executive talent in some depth.","page":"41","tags":"management, scalability, growth, organizational-depth"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 10. How good are the company's cost analysis and accounting controls?","page":"42","tags":"accounting, cost-analysis, business-quality, management"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 11. Are there other aspects of the business, somewhat peculiar to the industry involved, which will give the investor important clues as to how outstanding the company may be in relation to its competition?","page":"43","tags":"competitive-advantage, industry-analysis, business-quality"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 12. Does the company have a short-range or long-range outlook in regard to profits?","page":"45","tags":"long-term, management, time-horizon"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 13. In the foreseeable future will the growth of the company require sufficient equity financing so that the larger number of shares outstanding will largely cancel the existing stockholders' benefit from this anticipated growth?","page":"46","tags":"dilution, equity-financing, shareholder-value"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"It is the basic contention of this book that the intelligent investor should not buy common stocks simply because they are cheap but only if they give promise of major gain to him.","page":"46","tags":"value-investing, price-vs-value, upside-potential"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 14. Does the management talk freely to investors about its affairs when things are going well but 'clam up' when troubles and disappointments occur?","page":"47","tags":"transparency, management, corporate-governance, integrity"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Point 15. Does the company have a management of unquestionable integrity?","page":"49","tags":"integrity, management, character, trust"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The management of a company is always far closer to its assets than is the stockholder. Without breaking any laws, the number of ways in which those in control can benefit themselves and their families at the expense of the ordinary stockholder is almost infinite.","page":"49","tags":"principal-agent, corporate-governance, shareholder-value, alignment"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Regardless of how high the rating may be in all other matters, however, if there is a serious question of the lack of a strong management sense of trusteeship for stockholders, the investor should never seriously consider participating in such an enterprise.","page":"50","tags":"integrity, management, shareholder-value, trust"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The typical investor has usually gathered a good deal of half-truths, misconceptions, and just plain bunk that the general public has gradually accumulated about successful investing.","page":"51","tags":"misconceptions, epistemology, investor-education"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The company into which the investor should be buying is the company which is doing things under the guidance of exceptionally able management. A few of these things are bound to fail. Others will from time to time produce unexpected troubles before they succeed. The investor should be thoroughly sure in his own mind that these troubles are temporary rather than permanent. Then if these troubles have produced a significant decline in the price of the affected stock and give promise of being solved in a matter of months rather than years, he will probably be on pretty safe ground in considering that this is a time when the stock may be bought.","page":"73","tags":"management, mistakes, patience, long-term"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"I believe there are three reasons, and three reasons only, for the sale of any common stock which has been originally selected according to the investing principles already discussed.\n1. When a mistake has been made in the original purchase and it becomes increasingly clear that the factual background of the particular company is, by a significant margin, less favorable than originally believed. \n2. Sales should always be made of the stock of a company which, because of changes resulting from the passage of time, no longer qualifies in regard to the fifteen points outlined in Chapter Three to about the same degree it qualified at the time of purchase.\n3. If the evidence is clear-cut and the investor feels quite sure of his ground, it will, even after paying capital gains taxes, probably pay him handsomely to switch into [a] situation with seemingly better prospects.","page":"77-80","tags":"sell-discipline, mistakes, portfolio-management, decision-making"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"More money has probably been lost by investors holding a stock they really did not want until they could 'at least come out even' than from any other single reason.","page":"78","tags":"psychology, losses, mistakes, anchoring"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Once a stock has been properly selected and has borne the test of time, it is only occasionally that there is any reason for selling it at all.","page":"81","tags":"patience, long-term, hold-discipline, selectivity"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"How can anyone say with even moderate precision just what is overpriced for an outstanding company with an unusually rapid growth rate?","page":"83","tags":"valuation, growth, difficulty"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"If the job has been correctly done when a common stock is purchased, the time to sell it is--almost never.","page":"85","tags":"hold-discipline, long-term, patience"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"When do stockholders get no benefit from retained earnings? One way is when managements pile up cash and liquid assets far beyond any present or prospective needs of the business.","page":"87","tags":"retained-earnings, capital-allocation, management"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"There is another and more serious way in which earnings are frequently retained in the business without any significant benefit to stockholders. This occurs when substandard managements can get only a subnormal return on the capital already in the business, yet use the retained earnings merely to enlarge the inefficient operation rather than make it better.","page":"87","tags":"return-on-capital, management, capital-allocation"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Worthy of repetition here is that over a span of five to ten years, the best dividend results will come not from high-yield stocks but from those with the relatively low yield. So profitable are the results of the ventures opened up by exceptional managements that while they still continue the policy of paying out a low proportion of current earnings, the actual number of dollars paid out progressively exceed what could have been obtained from high-yield shares. Why shouldn't this logical and natural trend continue in the future?","page":"94","tags":"reinvestment, return-on-capital, long-term"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Close to the very heart of successful investing is finding companies which are developing new products and processes or exploiting new markets.","page":"95","tags":"innovation, growth, product-analysis"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Don't assume that the high price at which a stock may be selling in relation to earnings is necessarily an indication that further growth in those earnings has largely been already discounted in the price.","page":"102","tags":"valuation, growth, price-vs-value"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Don't quibble over eighths and quarters... If the stock seems the right one and the price seems reasonably attractive at current levels, buy 'at the market.' The extra eighth, or quarter, or half point that may be paid is insignificant compared to the profit that will be missed if the stock is not obtained.","page":"104-105","tags":"timing, conviction, price-vs-value"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Don't overstress diversification... Investors have been so oversold on diversification that fear of having too many eggs in one basket has caused them to put far too little into companies they thoroughly know and far too much in others about which they know nothing at all. It never seems to occur to them, much less to their advisors, that buying a company without having sufficient knowledge of it may be even more dangerous than having inadequate diversification.","page":"107","tags":"concentration, circle-of-competence, diversification"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Practical investors usually learn their problem is finding enough outstanding investments, rather than choosing among too many. The occasional investor who does find more such unusual companies than he really needs seldom has the time to keep in close enough touch with all additional corporations.","page":"116","tags":"selectivity, concentration, opportunity"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Usually a very long list of securities is not a sign of the brilliant investor, but of one who is unsure of himself.","page":"116","tags":"concentration, conviction, diversification"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"In the field of common stocks, a little bit of a great many can never be more than a poor substitute for a few of the outstanding.","page":"116","tags":"concentration, selectivity, quality"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"There are certain superficial financial statistics which are frequently given an undeserved degree of attention by many investors... Foremost among such statistics are the price ranges at which a stock has sold in former years. For some reason, the first thing many investors want to see when they are considering buying a particular stock is a table giving the highest and lowest price at which that stock has sold in each of the past five or ten years. They go through a sort of mental mumbo-jumbo, and come up with a nice round figure which is the price they are willing to pay for the particular stock. Is this illogical? Is it financially dangerous? The answer to both questions is emphatically yes.","page":"119","tags":"anchoring, valuation, mistakes"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"What makes the price at which a stock sells? It is the composite estimate at that moment of what all those interested think the corrective value of such shares may be.","page":"119","tags":"pricing, markets, perception"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The price at which the stock sold four years ago may have little or no real relationship to the price at which it sells today. The company may have developed a host of able new executives, a series of new and highly profitable products, or any number of similar desirable attributes that make the stock intrinsically worth four times as much in relation to the price of other stocks as it was worth four years ago.","page":"120","tags":"business-quality, price-vs-value, change"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The fact that a stock has or has not risen in the last several years is of no significance whatsoever in determining whether it should be bought now. What does matter is whether enough improvement has taken place or is likely to take place in the future to justify importantly higher prices than those now prevailing.","page":"121","tags":"forward-looking, anchoring, intrinsic-value"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Many investors will give heavy weight to the per-share earnings of the past five years in trying to decide whether a stock should be bought. To look at the per-share earnings by themselves and give the earnings of four or five years ago any significance is like trying to get useful work from an engine which is unconnected to any device to which that engine's power is supposed to be applied. Just knowing, by itself, that four or five years ago a company's per-share earnings were either four times or a quarter of this year's earnings has almost no significance in indicating whether a particular stock should be bought or sold... [the investor] should keep in mind that it is the next five years' earnings, not those of the past five years, that now matter.","page":"121","tags":"forward-looking, earnings-quality, mistakes"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"It is my opinion that in almost any field nothing is worth doing unless it is worth doing right. When it comes to selecting growth stocks, the rewards for proper action are so huge and the penalty for poor judgement is so great that it is hard to see why anyone would want to select a growth stock based on the basis of superficial knowledge.","page":"141","tags":"due-diligence, standards, excellence"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"To be a truly conservative investment a company must be the low-cost producer or about as low a cost producer as any competitor. It must also give promise of continuing to be so in the future.","page":"152","tags":"cost-advantage, competitive-advantage, sustainability"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The greater than average profit margin should enable a company to earn enough to generate internally a significant part or perhaps all of the funds required for financing growth.","page":"153","tags":"margins, profitability, reinvestment"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The company that is rigid in its actions and is not constantly challenging itself has only one way to go, and that way is down.","page":"163","tags":"adaptation, innovation, organizational-culture, decline"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The company worthy of  farsighted investment will give priority to curtailing maximum immediate profits when there are genuine worthwhile opportunities for developing new products or processes or for starting new product lines or for any one of the hundred and one more mundane actions whereby a dollar spent today may mean many dollars earned in the future.","page":"168","tags":"long-term, reinvestment, innovation, means-vs-ends"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"A company that has annual sales three times its assets can have a lower profit margin but make a lot more money than one that needs to employ a dollar of assets in order to obtain each dollar of annual sales.","page":"171","tags":"return-on-assets, capital-intensity, margins, efficiency"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Every significant price move of any individual common stock in relation to stocks as a whole occurs because of a changed appraisal of that stock by the financial community.","page":"180","tags":"perception, consensus, price-vs-value, market-psychology"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Any individual stock does not rise or fall at any particular moment in time because of what is actually happening or will happen to that company. It rises or falls according to the current consensus of the financial community as to what is happening and will happen regardless of how far off this consensus may be from what is really occurring or will occur.","page":"181","tags":"perception, consensus, price-vs-value, market-psychology"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The conservative investor must be aware of the nature of the current financial-community appraisal of any industry in which he is interested. He should constantly be probing to see whether that appraisal is significantly more or less favorable than the fundamentals warrant.","page":"189","tags":"contrarian, mispricing, industry-analysis, independent-thinking"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"A basic investment rule: The further into the future profits will continue to grow, the higher the price-earnings ratio an investor can afford to pay. This rule, however, should be applied with great caution. It should never be forgotten that the actual variations in price-earnings ratio will result not from what will actually happen but from what the financial community currently believes will happen.","page":"191","tags":"valuation, growth, price-earnings-ratio, long-term"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"The only true test of whether a stock is 'cheap' or 'high' is not its current price in relation to some former price, no matter how accustomed we may have become to that former price, but whether the company's fundamentals are significantly more or less favorable than the current financial-community appraisal of that stock.","page":"194","tags":"anchoring, intrinsic-value, fundamentals, contrarian"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"After a very sharp advance, a stock nearly always looks too high to the financially untrained.","page":"235","tags":"psychology, perception, investor-education, contrarian"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"Most of us are or should be investors, not traders. We should be seeking investment opportunities with unusual prospects over the long run and avoiding investment opportunities with poorer prospects. This has always been the central tenant of my approach to investments in any case. I do not believe that prices are efficient for the diligent, knowledgeable, long-term investor.","page":"240","tags":"long-term, value-investing, selectivity, patience"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"For those primarily seeking major appreciation of their capital, de-emphasize the importance of dividends. The most attractive opportunities are most likely to occur in the profitable, but low or no dividend payout groups. Unusual opportunities are much less likely to be found in situations where high percentage of profits is paid to stockholders.","page":"248","tags":"reinvestment, capital-allocation, growth, dividends"},{"book":"Common Stocks and Uncommon Profits","author":"Philip Fisher","year":"1996","text":"There are a relatively small number of truly outstanding companies. Their shares frequently can't be bought at attractive prices. Therefore, when favorable prices exist, full advantage should be taken of the situation. Funds should be concentrated in the most desirable opportunities.","page":"249","tags":"concentration, selectivity, timing, quality"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"There is no amount of security analysis that is going to tell you a stock can be a 100-bagger. It takes vision and imagination and a forward-looking view into what a business can achieve and how big it can get. Investing is a reductionist art, and he who can boil things down to the essential wins.","page":"40","tags":"vision, forward-looking, business-quality, simplicity"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Finding what will become a 100-bagger is as much about knowing what not to buy as it is about knowing what to buy. The universe of what won't work is large. Knocking out huge chunks of that universe will help make your search for 100-baggers easier.","page":"44","tags":"selectivity, subtractive-knowledge, circle-of-competence"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Those stocks that are most attractive on a net-present-value basis are the ones that can grow at a high rate. And to grow at an
