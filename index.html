ont of you with precise and genuine seriousness, tenderly, willingly, with justice. And on freeing yourself from all other distractions. Yes, you can—if you do everything as if it were the last thing you were doing in your life, and stop being aimless, stop letting your emotions override what your mind tells you, stop being hypocritical, self-centered, irritable.","page":"18","tags":"focus, discipline, present-moment, duty"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Yes, keep degrading yourself, soul. But soon your chance at dignity will be gone. Everyone gets one life. Yours is almost used up, and instead of treating yourself with respect, you have entrusted your own happiness to the souls of others.","page":"19","tags":"self-respect, responsibility, time-horizon, agency"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Ignoring what goes on in other people’s souls—no one over came to grief that way. But if you won’t keep track of what your own soul’s doing, how can you not be unhappy?","page":"19","tags":"self-knowledge, focus, responsibility, happiness"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"The longest-lived and those who will die soonest lose the same thing. The present is all that they can give up, since that is all you have, and what you do not have, you cannot lose.","page":"22","tags":"time, perspective, present-moment, mortality"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"You need to avoid certain things in your train of thought: everything random, everything irrelevant. And certainly everything self-important or malicious. You need to get used to winnowing your thoughts.","page":"29","tags":"focus, thinking, discipline, self-awareness"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"How to act:\nNever under compulsion, out of selfishness, without forethought, with misgivings\nNo surplus words or unnecessary actions.\nLet the spirit in you represent a man, an adult, a citizen, a Roman, a ruler. Taking up his post like a soldier and patiently awaiting his recall from life. Needing no oath or witness.\nCheerfulness. Without requiring other people’s help. Or serenity supplied by others.\nTo stand up straight—not straightened.","page":"30","tags":"character, discipline, integrity, duty"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"That things have no hold on the soul. They stand there unmoving, outside it. Disturbance comes only from within—from our own perceptions.","page":"38","tags":"perception, control, temperament, psychology"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Choose not to be harmed—and you won’t feel harmed.\nDon’t feel harmed—and you haven’t been.","page":"39","tags":"perception, choice, temperament, control"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Don’t be disturbed. Uncomplicate yourself.\nSomething happens to you. Good. It was meant for you by nature, woven into the pattern from the beginning.\nLife is short. That’s all there is to say. Get what you can from the present-thoughtfully, justly.\nUnrestrained moderation.","page":"43","tags":"temperament, acceptance, discipline, perspective"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Love the discipline you know, and let it support you. Entrust everything willingly to the gods, and then make your way through life—no one’s master and no one’s slave.","page":"44","tags":"discipline, acceptance, independence, trust"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Nothing that goes on in anyone else’s mind can harm you. Nor can the shifts and changes in the world around you. Then where is harm to be found? In your capacity to see it. Stop doing that and everything will be fine.","page":"46","tags":"perception, control, focus, harm"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"It’s unfortunate that this has happened. No. It’s fortunate that this has happened and I’ve remained unharmed by it—not shattered by the present or frightened of the future.","page":"48","tags":"perspective, reframing, resilience, fortune"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"So remember this principle when something threatens to cause you pain: the thing itself was no misfortune at all; to endure it and prevail is great good fortune.","page":"48","tags":"resilience, reframing, adversity"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Take the shortest route, the one that nature planned—to speak and act in the healthiest way. Do that, and be free of pain and stress, free of all calculation and pretension.","page":"49","tags":"simplicity, present-moment, focus"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"If the gods have made decisions about me and the things that happen to me, then they were good decisions. (It’s hard to picture a god who makes bad ones.) And why would they expend their energies on causing me harm? What good would it do them—or the world, which is their primary concern? And if they haven’t made decisions about me as an individual, they certainly have about the general welfare. And anything that follows from that is something I have to welcome and embrace.","page":"79","tags":"acceptance, trust, theodicy"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"When you need encouragement, think of the qualities the people around you have: this one’s energy, that one’s modesty, another’s generosity, and so on. Nothing is as encouraging as when virtues are visibly embodied in the people around us, when we’re practically showered with them. It’s good to keep this in mind.","page":"80","tags":"character, perspective, relationships"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Ambition means tying your well-being to what other people say or do. Self-indulgence means tying it to the things that happen to you. Sanity means tying it to your own actions. You don’t have to turn this into something. It doesn’t have to upset you. Things can’t shape our decisions by themselves.","page":"81","tags":"agency, self-awareness, independent-thinking"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"No one can keep you from living as your nature requires. Nothing can happen to you that is not required by Nature.","page":"82","tags":"acceptance, stoicism, nature"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Evil: the same old thing. No matter what happens, keep this in mind: It’s the same old thing, from one end of the world to the other. It fills the history books, ancient and modern, and the cities, and the houses too. Nothing new at all. Familiar, transient.","page":"85","tags":"history, perspective, human-nature"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"You don’t need much to live happily. And just because you’ve abandoned your hopes of becoming a great thinker or scientist, don’t give up on attaining freedom, achieving humility, serving others, obeying God.","page":"96","tags":"simplicity, humility, duty"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Other people’s wills are as independent of mine as their breath and bodies. We may exist for the sake of one another, but our will rules its own domain. Otherwise the harm they do would cause harm to me. Which is not what God intended—for my happiness to rest with someone else.","page":"113","tags":"independence, agency, responsibility"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"When you run up against someone else’s shamelessness, ask yourself this: Is a world without shamelessness possible? No. Then don’t ask the impossible. There have to be shameless people in the world. This is one of them. The same for someone vicious or untrustworthy, or with any other defect. Remembering that the whole class has to exist will make you more tolerant of its members.","page":"127","tags":"acceptance, human-nature, perspective"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Or by doing them a favor and expecting something return, instead of looking to the action itself for your reward. What else did you expect from helping someone out? Isn’t it enough that you’ve done what your nature demands? You want a salary for it too? As if your eyes expected a reward for seeing, or your feet for walking. That’s what they were made for. By doing what they were designed to do, they’re performing their function. Whereas humans were made to help others. And when we do help others—or help them to do something—we’re doing what we were designed for. We perform our function.","page":"128","tags":"duty, action, means-vs-ends"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Everything that happens is either endurable or not. If it’s endurable, then endure it. Stop complaining. If it’s unendurable… then stop complaining. Your destruction will mean its end as well. Just remember: you can endure anything your mind can make endurable, by treating it as in your interest to do so. In your interest or in your nature.","page":"132","tags":"resilience, reframing, endurance"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Mastery of reading and writing requires a master. Still more so life.","page":"156","tags":"learning, humility, experience"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"It never ceases to amaze me: we all love ourselves more than other people, but care more about their opinion than our own. If a god appeared to us—or a wise human being, even—and prohibited us from concealing our thoughts or imagining anything without immediately shouting it out, we wouldn’t make it through a single day. That’s how much we value other people’s opinions—instead of our own.","page":"162","tags":"independent-thinking, self-awareness, social-pressure"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"Domain dependence… Some people can understand an idea in one domain, say, medicine, and fail to recognize it in another, say, socioeconomic life. Or they get it in the classroom, but not in the more complicated texture of the street. Humans somehow fail to recognize situations outside the contexts in which they usually learn about them.","page":"38","tags":"context, mental-models, transfer-of-knowledge"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"Like tormenting love, some thoughts are so antifragile that you feed them by trying to get rid of them, turning them into obsessions. Psychologists have shown the irony of the process of thought control: the more energy you put into trying to control your ideas and what you think about, the more your ideas end up controlling you.","page":"49","tags":"psychology, paradox, control"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"If you are alive—something deep in your soul likes a certain measure of randomness and disorder… If I could predict what my day would exactly look like, I would feel a little bit dead.","page":"63","tags":"randomness, uncertainty, vitality"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"There exist the kind of people for whom life is some kind of project. After talking to them, you stop feeling good for a few hours; life starts tasting like food cooked without salt. I, a thrill-seeking human, have a bullshit detector that seems to match my boredom detector, as if we were equipped with a naturalistic filter, dullness-aversion.","page":"64","tags":"spontaneity, authenticity, life-philosophy"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"When you are fragile, you depend on things following the exact planned course, with as little deviation as possible—for deviations are more harmful than helpful… predictive systems cause fragility.","page":"71","tags":"fragility, flexibility, predictability"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"My characterization of a loser is someone who, after making a mistake, doesn’t introspect, doesn’t exploit it, feels embarrassed and defensive rather than enriched with a new piece of information, and tries to explain why he made the mistake rather than moving on.","page":"74","tags":"learning, mistakes, intellectual-humility"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"He who has never sinned is less reliable than he who has only sinned once. And someone who has made plenty of errors—though never the same error more than once—is more reliable than someone who has never made any.","page":"74","tags":"experience, mistakes, learning, reliability"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"For the economy to be antifragile and undergo what is called evolution, every single individual business must necessarily be fragile, exposed to breaking—evolution needs organisms (or their genes) to die when supplanted by others, in order to achieve improvement, or to avoid reproduction when they are not as fit as someone else.","page":"74","tags":"creative-destruction, fragility, evolution, competition"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"Ingenious interventionism is very pervasive across professions. Just as with the tonsillectomy, if you supply a typical copy editor with a text, he will propose a certain number of edits, say about five changes per page. Now accept his ‘corrections’ and give this text to another copy editor who tends to have the same average rate of intervention, and you will see that he will suggest an equivalent number of edits, sometimes reversing changes made by the previous editor. Fine a third editor, same.","page":"118","tags":"unintended-consequences, intervention, iatrogenics"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"A very rarely discussed property of data: it is toxic in large quantities—even in moderate quantities… The more frequently you look at data, the more noise you are disproportionally likely to get (rather than the valuable part, called the signal); hence the higher the noise-to-signal ratio.","page":"126","tags":"epistemology, noise-vs-signal, decision-making, information-advantage"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"Newspapers should be of two-line length on some days, two hundred pages on others—in proportion with the intensity of the signal. But of course they want to make money and need to sell us junk food. And junk food is iatrogenic.","page":"127","tags":"noise-vs-signal, information-advantage, media"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"Much of what other people know isn’t worth knowing. To this day I still have the instinct that the treasure, what one needs to know for a profession, is necessarily what lies outside the corpus, as far away from the center as possible. But there is something central in following one’s own direction in the selection of readings: what I was given to study in school I have forgotten; what I decided to read on my own, I still remember.","page":"248","tags":"independent-thinking, contrarian, circle-of-competence, learning"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"one cannot really tell if a successful person has skills, or if a person with skills will succeed—but we can pretty much predict the negative, that a person totally devoid of skills will eventually fail.","page":"303","tags":"negative-knowledge, inversion, prediction, skill"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"The greatest—and most robust—contribution to knowledge consists in removing what we think is wrong—subtractive epistemology. In life, antifragility is reached not by being a sucker.","page":"303","tags":"epistemology, negative-knowledge, inversion, subtractive-knowledge"},{"book":"Antifragile","author":"Nassim Taleb","year":"2012","text":"If there is something in nature you don’t understand, odds are it makes sense in a deeper way that is beyond your understanding. So there is a logic to natural things that is much superior to your own.","page":"349","tags":"humility, nature, intellectual-humility, lindy-effect"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"If you present yourself as defeated, then people will react to you as if you are losing. If you start to straighten up, then people will look at and treat you differently.","page":"26","tags":"self-respect, psychology, perception, agency"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Your nervous system responds in an entirely different manner when you face the demands of life voluntarily. You respond to a challenge, instead of bracing for catastrophe.","page":"27","tags":"agency, voluntary-action, temperament, psychology"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"To stand up straight with your shoulders back is to accept the terrible responsibility of life, with eyes wide open. It means deciding to voluntarily transform the chaos of potential into the realities of habitable order.","page":"27","tags":"responsibility, agency, action, courage"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Your Being is inexorably tied up with that of others, and your mistreatment of yourself can have catastrophic consequences for others.","page":"60","tags":"responsibility, relationships, duty, ethics"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"You are important to other people, as much to yourself. You have some vital role to play in the unfolding destiny of the world. You are, therefore, morally obliged to take care of yourself.","page":"62","tags":"self-respect, duty, responsibility, ethics"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"You must determine where you are going, so that you can bargain for yourself, so that you don’t end up resentful, vengeful and cruel. You have to articulate your own principles, so that you can defend yourself against others’ taking inappropriate advantage of you, and so that you are secure and safe while you work and play. You must discipline yourself carefully. You must keep the promises you make to yourself, and reward yourself, so that you can trust and motivate yourself.","page":"63","tags":"self-knowledge, standards, boundaries, discipline"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Don’t underestimate the power of vision and direction. These are irresistible forces, able to transform what might appear to be unconquerable obstacles into traversable pathways and expanding opportunities. Strengthen the individual. Start with yourself. Take care with yourself. Define who you are. Refine your personality. Choose your destination and articulate your Being. As the great nineteenth-century German philosopher Friedrich Nietzsche so brilliantly noted, ‘He whose life has a why can bear almost any how.’","page":"63","tags":"vision, focus, self-improvement, agency"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Before you help someone, you should find out why that person is in trouble. You shouldn’t merely assume that he or she is a noble version of unjust circumstances and exploitation. It’s the most unlikely explanation… It is far more likely that a given individual has just decided to reject the path upward, because of its difficulty.","page":"80","tags":"judgment, character, responsibility, due-diligence"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Success: that’s the mystery. Virtue: that’s what inexplicable. To fail, you merely have to cultivate a few bad habits. You just have to bide your time.","page":"81","tags":"discipline, habits, success-failure, self-awareness"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"You are not morally obliged to support someone who is making the world a worse place. Quite the opposite. You should choose people who want things to be better, not worse. It’s a good thing, not a selfish thing, to choose people who are good for you. It’s appropriate and praiseworthy to associate with people whose lives would be improved if they saw your life improve.","page":"82","tags":"partner-selection, character, standards, ethics"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"If you surround yourself with people who support your upward aim, they will not tolerate your cynicism and destructiveness. They will instead encourage you when you do good for yourself and others and punish you carefully when you do not.","page":"82","tags":"relationships, accountability, network, self-improvement"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Perhaps you are overvaluing what you don’t have and undervaluing what you do. There’s some real utility in gratitude. It’s also good protection against the dangers of victimhood and resentment.","page":"89","tags":"perspective, gratitude, psychology"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Thus, you set the following goal: by the end of the day, I want things in my life to be a tiny bit better than they were this morning. Then you ask yourself, ‘What could I do, that I would do, that would accomplish that, and what thing would I like as my reward?’ Then you do what you have decided to do, even if you do it badly. Then you give yourself that damn coffee, in triumph… And you do the same thing tomorrow, and the next day, and the next. And, with each day, your baseline comparison gets a little higher, and that’s magic… What you aim at determines what you see.","page":"96","tags":"continuous-improvement, action, self-improvement"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"If your life is not going well, perhaps it is your current knowledge that is insufficient, not life itself. Perhaps your value structure needs some serious retooling. Perhaps what you want is binding you to what else could be. Perhaps you are holding on to your desires, in the present, so tightly that you cannot see anything else—even what you truly need.","page":"99","tags":"self-knowledge, flexibility, learning"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"We must become conscious of our desires, and articulate them, and prioritize them, and arrange them into hierarchies.","page":"102","tags":"self-awareness, priorities, decision-making"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"It takes careful observation, and education, and reflection, and communication with others, just to scratch the surface of your beliefs. Everything you value is a product of unimaginably lengthy developmental processes, personal, cultural, and biological.","page":"103","tags":"self-knowledge, epistemology, culture"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"The Bible is, for better or worse, the foundational document of Western civilization (of Western values, Western morality, and Western conceptions of good and evil)… The Bible is a library composed of many books, each written and edited by many people… a selected, sequenced and finally coherent story written by no one and everyone over many thousands of years… Its careful, respectful study can reveal things to us about what we believe and how we do and should act that can be discovered in almost no other matter.","page":"104","tags":"culture, history, context"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Notice something that bothers you, that concerns you, that will not let you be, which you could fix, that you would fix. You can find such somethings by asking yourself (as if you genuinely want to know) three questions: ‘What is it that is bothering me?’ ‘Is that something I could fix?’ and ‘Would I actually be willing to fix it?’ If you find that the answer is ‘no,’ to any or all of the questions, then look elsewhere. Aim lower. Search until you find something that bothers you, that you could fix, that you would fix, and then fix it. That might be enough for the day.","page":"108","tags":"focus, action, agency"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Let the tasks for the day announce themselves for your contemplation… Ask yourself for a voluntary contribution. If you ask nicely, and listen carefully, and don’t try any treachery, you might be offered one. Do this every day, for a while. Then do it for the rest of your life. Soon you will find yourself in a different situation. Now you will be asking yourself, habitually, ‘What could I do, that I would do, to make Life a little better?","page":"109","tags":"focus, habits, continuous-improvement"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Aim high. Set your sights on the betterment of Being. Align yourself, in your soul, with Truth and the Highest Good. There is habitable order to establish and beauty to bring into existence. There is evil to overcome, suffering to ameliorate, and yourself to better.","page":"109","tags":"vision, standards, responsibility"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Ask, and ye shall receive. Knock, and the door will open. If you ask, as if you want, and knock, as if you want to enter, you may be offered the chance to improve your life, a little; a lot; completely—and with that improvement, some progress will be made in Being itself. Compare yourself to who you were yesterday, not to who someone else is today.","page":"111","tags":"action, continuous-improvement, agency"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"People who experience evil may certainly desire to perpetuate it, to pay it forward. But it is also possible to learn good by experiencing evil.","page":"153","tags":"learning, adversity, experience"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Start to stop doing what you know to be wrong.","page":"157","tags":"ethics, discipline, action"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Sometimes, when things are not going well, it’s not the world that’s the cause. The cause is instead that which is currently most valued, subjectively and personally… If the world you are seeing is not the world you want, therefore, it’s time to examine your values… It might even be time to sacrifice what you love best, so that you can become who you might become, instead of staying who you are.","page":"170","tags":"self-knowledge, priorities, responsibility"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"’Did what I want happen? No. Then my aim or my methods were wrong. I still have something to learn.’ That is the voice of authenticity. ‘Did what I want happen? No. Then the world is unfair. People are jealous, and too stupid to understand. It is the fault of something or someone else.’ That is the voice of inauthenticity.","page":"214","tags":"accountability, learning, rationalization"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Nietzsche said that a man’s worth was determine by how much truth he could tolerate. You are by no means only what you already know. You are also all that which you could know, if you only would. Thus, you should never sacrifice what you could be for what you are. You should never give up the better that resides within for the security you already have—and certainly not when you have already caught a glimpse, an undeniable glimpse, of something beyond.","page":"223","tags":"learning, courage, self-improvement"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"If you pay attention to what you do and say, you can learn and feel a state of internal division and weakness when you are misbehaving and misspeaking… If you pay attention, when you are seeking something, you will move towards your goal.","page":"224","tags":"self-awareness, discipline, focus"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"If you bend everything totally, blindly, and willfully towards the attainment of a goal, and only that goal, you will never be able to discover if another goal would serve you, and the world, better.","page":"225","tags":"flexibility, second-order-thinking, discovery"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Why remain vague, when it renders life stagnant and murky? Well, if you don’t know who you are, you can hide in doubt. Maybe you’re not a bad, careless, worthless person. Who knows? Not you. Particularly if you refuse to think about it—and you have every reason not to. But not thinking about something you don’t want to know about doesn’t make it go away. You are merely trading specific, particular, pointed knowledge of the likely finite list of your real faults and flaws for a much longer list of undefined potential inadequacies and insufficiencies.","page":"275","tags":"self-knowledge, courage, clarity"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"Don’t hide baby monsters under the carpet. They will flourish. They will grow large in the dark. Then, when you least expect it, they will jump out and devour you. You will descend into an indeterminate confusing hell, instead of ascending into the heaven of virtue and clarity. Courageous and truthful words will render your reality simple, pristine, well-defined and habitable.","page":"281","tags":"courage, problems, honesty"},{"book":"12 Rules for Life","author":"Jordan Peterson","year":"2018","text":"You must determine where you are going in your life, because you cannot get there unless you move in that direction. Random wandering will not move you forward. It will instead disappoint and frustrate you and make anxious and unhappy and hard to get with (and then resentful, and then vengeful, and then worse). Say what you mean, so that you can find out what you mean. Act out what you say, so you can find out what happened. Then pay attention. Note your errors. Articulate them. Strive to correct them. That is how you discover the meaning of your life. That will protect you from the tragedy of your life. How could it be otherwise?","page":"283","tags":"vision, discipline, direction"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Criticism is futile because it puts a person on the defensive and usually makes him strive to justify himself. Criticism is dangerous because it wounds a person’s precious pride, hurts his sense of importance, and arouses resentment.","page":"5","tags":"human-nature, psychology, relationships, incentives"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"When dealing with people, let us remember we are not dealing with creatures of logic. We are dealing with creatures of emotion, creatures bristling with prejudices and motivated by pride and vanity.","page":"13","tags":"human-nature, psychology, decision-making, emotions"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Any fool can criticize, condemn, and complain—and most fools do.","page":"13","tags":"judgment, critical-thinking, human-nature"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Instead of condemning people, let’s try to understand them. Let’s try to figure out why they do what they do. That’s a lot more profitable and intriguing than criticism; and it breeds sympathy, tolerance and kindness.","page":"16","tags":"empathy, understanding, human-nature, decision-making"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"The only way I can get you to do anything is by giving you what you want. What do you want?... Dr. [John] Dewey said that the deepest urge in human nature is ‘the desire to be important.’","page":"17","tags":"incentives, human-nature, motivation, influence"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"The difference between appreciation and flattery? That is simple. One is sincere and the other insincere. One comes from the heart out; the other from the teeth out. One is unselfish; the other selfish. One is universally admired; the other universally condemned.","page":"27","tags":"integrity, sincerity, character, relationships"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"In our interpersonal relationships we should never forget that all our associates are human beings and hunger for appreciation. It is the legal tender that all souls enjoy.","page":"28","tags":"human-nature, relationships, appreciation, motivation"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Why talk about what we want? That is childish. Absurd. Of course, you are interested in what you want. You are eternally interested in it. But no one else is. The rest of us are just like you: we are interested in what we want. So the only way on earth to influence other people is to talk about what they want and show them how to get it.","page":"30-31","tags":"incentives, perspective, self-interest, influence"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Tomorrow you may want to persuade somebody to do something. Before you speak, pause and ask yourself: ‘How can I make this person want to do it?’","page":"33","tags":"persuasion, incentives, perspective, strategy"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"‘If there is one secret of success,’ said Henry Ford, ‘it lies in the ability to get the other person’s point of view and see things from that person’s angle as well as from your own.’","page":"35","tags":"perspective, empathy, success, decision-making"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"The world is full of people who are grabbing and self-seeking. So the rare individual who unselfishly tries to serve others has an enormous advantage.","page":"42","tags":"service, competitive-advantage, rarity, value-creation"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"‘First, arouse in the other person an eager want. He who can do this has the whole world with him. He who cannot walks a lonely way.’","page":"46","tags":"motivation, incentives, influence, success"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"You can make more friends in two months by becoming interested in other people than you can in two years by trying to get other people interested in you.","page":"52","tags":"relationships, service, interest, network"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"It is the individual who is not interested in his fellow men who has the greatest difficulties in life and produces the greatest injury to others. It is from among such individuals that all human failures spring.","page":"53","tags":"empathy, relationships, human-nature, failure"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"If we want to make friends, let’s put ourselves out to do things for other people—things that require time, energy, unselfishness and thoughtfulness.","page":"58","tags":"relationships, service, effort, generosity"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"You must have a good time meeting people if you expect them to have a good time meeting you.","page":"65","tags":"attitude, energy, relationships, reciprocity"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"You don’t like smiling? Then what? Two things. First, force yourself to smile. If you are alone, force yourself to whistle or hum a tune or sing. Act as if you were already happy, and that will tend to make you happy.","page":"67","tags":"psychology, behavior, habits, action"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"What is the secret, the mystery, of a successful business interview? Well, according to former Harvard president Charles W. Eliot, ‘There is no mystery about successful business intercourse… Exclusive attention to the person who is speaking to you is very important. Nothing else is so flattering as that.’","page":"82","tags":"attention, listening, relationships, communication"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"If you want to know how to make people shun you and laugh at you behind your back and even despise you, here is the recipe: Never listen to anyone for long. Talk incessantly about yourself. If you have an idea while the other person is talking, don’t wait for him or her to finish: bust right in and interrupt in the middle of a sentence… Bores, that is all they are—bores intoxicated with their own egos, drunk with a sense of their own importance.","page":"88","tags":"listening, self-awareness, relationships, mistakes"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"So if you aspire to be a good conversationalist, be an attentive listener. To be interesting, be interested. Ask questions that other persons will enjoy answering. Encourage them to talk about themselves and their accomplishments. Remember that the people you are talking to are a hundred times more interested in themselves and their wants and problems than they are in you and your problems. A person’s toothache means more to that person than a famine in China… Think of that the next time you start a conversation.","page":"88","tags":"listening, curiosity, relationships, communication"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Why prove to a man he is wrong? Is that going to make him like you? Why not let him save face? He didn’t ask for your opinion. He didn’t want it. Why argue with him?... Nine times out of ten, an argument ends with each of the contestants firmly convinced than ever that he is absolutely right. You can’t win an argument. You can’t because if you lose it, you lose it; and if you win it, you lose it.","page":"110","tags":"persuasion, arguments, human-nature"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Say about yourself all the derogatory things you know the other person is thinking or wants to say or intends to say—and say them before that person has a chance to say them. The chances are a hundred to one that generous, forgiving attitude will be taken and your mistakes will be minimized.","page":"129","tags":"persuasion, self-awareness, humility"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"La Rochefoucauld, the French philosopher, said: ‘If you want enemies, excel your friends; but if you want friends, let your friends excel you.’ Why is that true? Because when our friends excel us, they feel important; but when we excel them, they—or at least some of them—will feel inferior and envious.","page":"154","tags":"human-nature, envy, relationships"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Remember that other people may be totally wrong. But they don’t think so. Don’t condemn them. Any fool can do that. Try to understand them. Only wise, tolerant, exceptional people even try to do that.","page":"161","tags":"empathy, understanding, humility"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"The fact is that all people you meet have a high regard for themselves and like to be fine and unselfish in their own estimation… So, in order to change people, appeal to their nobler motives.","page":"175","tags":"human-nature, motivation, persuasion"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"The one major factor that motivated people was the work itself. If the work was exciting and interesting, the worked looked forward to doing it and was motivated to do a good job. That is what every successful person loves: the game. The chance for self-expression. The chance to prove his or her worth, to excel, to win. That is what makes footraces and hog-calling and pie-eating contests. The desire to excel. The desire for a feeling of importance.","page":"189","tags":"motivation, intrinsic-value, work"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Beginning with praise is like the dentist who begins his work with Novocain. The patient still gets a drilling, but the Novocain is pain-killing.","page":"198","tags":"persuasion, communication, criticism"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"It isn’t nearly so difficult to listen to a recital of your faults if the person criticizing begins by humbly admitting that he, too, is far from impeccable.","page":"204","tags":"humility, criticism, persuasion"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Asking questions not only makes an order more palatable; it often stimulates the creativity of the persons whom you ask. People are more likely to accept an order if they have had a part in the decision that caused the order to be issued.","page":"209","tags":"decision-making, participation, communication"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Even if we are right and the other person is definitely wrong, we only destroy ego by causing someone to lose face… ‘I have no right to say or do anything that diminishes a man in his own eyes. What matters is not what I think of him, but what he thinks of himself. Hurting a man in his dignity is a crime.’","page":"214","tags":"dignity, self-respect, empathy"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Remember, we all crave appreciation and recognition, and will do almost anything to get it. But nobody wants insincerity. Nobody wants flattery. Let me repeat: The principles taught in this book will work only when they come from the heart.","page":"219","tags":"sincerity, appreciation, human-nature"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"If you want to improve a person in a certain respect, act as though that particular trait were already one of his or her outstanding characteristics… Give them a fine reputation to live up to, and they will make prodigious efforts rather than see you disillusioned.","page":"222","tags":"reputation, expectations, motivation"},{"book":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","text":"Be sincere. Do not promise anything that you cannot deliver. Forget about the benefits to yourself and concentrate on the benefits to the other person.","page":"234","tags":"sincerity, other-focused, trust"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Countries such as Great Britain and the United States became rich because their citizens overthrew the elites who controlled power and created a society where political rights were much more broadly distributed, where the government was accountable and responsive to citizens, and where the great mass of people could take advantage of economic opportunities.","page":"4","tags":"institutions, accountability, wealth"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The Spanish strategy of colonization was highly effective. First perfected by Cortes in Mexico, it was based on the observation that the best way for the Spanish to subdue opposition was to capture the indigenous leader. This strategy enabled the Spanish to claim the accumulated wealth of the leader and coerce the indigenous peoples to give tribute and food. The next step was setting themselves up as the new elite of the indigenous society and taking control of the existing methods of taxation, tribute, and particularly, forced labor.","page":"11","tags":"strategy, history, exploitation"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Throughout the Spanish colonial world in the Americas, similar institutions and social structures emerged. After an initial phase of looting, and gold and silver lust, the Spanish created a web of institutions designed to exploit the indigenous peoples… designed to force indigenous people’s living standards down to a subsistence level and thus extract all income in excess of this for Spaniards… Though these institutions generated a lot of wealth for the Spanish Crown and made the conquistadors and their descendants very rich, they also turned Latin America into the most unequal continent in the world and sapped much of its economic potential.","page":"19","tags":"institutions, exploitation, incentives"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"In 1588, the lucky rout of the Spanish Armada, an attempt by King Philip II of Spanish to invade England, sent political shockwaves around Europe. Fortunate though England’s victory was, it was also a sign of growing English assertiveness on the seas that would enable them to finally take part in the quest for colonial empire. It is thus no coincidence that the English began their colonization of North America at the same time. But they were already latecomers. They chose North America not because it was attractive, but because it was all that was available. The ‘desirable’ parts of the Americas, where the indigenous population to exploit was plentiful and where the gold and silver mines were located, had already been occupied. The English got the leftovers.","page":"19","tags":"history, competition, fortune"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"There was no possibility of a get-rich-quick exploitation of Virginia along the lines of Mexico and Peru. There were no gold or precious metals, and the indigenous people could not be forced to work or provide food. Smith realized that if there were going to be a viable colony, it was the colonists who would have to work.","page":"23","tags":"incentives, labor, adaptation"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"If the indigenous peoples could not be exploited, reasoned the Virginia Company, perhaps the colonists could. The new model of colonial development entailed the Virginia Company owning all the land. Men were housed in barracks, and given company-determined rations. Work gangs were chosen, each one overseen by an agent of the company. It was close to martial law, with execution as the punishment of first resort.","page":"25","tags":"incentives, failure, coercion"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"It took the Virginia Company some time to recognize that its initial model of colonization did not work in Virginia… Starting in 1618, a dramatically new strategy was adopted. Since it was possible to coerce neither the locals nor the settlers, the only alternative was to give the settlers incentives. In 1618 the company began the ‘headright system,’ which gave each male settler fifty acres of land and fifty more acres for each member of his family and for all servants that a family could bring to Virginia… and in 1619 a General Assembly was introduced that effectively gave all adult men a say in the laws and institutions governing the colony. It was the start of democracy in the United States.","page":"26","tags":"incentives, adaptation, institutions"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"While in 1818 there were 338 banks in operation in the United States, with total assets of $160 million, by 1914 there were 27,864 banks, with total assets of $27.3 billion. Potential investors in the United States had ready access to capital to start their businesses. Moreover, the intense competition among banks and financial institutions in the United States meant that this capital was available at fairly low interest rates. The same was not true in Mexico. In fact, in 1910, the year in which the Mexican Revolution started, there were only forty-two banks in Mexico, and two of these controlled 60 percent of total banking assets.","page":"34","tags":"capital-allocation, competition, markets, financial-strength"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"In the United States a long series of legislative acts, ranging from the Land Ordinance of 1785 to the Homestead Act of 1862, gave broad access to frontier lands… In most Latin American countries, however, the political institutions there created a very different outcome. Frontier lands were allocated to the politically powerful and those with wealth and contacts, making such people even more powerful.","page":"37","tags":"institutions, resource-allocation, policy, history"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The enduring implications of the organization of colonial society and those societies’ institutional legacies shape the modern differences between the United States and Mexico.","page":"38","tags":"institutions, history, path-dependence"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The real reason that the Kongolese did not adopt superior technology was because they lacked any incentives to do so. They faced a high risk of all their output being expropriated and taxed by the all-powerful king… It might be true today that Africans trust each other less than people in other parts of the world. But this is an outcome of a long history of institutions which have undermined human and property rights in Africa.","page":"60","tags":"incentives, innovation, institutions, expropriation"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"After Ottoman rule collapsed, the Middle East was absorbed into the English and French colonial empires, which, again, stunted their possibilities. After independence, they followed much of the former colonial world by developing hierarchical, authoritarian political regimes with few of the political and economic institutions that, we will argue, are crucial for generating economic success… The relationship between the Islamic religion and poverty in the Middle East is largely spurious.","page":"61","tags":"institutions, history, government, concentrated-interests"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The final popular theory for why some nations are poor and some are rich is the ignorance hypothesis, which asserts that world inequality exists because we or our rulers do not know how to make poor countries rich. This idea if the one held by most economists.","page":"63","tags":"epistemology, ignorance-hypothesis, economics"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"It wasn’t differences in knowledge between later U.S. presidents, such as Teddy Roosevelt or Woodrow Wilson, and Porfirio Diaz that made Mexico choose economic institutions that enriched elites at the expense of the rest of society at the end of the nineteenth and beginning of the twentieth centuries while Roosevelt and Wilson did the opposite. Rather, it was the differences in the institutional constraints the countries’ presidents and elites were facing.","page":"66","tags":"institutions, incentives, policy, concentrated-interests"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The main obstacle to the adoption of policies that would reduce market failures and encourage economic growth is not the ignorance of politicians but the incentives and constraints they face from the political and economic institutions in their societies.","page":"67","tags":"incentives, institutions, policy, politics"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Countries differ in their economic success because of their different institutions, the rules influencing how the economy works, and the incentives that motivate people.","page":"73","tags":"institutions, incentives, economics"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Inclusive economic institutions… are those that allow and encourage participation by the great mass of people in economic activities that make best use of their talents and skills and that enable individuals to make the choices they wish. To be inclusive, economic institutions must feature secure private property, an unbiased system of law, and a provision of public services that provides a level playing field in which people can exchange and contract; it also must permit the entry of new businesses and allow people to choose their careers.","page":"74-75","tags":"institutions, incentives, property-rights, economics"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Secure property rights are central, since only those with such rights will be willing to invest and increase productivity. A businessman who expects his output to be stolen, expropriated, or entirely taxes away will have little incentive to work, let alone any incentive to undertake investments and innovations.","page":"75","tags":"property-rights, incentives, productivity, investment"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"We call such institutions, which have opposite properties of those we call inclusive, extractive economic institutions—extractive because such institutions are designed to extract incomes and wealth from one subset of society to benefit a different subset.","page":"76","tags":"institutions, expropriation, wealth, concentrated-interests"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Politics is the process by which a society chooses the rules that will govern it.","page":"79","tags":"politics, institutions, government"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Political institutions determine who has power in society and to what ends that power can be used.","page":"80","tags":"politics, institutions, power"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"We will refer to political institutions that are sufficiently centralized and pluralistic as inclusive political institutions. When either of these conditions fail, we will refer to the institutions as extractive political institutions… Extractive political institutions concentrate power in the hands of a narrow elite and place few constraints on the exercise of this power. Economic institutions are then often structures by this elite to extract resources from the rest of the society. Extractive economic institutions thus naturally accompany extractive political institutions.","page":"81","tags":"institutions, politics, power, centralization"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"When existing elites are challenged under extractive political institutions and the newcomers break through, the newcomers are likewise subject to only a few constraints. They thus have incentives to maintain these political institutions and create a similar set of economic institutions.","page":"82","tags":"institutions, incentives, path-dependence, concentrated-interests"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Nations fail when they have extractive economic institutions, supported by extractive political institutions that impede and even block economic growth.","page":"83","tags":"institutions, economics, growth, failure"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Economic institutions that create incentives for economic progress may simultaneously redistribute income and power in such a way that a predatory dictator and others with political power may become worse off.","page":"84","tags":"incentives, institutions, power, trade-offs"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The Black Death is a vivid example of a critical juncture, a major event or confluence of factors disrupting the existing economic or political balance in society. A critical juncture is a double-edged sword that can cause a sharp turn in the trajectory of a nation. On the one hand it can open the way for breaking the cycle of extractive institutions and enable more inclusive ones to emerge, as in England. Or it can intensify the emergence of extractive institutions, as was the case with the Second Serfdom in Eastern Europe.","page":"101","tags":"critical-juncture, history, institutions, path-dependence"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The Glorious Revolution was the foundation for creating a pluralistic society, and it built on and accelerated a process of political centralization. It created the world’s first set of inclusive political institutions.","page":"102","tags":"institutions, history, politics, pluralism"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Gosplan wrote the first Five-Year Plan, which ran between 1928 and 1933. Economic growth Stalin style was simple: develop industry by government command and obtain the necessary resources for this by taxing agriculture at very high rates… The collective farms completely lacked incentives for people to work hard, so production fell sharply… Neither the newly created industry nor the collectivized farms were economically efficient in the sense that they made the best use of what resources the Soviet Union possessed… But the Soviet Union grew rapidly… But in some instances the productivity of labor and capital may be so much higher in one sector or activity, such as heavy industry in the Soviet Union, that even a top-down process under extractive institutions that allocates resources toward that sector can generate growth.","page":"126","tags":"incentives, central-planning, extractive-institutions, productivity"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Before 1928 most Russians lived in the countryside. The technology used by peasants was primitive… There was thus huge unrealized economic potential from reallocating labor from agriculture to industry. Stalinist industrialization was one brutal way of unlocking this potential… between 1928 and 1960 national income grew at 6 percent a year, probably the most rapid spurt of economic growth in history up until then… As late as 1977, a leading academic textbook by an English economist argued that Soviet-style economics were superior to capitalist ones in terms of economic growth… By the 1970s, economic growth has all but stopped. The most important lesson is that extractive institutions cannot generate sustained technological change for two reasons: the lack of economic incentives and resistance by the elites. In addition, once all they very inefficiently used resources had been reallocated to industry, there were few economic gains to be had by fiat.","page":"127-128","tags":"resource-allocation, productivity, structural-change, economic-growth"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Extractive institutions are so common in history because they have a powerful logic: they can generate some limited prosperity while at the same time distributing it into the hands of a small elite. For this growth to happen, there must be political centralization. Once this is in place, the state—or the elite controlling the state—typically has incentives to invest and generate wealth, encourage others to invest so that the state can extract resources from them.","page":"149","tags":"extractive-institutions, centralization, wealth-distribution, elite-capture"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The history of the Maya city-states illustrates a more ominous and, alas, more common end, again implied by the internal logic of extractive institutions. As these institutions create significant gains for the elite, there will be strong incentives for others to fight to replace the current elite. Infighting and instability are thus inherent features of extractive institutions.","page":"150","tags":"extractive-institutions, incentives, political-instability, elite-conflict"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Though inherently limited, growth under extractive institutions may nonetheless appear spectacular when it’s in motion. Many in the Soviet Union and many more in the Western world were awestruck by Soviet growth in the 1920s, ‘30s, ‘40s, ‘50s, ‘60s, and even as late as the ‘70s, in the same way that they are mesmerized by the breakneck pace of economic growth in China today… China under the rule of the Communist Party is another example of society experiencing growth under extractive institutions and is similarly unlikely to generate sustained growth unless it undergoes a fundamental political transformation toward inclusive political institutions.","page":"151","tags":"extractive-institutions, perception, unsustainable-growth, misunderstanding"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The fear of creative destruction is the main reason why there was no sustained increase in living standards between the Neolithic and Industrial revolutions.","page":"183","tags":"creative-destruction, innovation, extractive-institutions, long-term"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"Not everyone saw printing as a desirable innovation. As early as 1485 the Ottoman sultan Bayezid II issued an edict that Muslims were expressly forbidden from printing in Arabic… It was not until 1727 that the first printing press was allowed in the Ottoman lands... This opposition to the printing press had the obvious consequences for literacy, education, and economic success. In 1800 probably only 2 to 3 percent of the citizens of the Ottoman Empire were literate, compared with 60 percent of adult males and 40 percent of adult females in England… Given the highly absolutist and extractive Ottoman institutions, the sultan’s hostility to the printing press is easy to understand. Books spread ideas and make the population much harder to control.","page":"214-215","tags":"innovation, extractive-institutions, creative-destruction, technology"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"By 1436 the construction of seagoing ships was even made illegal. The ban on overseas trade was not lifted until 1567… Just at the time when international trade and the discovery of the Americas were fundamentally transforming the institutions of England, China was cutting itself off from this critical juncture and turning inward… The Ming dynasty was overrun in 1644 by the Jurchen people, the Manchus of inner Asia, who created the Qing dynasty. A period of intense political instability then ensued. The Qings engaged in mass expropriation of property and assets… In 1661 the emperor Kangxi ordered that all people living along the coast from Vietnam to Chekiang… should move seventeen miles inland. The coast was patrolled by troops to enforce the measure, and until 1693 there was a ban on shipping everywhere on the coast… The reasoning of the Ming and Qing states for opposing international trade is by now familiar: the fear of creative destruction. The leaders’ primary aim was political stability.","page":"233","tags":"extractive-institutions, trade, innovation, path-dependence"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The ‘dual economy’ paradigm, originally proposed in 1955 by Sir Arthur Lewis, still shapes the way that most social scientists think about economic problems of less-developed countries. According to Lewis, many less-developed or underdeveloped economies have a dual structure and are divided into a modern sector and a traditional sector. The modern sector, which corresponds to the more developed part of the economy, is associated with urban life, modern industry, and the use of advanced technologies. The traditional sector is associated with rural life, agriculture, and ‘backward’ institutions and technologies… the ‘problem of development’ has come to mean moving people and resources out of the traditional sector, agriculture and the countryside, and into the modern sector, industry and cities.","page":"258","tags":"dual-economy, mental-models, economics, structural-change"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"New South Wales was just like Jamestown, Virginia, in many ways: the elite ultimately found it in their interest to create economic institutions that were significantly more inclusive than those in Austria-Hungary, Russia, Mexico, and Peru. Convicts were the only labor force, and the only way to incentivize them was to pay them wages for the work they were doing.","page":"278","tags":"inclusive-institutions, incentives, labor, institutional-evolution"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"In 1840 transportation to New South Wales was stopped, and in 1842 a legislative council was created with two-thirds of its members being elected (the rest appointed). Ex-convicts could stand for office and vote if they held enough property, and many did.","page":"281","tags":"inclusive-institutions, political-evolution, property-rights, representation"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The inclusive institutions established in the United States and Australia meant that the Industrial Revolution spread quickly to these lands and they began to get rich.","page":"282","tags":"inclusive-institutions, innovation, economic-growth, industrialization"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"For the three centuries prior to 1789, France was ruled by an absolutist monarchy. French society was divided into three segments, the so-called estates. The aristocrats (the nobility) made up the Second Estate, the clergy the First Estate, and everybody else the Third Estate. Different estates were subject to different laws, and the first two estates had rights that the rest of the population did not. The nobility and the clergy did not pay taxes, while the citizens had to pay several different taxes.","page":"283","tags":"extractive-institutions, inequality, absolutism, class-structure"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The end of absolutism in France opened the way for inclusive institutions, and the French ultimately embarked on industrialization and rapid economic growth. The French Revolution in fact did more than that. It exported its institutions by invading and forcibly reforming the extractive institutions of several neighboring countries. It thus opened the way to industrialization not only in France, but in Belgium, the Netherlands, Switzerland, and parts of Germany and Italy.","page":"300","tags":"inclusive-institutions, revolution, reform, economic-growth"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"With a few exceptions, the rich countries of today are those that embarked on the process of industrialization and technological change starting in the nineteenth century, and the poor ones are those that did not.","page":"301","tags":"industrialization, innovation, divergence, historical-context"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The virtuous circle… inclusive political institutions tend to support inclusive economic institutions. This then leads to a more equal distribution of income, empowering a broad segment of society and making the political playing field even more level. This limits what one can achieve by usurping political power and reduces the incentives to re-create extractive political institutions. These factors were important in the emergence of truly democratic political institutions in Britain.","page":"309","tags":"inclusive-institutions, virtuous-circle, equality, political-stability"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"When extractive institutions create huge inequalities in society and great wealth and unchecked power for those in control, there will be many wishing to fight to take control of the state and institutions. Extractive institutions then not only pave the way for the next regime, which will be even more extractive, but they also engender continuous infighting and civil wars. These civil wars then cause more human suffering and also destroy even what little state centralization these societies have achieved. This also often starts a process of descent into lawlessness, state failure, and political chaos, crushing all hopes of economic prosperity.","page":"366-367","tags":"extractive-institutions, power, instability, vicious-circle"},{"book":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","text":"The institutional structure that creates market failures will also prevent implementation of interventions to improve incentives at the micro level. Attempting to engineer prosperity without confronting the root cause of the problems—extractive institutions and the policies that keeps them in place—is unlikely to bear fruit.","page":"450","tags":"extractive-institutions, intervention, root-cause, reform"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"God is not in the wind, no matter its ferocity, nor in the earthquake, regardless of its magnitude, but is something within; the voice of conscience itself; the internal guide to what is right and wrong; that autonomous spirit that resides in each soul and shames us before ourselves, draws attention to our shortcomings and sins, and generates the impulse to repent, apologize, and atone. This is a discovery of unparalleled magnitude: the possibility of establishing a relationship with God by attending to conscience.” (p. xxiv)","page":"","tags":"conscience, ethics, self-awareness, values"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"We weigh the facts we encounter in accordance with our values. We elevate some pathways forward, things in the world, and people to a higher place than others, consigning everything deemed lesser to the netherworld of impediment, obstacle, enemy, or foe, or to the invisible domain of irrelevance. Thus we order, simplify, and reduce the world, prior even to encountering it.” (p. xxvi)","page":"","tags":"values, decision-making, perception, priorities"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"Whatever occupies our attention—whatever we are conscious of, however briefly—is thus something elevated for the moment to the highest place, celebrated and worshipped, whether we know it or not.” (p. xxvi)","page":"","tags":"attention, priorities, values"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"We see the world through a hierarchy of value. This is the map we use to guide our navigation through the unknown territory in which we would otherwise be lost. We perceive, therefore, in accordance with our aim… We elevate what we most highly regard to the utmost place of supremacy or sovereignty. We aim at the upward target we deem central, however momentarily. We bring our consciousness itself to bear on what we define as worthy of the expenditure of our attention and the efforts of our action.” (p. xxvii)","page":"","tags":"worldview, values, attention"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"We become engrossed in the stories we act out as children—stories we observe on the stage or screen, or read in the works of fiction, even as adults… In short: we are entranced by those with lofty aims, and we wish, if we are brave, to be possessed by their spirit. We aim at their aims—or hope to—see what they see, experience the emotions they feel, and learn the lessons they learn, while safely ensconced in the world of the imaginary. That is the value of the fictional: it is where the play that shapes our very perceptions can take place most safely and effectively.” (p. xxix)","page":"","tags":"vision, values, motivation"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"We want to understand Good so that we can be good and understand Evil so that we can avoid being evil. In this way we can bring about the salvation and redemption of the world, in small ways and great.” (p. xxx)","page":"","tags":"ethics, values, responsibility"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"The Bible is the library of stories on which the most productive, freest, and most stable and peaceful societies the world has ever known are predicated—the foundation of the West, plain and simple.” (p. xxxi)","page":"","tags":"culture, institutions, history"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"The biblical stories illuminate the eternal path forward up the holy mountain to the heavenly city, while simultaneously warning of the apocalyptic dangers lurking in the deviant, the marginal, the monstrous, the sinful, the unholy, the serpentine, and the positively demonic. God, in this formulation, is the spirit that leads up. Man is the being who struggles with that spirit with every decision, because a decision is a matter of prioritization; with every glance, as every glance is a sacrifice of possibility toward some desired end, and with every action as he moves toward some destination and away from all others. At every moment of consciousness, we are fated to wrestle with God.” (p. xxxi)","page":"","tags":"vision, values, hidden-risk"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"Do we ‘believe’ that we are made, man and woman alike, in the very image of God? And, if so, what does it mean to believe? And if not, what do we believe instead—or do we merely believe in nothing and suffer the terrible anxiety-provoking, hope-devouring, and socially destabilizing consequences of that?","page":"36","tags":"worldview, values, uncertainty"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"In Genesis 1, a series of narrative propositions emerge: that existence is the consequence of an eternal, transcendent spirit acting upon potential itself; that the habitable order that is good emerges from the workings of that spirit; that man and woman are made in the likeness of that spirit; and that this spirit is what has proper and eternal dominion over creation.","page":"39","tags":"first-principles, values, worldview"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"Work is, to state it differently, the delay of gratification, and a sacrifice made in the service of others… That means that when I am working I am replacing what I wish I could be doing right now—replacing what would otherwise seize my immediate attention and desire—with some demand of transcendent yet still brute necessity, all things considered; with something more calculated and longer term.","page":"90","tags":"patience, long-term, service"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"The man who lives by the lie lives not his own life but the life of the lie and the life of the liar—and even the life of the spirit of the lie, which is a Luciferian and a dreadful life indeed. For it is true adventure, not the falseness of the lie, that constitutes the truly and necessarily sustaining meaning in life.","page":"245","tags":"integrity, truth, character"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"In establishing a covenant with the One True God, Abram swears, in essence, to live by the truth. He is by no means perfectly capable of doing so, at the beginning. He is, at best, an ordinary man. This is very good news for the rest of us, striving to aim up and put our lives together, insofar as we are also ordinary men. In spite of his ordinariness, Abram decides to take a risk. He swears to alter his aim, and to accept, even welcome, whatever comes his way, along the pathway of truth. It must be understood: that is the acceptance of adventure itself. Why? Because living in truth—acting truthfully; seeing truthfully; speaking truthfully—means accepting whatever happens in consequence, instead of aiming at the target of delusion motivated by the spirit of the lie. That ultimately unpredictable happening (what in the world will come next?) attendant upon the truth is exactly the adventure of life.","page":"245","tags":"integrity, truth, humility"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"We believe, and are constantly promised—seduced to believe, particularly on the political front—that the true paradise would be upon us if only our needs were reliably met; if our wishes were easily gratified. In all seriousness, however: When all of its desires are satisfied, does an infant not merely sleep?","page":"246","tags":"human-nature, gratification, paradox"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"Are we infants, depending on others to quell our distress and provide us the necessities of life while we lie as passive recipients, or are we the men and women who can and should take on the world, and wrestle it into heavenly order?","page":"247","tags":"responsibility, agency, maturity"},{"book":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","text":"The man who believes in the spirit of adventure is the one who hits the road. Belief is in this sense best revealed by commitment—all-in commitment; determi
