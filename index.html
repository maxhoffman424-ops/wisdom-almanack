"tags":"valuation, growth, price-vs-value"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Among turnarounds and troubled companies, I pay special attention to the debt factor. More than anything else, it’s debt that determines which companies will survive and which will go bankrupt in a crisis… Funded debt (the best kind, from the shareholder’s point of view) can never be called in no matter how bleak the situation, as long as the borrower continues to pay the interest.","page":"201-202","tags":"financial-strength, debt, turnaround"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Book Value\nPeople invest in these on the theory that if the book value is $20 a share and the stock sells for $10, they’re getting something for half price. The flaw is that the stated book value often bears little relationship to the actual worth of the company. It often understates or overstates reality by a large margin. Penn Central had a book value of more than $60 a share when it went bankrupt!","page":"207","tags":"book-value, accounting, valuation"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Overvalued assets on the left side of the balance sheet are especially treacherous when there’s a lot of debt on the right. Let’s say that a company shows $400 million in assets and $300 million in debts, resulting in a positive book value of $100 million. You know the debt part is a real number. But if the $400 million in assets will bring only $200 million in a bankruptcy sale, then the actual book value is a negative $100 million. The company is less than worthless.","page":"208","tags":"accounting, debt, hidden-risk"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Just as often as book value overstates true worth, it can understate true worth. This is where you get the greatest asset plays.","page":"209","tags":"book-value, hidden-value, asset-plays"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"What follows is a summary of the things you’d like to learn about stocks in each of the six categories: \n\nStocks in General\n-\tThe p/e ratio. Is it high or low for this particular company and for similar companies in the same industry.\n-\tThe percentage of institutional ownership. The lower the better.\n-\tWhether insiders are buying and whether the company itself is buying back its own shares. Both are positive signs.\n-\tThe record of earnings growth to date and whether the earnings are sporadic or consistent\n-\tWhether the company has a strong balance sheet or a week balance sheet (debt-to-equity ratio)\n-\tThe cash position. With $16 in net cash, I know Ford is unlikely to drop below $16 a share. That’s the floor on the stock.\n\nSlow Growers\n-\tSince you buy these for dividends (Why else would you own them?) you want to check to see if dividends have always been paid, and whether they are routinely raised.\n-\tFind out what percentage of the earnings are being paid out as dividends. If it’s a low percentage, then the company has a cushion in hard times. \n\nStalwarts\n-\tThe key issue is price, and the p/e ratio will tell you whether you are paying too much.\n-\tCheck for possible diworseifications that may reduce earnings in the future.\n-\tCheck the company’s long-term growth rate, and whether it has kept up the same momentum in recent years. \n\nCyclicals\n-\tWatch for new entrants into the market, which is usually a dangerous development.\n-\tAnticipate a shrinking p/e multiple over time as business recovers and investors look ahead to the end of the cycle, when peak earnings are achieved.\n\nFast Growers\n-\tInvestigate whether the product that’s supposed to enrich the company is a major part of the company’s business.\n-\tWhat the growth rate in earnings has been in recent years.  (My favorites are the ones in the 20 to 25 percent range. I’m wary of companies that seem to be growing faster than 25 percent. Those 50 percenters usually are found in hot industries, and you know what that means.)\n-\tThat the company has duplicated its successes in more than one city or town, to prove that expansion will work.\n-\tThat the company still has room to grow.\n-\tWhether the stock is selling at a p/e ratio at or near the growth rate.\n-\tWhether the expansion is speeding up or slowing down.\n-\tThat few institutions own the stock and only a handful of analysts have ever heard of it. With fast growers on the rise this is a big plus.\n\nTurnarounds\n-\tMost important, can the company survive a raid by its creditors? How much cash does the company have? How much debt?\n-\tIf it’s bankrupt already, then what’s left for the shareholders?\n-\tIs business coming back?\n\nAsset Plays\n-\tWhat’s the value of the assets? Are there any hidden assets?\n-\tHow much debt is there to detract from these assets?\n-\tIs the company taking on new debt, making the assets less valuable?\n-\tIs there a raider in the wings to help shareholders reap the benefits of the assets?","page":"229-234","tags":"checklist, due-diligence, valuation"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Here are some pointers from this section:\n-\tUnderstand the nature of the companies you own and the specific reasons for holding the stock. \n-\tBig companies have small moves, small companies have big moves.\n-\tLook for small companies that are already profitable and have proven that their concept can be replicated.\n-\tIt’s better to miss the first move in a stock and wait to see if a company’s plans are working out. \n-\tInvest in simple companies that appear dull, mundane, out of favor, and haven’t caught the fancy of Wall Street.\n-\tModerately fast growers (20 to 25 percent) in nongrowth industries are ideal investments.\n-\tCompanies that have no debt can’t go bankrupt.\n-\tBuying stocks based on stated book value alone is dangerous and illusory. It’s real value that counts.","page":"234-235","tags":"business-quality, selectivity, proven-model"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Some people automatically sell the ‘winners’—stocks that go up—and hold on to their ‘losers’—stocks that go down—which is about as sensible as pulling out the flowers and watering the weeds.","page":"245","tags":"portfolio-management, temperament, human-nature"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"[Tom Gayner:] This is the most nuanced and misunderstood aspect of investing: a fair price may be a lot more than you would think if profitable reinvestment really can take place.","page":"217","tags":"reinvestment, return-on-capital, compounding"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"[Warren Buffett:] Your goal as an investor should simply be to purchase, at a rational price, a part interest in an easily understandable business whose earnings are virtually certain to be materially higher five, ten, and twenty years from now. Over time, you will find only a few companies that meet these standards—so when you see one that qualifies, you should buy a meaningful amount of stock… Put together a portfolio of companies whose aggregate earnings march upward over the years, and so also will the portfolio’s market value.","page":"219","tags":"long-term, predictability, simplicity"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Investing nirvana: long-term ownership of competitively advantaged businesses with significant reinvestment potential, managed by excellent capital allocators and shareholder-friendly management teams.","page":"221","tags":"competitive-advantage, reinvestment, management, capital-allocation"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"When assessing the moat of any business, simply ask yourself how quickly a smart competitor with unlimited financial resources could replicate it.","page":"226","tags":"moats, competition, mental-models"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"A ‘reverse discounted cash flow frame of mind’… Stock prices sometimes fall to such extremely low levels that the earnings of the next three to four years alone add up to the current market cap. Conversely, sometimes stock prices go to such extremely high levels that even a high earnings growth rate for a decade would not produce earnings sufficient to justify a future value large enough to make a commitment today.","page":"238","tags":"valuation, discounted-cash-flow, price-vs-value"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Be unreasonable in situations in which an expansion is in the offing… look for businesses undergoing a large greenfield capital expenditure program (no business foes a large capacity expansion without strong conviction in the future demand for its product), and then buy them three to six months ahead of the scheduled completion date. Use screening tools to short-list companies with a large recent increase in capital work in progress on their balance sheet.","page":"317","tags":"capital-expenditures, growth, contrarian, timing"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Boiling things down to their most fundamental truths, that is, to first principles (deconstructing), and then reasoning up from there (reconstructing) enables us to look at the world from the perspective of physics… First principles are the origins or the main concepts that cannot be reduced to anything else… Aristotle defined a first principle as ‘the first basis from which a thing is known.’ These are the fundamental assumptions that we know are true.","page":"20","tags":"mental-models, first-principles, epistemology"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Of all forms of pride, perhaps the most desirable is a justified pride in being trustworthy \n-Charlie Munger","page":"49","tags":"trust, integrity, character"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Over time, as you build your network, put in your best efforts to constantly add value to others in your relationships and to build a seamless web of deserved trust.","page":"49","tags":"relationships, trust, network"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Always reliably show up for the task entrusted to you. Never overpromise and underdeliver. Being unreliable will impair your career and friendships. If anything, under promise and overdeliver. Trust is earned when actions meet words.","page":"50","tags":"reliability, trust, reputation"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"The takeaway from Buffett and Munger is clear. If you want to improve your odds of success in life, business, and investing, then clearly define the perimeter of your circle of competence and operate only inside it. Over time, work to expand that circle, but never fool yourself about its current boundaries.","page":"61","tags":"circle-of-competence, humility, self-knowledge"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Instead of trying to arrive directly at the solution, begin by eliminating the options that are not correct. You get an enormous advantage by narrowing your problem space.","page":"75","tags":"inversion, mental-models, decision-making"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Let’s be honest. We don’t know for sure what makes us successful. We can’t pinpoint exactly what makes us happy. But we know with certainty what destroys success or happiness. This realization, as simple as it is, is fundamental: Negative knowledge (what not to do) is much more potent than positive knowledge (what to do). -Rolf Dobelli","page":"75","tags":"inversion, negative-knowledge, mental-models"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Investors generally overlook businesses that are doing things that will create significant incremental earnings one to two years from now because they don’t want to wait that far out… the stock markets generally do not initially increase the market value of these businesses. They do re-rate them, however, around the time when the earnings growth is clearly visible.","page":"102","tags":"patience, market-inefficiency, time-horizon"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Income Statement Analysis\n\nSales growth. The higher sales growth is, the better… Be cautious of high growth driven primarily by big-ticket acquisitions.\n\nGross profit margin. Focus on the trend over the years. If it is fluctuating a lot in a cyclical manner, then it means that the company does not have pricing power over its customers… high and stable or improving over the years.\n\nInterest Expense. A low-interest expense or a high-interest coverage ratio in isolation should never be taken at face value. Always check whether the company has been capitalizing the interest cost. Multiply the total debt figure by the prevailing rate of interest for similarly rated corporations and compare that figure with the total interest expense number used in the calculation of the interest coverage ratio.","page":"130","tags":"accounting, financial-analysis, gross-margin"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Cash Flow Analysis\n\nCapital Expenditure (CapEx). Compare CapEx with the CFO (cash flow from operations) to see whether the company can fund its capital expenditures from its operating cash flow.\n\nFree Cash Flow (FCF). When a company reports profits but bleeds cash, believe the cash.","page":"131","tags":"cash-flow, capital-expenditures, free-cash-flow"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Balance Sheet Analysis\n\nNet fixed assets. Look for sharp increases in this figure on the balance sheet. These increases signify that the company has completed a capex program, which could drive higher sales and profits in the future.","page":"132","tags":"balance-sheet, capital-expenditures, growth"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Reverse Discounted Cash Flow Analysis\n\nLet’s take a simple example to explain this process. Let’s say we want to buy shares of Company X, whose current market value is $1 billion. For the sake of simplicity, we assume that there are no dividends, stock options, debt, or off-balance-sheet obligations. The business has owner earnings of $40 million and an assumed average annual growth rate of 10 percent for ten years (the explicit forecasting period in this example). This leads to a value of $104 million in owner earnings in year 10.\n\nLet’s assume that the market pays an average multiple of 15x on owner earnings for this type of business and that no valuation rerating or derating of the business occurs in the interim period. This gives us a market value of $1.56 billion in year 10. Compared with the current market value of $1 billion, this gives us an implied yearly return of 4.5 percent.\n\nSuppose we want to know under what scenario we could earn a 15 percent annual return from this stock. What assumptions would be required to hold true to achieve this—and, more important, are they reasonable?\n\nA present market value of $1 billion and an annual return of 15 percent leads to $4 billion in market value in year 10. An exit multiple of 15x suggests owner earnings of $270 million in year 10. This implies an average annual growth rate of 21 percent in owner earnings (on the initial starting point of $40 million). A hypothetical profit margin of 15 percent suggests sales of $1.8 billion in year 10. This implies a 21 percent annual growth rate in sales for ten years. Now we can work with the various assumptions regarding required sales volume growth, trends in sales realization per unit, market share, and so on, and we can assess whether these are reasonable, given the past trends and track record of volume growth, pricing power, profit margins, market size, market share, and competitive advantage. We can also find out which factor has the greatest impact on future owner earnings (and thereby value) and under what circumstances it could change. We then could engage accordingly in a constructive ‘premortem’ exercise.” (p. 159, 160)","page":"","tags":"valuation, discounted-cash-flow, reverse-dcf"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"Great businesses tend to remain great, or they become good businesses (combined probability of 79 percent). There was only a 9 percent chance that a great business would up in the quartile of poorest performers… Wonderful companies tend to remain wonderful, and poor companies tend to remain stuck in the mud… Market systematically underprice quality over long time periods.” (p. 178-179).","page":"","tags":"business-quality, persistence, mean-reversion"},{"book":"The Joys of Compounding","author":"Gautam Baid","year":"2020","text":"The importance of insatiable intellectual curiosity, along with a deep passion for continuous learning, cannot be overstated in the investing profession. In investing, all knowledge is cumulative, and the insights we acquire by putting in the effort today often helps us in a serendipitous way at some time in the future. Work hard today to let good luck find you tomorrow.","page":"186","tags":"learning, curiosity, continuous-improvement"},{"book":"You Can Be a Stock Market Genius","author":"Joel Greenblatt","year":"1997","text":"Unrelated businesses may be separated via a spinoff transaction so that the separate business can be better appreciated by the market… Sometimes, the motivation for a spinoff comes from a desire to separate out a ‘bad’ business so that an unfettered ‘good’ business can show through to investors… Sometimes a spinoff is a way to get value to shareholders for a business that can’t be easily sold… If the spinoff is merely in an unpopular business that still earns some money, the parent may load the new spinoff with debt. In this way, debt is shifted from the parent to the new spinoff company (creating more value for the parent).","page":"58-59","tags":"spinoffs, special-situations, corporate-structure"},{"book":"You Can Be a Stock Market Genius","author":"Joel Greenblatt","year":"1997","text":"Generally, the new spinoff stock isn’t sold, it’s given to shareholders who, for the most part, were investing in the parent company’s business. Therefore, once the spinoff’s shares are distributed to the parent company’s shareholders, they are typically sold immediately without regard to price or fundamental value… If an S&P 500 company spins off a division, you can be pretty sure that right out of the box that division will be the subject of a huge amount of indiscriminate selling.","page":"61","tags":"spinoffs, forced-selling, market-inefficiency"},{"book":"You Can Be a Stock Market Genius","author":"Joel Greenblatt","year":"1997","text":"The whole situation had opportunity written all over it. Clearly, Silver King had the makings of an underfollowed and misunderstood spinoff situation. Silver King was going to have over $140 million of debt on its balance sheet. The value of the spinoff was going to be small relative to the value of each shareholder’s stake in Home Shopping—hopefully making it inappropriate or unimportant to the shareholder’s receiving it… Silver King was earning a ton of cash that most of Home Shopping’s shareholders, the ones receiving Silver King’s shares, were unlikely to know about.","page":"88","tags":"spinoffs, special-situations, misunderstanding, debt"},{"book":"You Can Be a Stock Market Genius","author":"Joel Greenblatt","year":"1997","text":"Often institutional buying of the parent’s stock immediately after a spinoff has a tendency to drive the price up. That’s why, if the parent company appears to be an attractive investment, it is usually worthwhile to buy stock in the parent before the spinoff takes place.","page":"98","tags":"spinoffs, timing, institutional-investors, strategy"},{"book":"You Can Be a Stock Market Genius","author":"Joel Greenblatt","year":"1997","text":"While LEAPS don’t have an unlimited life like stub stocks, they can usually be purchased up to two and a half years before they expire. This often gives ample opportunity for the stock market to recognize the results from an extraordinary corporate change.","page":"219","tags":"special-situations, timing, options, catalyst"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"Since other investors may be smart, well-informed and highly computerized, you must find an edge they don’t have. You must think of something they haven’t thought of, see things they miss or bring insight they don’t possess. You have to react differently and behave differently. In short, being right may be a necessary condition for investment success, but it won’t be sufficient. You must be more right than others… which by definition means your thinking has to be different.","page":"3","tags":"contrarian, independent-thinking, information-advantage, edge"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"First-level thinkers think the same way other first-level thinkers do about the same things, and they generally reach the same conclusions. By definition, this can’t be the route to superior results. All investors can’t beat the market since, collectively, they are the market.","page":"5","tags":"second-order-thinking, contrarian, efficient-market-theory, consensus"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"The upshot is simple: to achieve superior investment results, you have to hold nonconsensus views regarding value, and they have to be accurate. That’s not easy.","page":"6","tags":"contrarian, intrinsic-value, independent-thinking, difficulty"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"A market characterized by mistakes and mispricings can be beaten by people with rare insight. Thus, the existence of inefficiencies gives rise to the possibility of outperformance and is a necessary condition for it. It does not, however, guarantee it.","page":"12","tags":"market-inefficiency, edge, skill, outperformance"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"Respect for efficiency says that before we embark on a course of action, we should ask some questions: have mistakes and mispricings been driven out through investors’ concerted efforts, or do they still exist, and why? Think of it this way:\n•\tWhy should a bargain exist despite the presence of thousands of investors who stand ready and willing to bid up the price of anything that’s too cheap?\n•\tIf the return appears so generous in proportion to the risk, might you be overlooking some hidden risk?\n•\tWhy would the seller of the asset be willing to part with it at a price from which it will give you an excessive return?\n•\tDo you really know more about the asset than the seller does?\n•\tIf it’s such a great proposition, why hasn’t someone else snapped it up?","page":"14","tags":"market-inefficiency, epistemology, due-diligence, critical-thinking"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"The key turning point in my investment management career came when I concluded that because the notion of market efficiency has relevance, I should limit my efforts to relatively inefficient markets where hard work and skill would pay off best.","page":"15","tags":"market-inefficiency, edge, selectivity, career-lessons"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"Swallowing theory whole can make us give up on finding bargains, turn the process over to a computer and miss out on the contribution skillful individuals can make. The image here is of the efficient-market-believing finance professor who takes a walk with a student.\n\t‘Isn’t that a $10 bill lying on the ground?’ asks the student.\n‘No, it can’t be a $10 bill,’ answers the professor. ‘If it were, someone would have picked it up by now.’\nThe professor walks away, and the student picks it up and has a beer.","page":"15","tags":"efficient-market-theory, contrarian, opportunities, theory-vs-practice"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"Value investors score their biggest gains when they buy an underpriced asset, average down unfailingly and have their analysis prove out. Thus, there are two essential ingredients for profit in a declining market: you have to have a view on intrinsic value, and you have to hold that view strongly enough to be able to hang in and buy even as the price declines suggest you’re wrong. Oh yes, there’s a third: you have to be right.","page":"23","tags":"value-investing, intrinsic-value, conviction, accumulation"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"The reality of risk is much less simple and straightforward than the perception. People vastly overestimate their ability to recognize risk and underestimate what it takes to avoid it; thus, they accept risk unknowingly and in so doing contribute to its creation.","page":"55","tags":"risk, epistemology, humility, hidden-risk"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"I’m firmly convinced that investment risk resides most where it is least perceived, and vice versa:\n•\tWhen everyone believes something is risky, their unwillingness to buy usually reduces its price to the point where it’s not risky at all. Broadly negative opinion can make it the least risky thing, since all optimism has been driven out of its price.\n•\tWhen everyone believes something embodies no risk, they usually bid it up to the point where it’s enormously risky.\nThis paradox exists because most investors think quality, as opposed to price, is the determinant of whether something’s risky. But high quality assets can be risky, and low quality assets can be safe. It’s just a matter of the price paid for them.","page":"56","tags":"risk, contrarian, perception, crowd-behavior"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"In order for a portfolio to make it through tough times, the risk generally has to be well controlled. If the portfolio thrives in good times, however, we can’t tell whether risk control was (a) present but not required or (b) lacking. Bottom line: risk control is invisible in good times but still essential, since good times can so easily turn into bad times.","page":"58","tags":"risk, downside-protection, invisible-factors, portfolio-management"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"Over a full career, most investor’s results will be determined more by how many losers they have, and how bad they are, than by the greatness of their winners. Skillful risk control is the mark of the superior investor.","page":"","tags":"risk, downside-protection, losses, long-term"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"Rule number one: most things will prove to be cyclical. \nRule number two: some of the greatest opportunities for gain and loss come when other people forget rule number one.","page":"","tags":"cyclicals, mean-reversion, opportunity, discipline"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"Ignoring cycles and extrapolating trends is one of the most dangerous things an investor can do. People often act as if companies that are doing well will do well forever, and investments that are outperforming will outperform forever, and vice versa. Instead, it’s the opposite that’s more likely to be true.","page":"72","tags":"cyclicals, mean-reversion, extrapolation, mistakes"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"The desire for more, the fear of missing out, the tendency to compare against others, the influence of the crowd and the dream of the sure thing—these factors are near universal. Thus they have a profound collective impact on most investors and most markets. The result is mistakes, and those mistakes are frequent, wide-spread and recurring.","page":"80","tags":"human-nature, crowd-behavior, mistakes, psychology"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"Greed is an extremely powerful force. It’s strong enough to overcome common sense, risk aversion, prudence, caution, logic, memory of painful past lessons, resolve, trepidation and all other elements that might otherwise keep investors out of trouble. Instead, from time to time greed drives investors to throw in their lot with the crowd in pursuit of profit, and eventually the pay the price.","page":"81","tags":"human-nature, greed, crowd-behavior, bubbles"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"You must do things not just because they’re opposite of what the crowd is doing, but because you know why the crowd is wrong. Only then will you be able to hold firmly to your views and perhaps buy more as your positions take on the appearance of mistakes and as losses accrue rather than gains.","page":"94","tags":"contrarian, conviction, independent-thinking, patience"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"In short, there are two primary elements in superior investing:\n•\tSeeing some quality that others don’t see or appreciate (and that isn’t reflected in the price),\n•\tAnd having it turn out to be true (or at least accepted by the market).\nIt should be clear from the first element that the process has to begin with investors who are unusually perceptive, unconventional, iconoclastic or early. That’s why successful investors are said to spend a lot of their time being lonely.","page":"96","tags":"contrarian, price-vs-value, independent-thinking"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"The raw materials for the process consist of (a) a list of potential investments, (b) estimates of their intrinsic value, (c) a sense for how their prices compare with their intrinsic value, and (d) and understanding of the risks involved in each, and of the effect their inclusion would have on the portfolio being assembled.","page":"100","tags":"intrinsic-value, portfolio-management, risk, valuation"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"You’ll do better if you wait for investments to come to you rather than go chasing after them. You tend to get better buys if you select from a list of things sellers are motivated to sell rather than start with a fixed notion as to what you want to own.","page":"107","tags":"patience, selectivity, forced-selling"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"We may never know where we’re going, but we’d rather have a good idea where we are. That is, even if we can’t predict the timing and extent of cyclical fluctuations, it’s essential that we strive to ascertain where we stand in cyclical terms and act accordingly.","page":"125","tags":"cyclicals, market-inefficiency, context"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"We should spend our time trying to find value among the knowable—industries, companies and securities—rather than base our decisions on what we expect from the less-knowable macro world on economies and broad market performance.","page":"139","tags":"circle-of-competence, business-quality, economics"},{"book":"The Most Important Thing","author":"Howard Marks","year":"2011","text":"With a risky portfolio, a downward fluctuation may make you lose faith or be sold out at the low. A portfolio that contains too little risk can make you underperform in a bull market, but no one ever went bust from that; there are far worse fates.","page":"153","tags":"risk, downside-protection, temperament"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"The Christianity Lewis espouses is humane, but not easy: it asks us to recognize that the great religious struggle is not fought on a spectacular battleground, but within the ordinary human heart, when every morning we awake and feel the pressures of the day crowding in on us, and we must decide what sort of immortals we wish to be.” (p. xx)","page":"","tags":"character, discipline, responsibility"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"These, then, are the two points I wanted to make. First, that human beings, all over the earth, have this curious idea that they ought to behave in a certain way, and cannot really get rid of it. Secondly, that they do not in fact behave in that way. They know the Law of Nature; they break it. These two facts are the foundation of all clear thinking about ourselves and the universe we live in.","page":"8","tags":"human-nature, philosophy, standards"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"Strictly speaking, there are no such things as good and bad impulses. Think once again of a piano. It has not got two kinds of notes on it, the ‘right’ notes and the ‘wrong’ ones. Every single note is right at one time and wrong at another. The Moral Law is not any one instinct or set of instincts: it is something which makes a kind of tune by directing the instincts.","page":"11","tags":"philosophy, context, judgment"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"There is one thing, and only one, in the whole universe which we know more about than we could learn from external observation. That one thing is Man. We do not merely observe men, we are men. In this case we have, so to speak, inside information; we are in the know. And because of that, we know that men find themselves under a moral law, which they did not make, and cannot quite forget even when they try, and which they know they ought to obey.","page":"23","tags":"self-knowledge, epistemology, perspective"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"If there was a controlling power outside the universe, it could not show itself to us as one of the facts inside the universe—no more than the architect of a house could actually be a wall or staircase or fireplace in that house. The only way in which we could expect it to show itself would be inside ourselves as an influence or command trying to get us to behave in a certain way. And that is just what we do find inside ourselves.","page":"24","tags":"epistemology, philosophy, invisible-factors"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"This is the terrible fix we are in. If the universe is not governed by an absolute goodness, then all our efforts are in the long run hopeless. But if it is, then we are making ourselves enemies to that goodness every day, and we are not in the least likely to do any better tomorrow, and so our case is hopeless again… God is the only comfort, He is also the supreme terror: the thing we most need and the thing we most want to hide from.","page":"31","tags":"philosophy, responsibility, uncertainty"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"My argument against God was that the universe seemed so cruel and unjust. But how had I got this idea of just and unjust? A man does not call a line crooked unless he has some idea of a straight line.","page":"38","tags":"philosophy, standards, first-principles"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"You can be good for the mere sake of goodness: you cannot be bad for the mere sake of badness… no one ever did a cruel action simply because cruelty is wrong—only because cruelty was pleasant or useful to him… Goodness is, so to speak, itself: badness if only spoiled goodness.","page":"44","tags":"philosophy, human-nature, incentives"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"To be bad, he must exist and have intelligence and will. But existence, intelligence and will are in themselves good… And do you now begin to see why Christianity has always said that the devil is a fallen angel? That is not a mere story for the children. It is a real recognition of the fact that evil is a parasite, not an original thing. The powers which enable evil to carry on are powers given it by goodness.","page":"45","tags":"philosophy, corruption, character"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"God made us: invented us as a man invents an engine. A car is made to run on petrol, and it would not run properly on anything else. Now God designed the human machine to run on Himself. He Himself is the fuel our spirits were designed to burn, or the food our spirits were designed to feed on. There is no other.","page":"50","tags":"philosophy, first-principles, means-vs-ends"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"People often say about Him: ‘I’m ready to accept Jesus as a great moral teacher, but I don’t accept His claim to be God.’ That is the one thing we must not say. A man who was merely a man and said the sort of things Jesus said would not be a great moral teacher. He would either be a lunatic or else he would be the Devil of Hell… You can shut Him up for a fool, you can spit at Him and kill Him as a demon; or you can fall at His feet and call Him Lord and God.","page":"52","tags":"philosophy, critical-thinking, character"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"That is why the Christian is in a different position from other people who are trying to be good. They hope, by being good, to please God if there is one; or—if they think there is not—at least they hope to deserve approval from good men. But the Christian thinks any good he does comes from the Christ-life inside him. He does not think God will love us because we are good, but that God will make us good because He loves us.","page":"63","tags":"philosophy, humility, perspective"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"There is one vice of which no man in the world is free; which every one in the world loathes when he sees it in someone else; and of which hardly any people, except Christians, ever imagine that they are guilty themselves… Pride or Self-Conceit: and the virtue opposite to it, in Christian morals, is called Humility… Pride leads to every other vice: it is the complete anti-God state of mind.","page":"121","tags":"human-nature, self-knowledge, humility"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"How is it that people who are quite obviously eaten up with Pride can say they believe in God and appear to themselves very religious? I am afraid it means they are worshipping an imaginary God.","page":"124","tags":"self-knowledge, philosophy, rationalization"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"Do not waste your time bothering whether you ‘love’ your neighbor; act as if you did. As soon as you are behaving as if you loved someone, you presently come to love him.","page":"131","tags":"philosophy, human-nature, character"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"The worldly man treats certain people kindly because he ‘likes’ them: the Christian, trying to treat every one kindly, finds himself liking more and more people as he goes on—including people he could not even have imagines himself liking at the beginning.","page":"131","tags":"human-nature, philosophy, relationships"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"Hope is one of the Theological virtues. This means that a continual looking forward to the eternal world is not a form of escapism or wishful thinking, but one of the things a Christian is meant to do.","page":"134","tags":"philosophy, long-term, perspective"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"We never find out the strength of the evil impulse inside us until we try to fight it: and Christ, because He was the only man who never yielded to temptation, is also the only man who knows to the full what temptation means—the only complete realist.","page":"142","tags":"philosophy, self-knowledge, experience"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"The command Be ye perfect is not idealistic gas. Nor is it a command to do the impossible. He is going to make us into creatures that can obey that command. He said (in the Bible) that we were ‘gods’ and He is going to make good His words. If we let Him—for we can prevent Him, if we choose—He will make the feeblest and filthiest of us into a god or goddess, a dazzling, radiant, immortal creature, pulsating all through with such energy and joy and wisdom and love as we cannot now imagine, a bright stainless mirror which reflects back to God perfectly His own boundless power and delight and goodness. The process will be long and in parts very painful, but that is what we are in for. Nothing less. He meant what He said.","page":"205","tags":"philosophy, standards, continuous-improvement"},{"book":"Mere Christianity","author":"C.S. Lewis","year":"1952","text":"As long as your own personality is what you are bothering about you are not going to Him at all. The very first step is to try to forget about the self altogether… The principle runs through all life from top to bottom. Give up yourself, and you will find your real self. Lose your life and you will save it. Submit to death, death of your ambitions and favorite wishes every day and death of your whole body in the end: submit with every fiber of your being, and you will find eternal life… Look for yourself, and you will find in the long run only hatred, loneliness, despair, rage, ruin, and decay. But look for Christ and you will find Him, and with Him everything else thrown in.","page":"227","tags":"philosophy, self-knowledge, perspective"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"During Grover’s growing up, public services were nonexistent and not expected… Although uniformed police came into being in the 1850s, the Fayettevilles of America did not have them until the beginning of the twentieth century.","page":"7","tags":"history, government, context"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"Millard Fillmore, a Whig, was elected vice president in 1848, and became president upon the death of Zachary Taylor in 1850… when Fillmore aimed to become president in his own right by running in 1856 on the anti-Catholic and anti-immigrant party, the Know-Nothings, he astonished and offended hordes of former supporters and admirers.","page":"13","tags":"history, government, incentives"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"Thus it came about that on the first of January in 1882, Cleveland was mayor of Buffalo… He stated in unaffected language that a city ought to be able to conduct its affairs with the same efficiency and effectiveness as a private business.","page":"19","tags":"government, management, simplicity"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"When a proposal was introduced to use five hundred dollars from the city’s Fourth of July fund in order to celebrate the new Decoration Day holiday honoring the Civil War dead, Cleveland refused to permit such a shift of money. It would violate the public’s intention.","page":"19","tags":"government, integrity, accountability"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"’Good and pure government lies at the foundation of the wealth and progress of every community’… This simple sentence would become the mantra of his political career.","page":"20","tags":"government, integrity, philosophy"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"When an effort was afoot to limit the working day of streetcar conductors to twelve hours, Cleveland was firmly opposed. The ‘Car Conductors’ and Driver’s Bill,’ it was his argument, would limit the right of workingmen to contract with their employers for any length of day they chose.","page":"37","tags":"government, trade-offs, responsibility"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"What was most remarkable was that unlike his immediate predecessors, Hayes, Garfield, and Arthur, he was not the choice of the party bosses. Nor was he a war hero, like Grant and Lincoln, or even on a lower level of heroism, like Hayes and Garfield. Cleveland was the symbol of high-mindedness and devoted care in local governance.","page":"46","tags":"history, character, independent-thinking"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"The campaign was in full swing almost immediately. The party platforms seemed indistinguishable. Neither side was seeking dispute on public policy.","page":"54","tags":"history, government, strategy"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"His view of the presidency was simple: ‘It should be remembered that the office of the President is essentially executive in its nature. The laws enacted by the legislative branch of the government, the Chief Executive is bound faithfully to enforce.’","page":"56","tags":"government, responsibility, simplicity"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"One can only wonder as to what people thought they had accomplished in putting Cleveland in office. He had no ‘program’ except a commitment to honesty and efficiency and an intention to staff his administration with worthy people from the Democratic ranks.","page":"67","tags":"government, integrity, strategy"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"In keeping with his practice in every public office he held, he went over the accounts of the White House and made out personal checks for expenses incurred that were not official ones.","page":"74","tags":"integrity, character, accountability"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"He vetoed a bill that would have provided assistance to Texas farmers largely wiped out by a severe drought. In his accompanying message he declared in words that seemed ordinary but that would be unacceptable today: ‘I do not believe that the power and duty of the general government ought to be extended to the relief of individual suffering which is in no manner properly related to public service or benefit.’ He stated a principle: ‘Though the people support the government, the government should not support the people.’","page":"85","tags":"government, responsibility, trade-offs"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"Meeting in Omaha, with much fanfare, the farm spokesmen brought forward the People’s Party, quickly known as the Populist Party. It reached out to all the aggrieved. The extensive platform added to the farmers’ old list of demands a fervent plea for the free and unlimited coinage of silver in the ratio of 16 to 1; generous pensions for Union veterans; the direct election of senators; the adoption of the secret ballot in elections; the establishment of the eight-hour day for working people; and a one-term limit for the president and vice president.","page":"107","tags":"history, government, incentives"},{"book":"Grover Cleveland","author":"Henry Graff","year":"2002","text":"As Cleveland’s new term opened, hard times—the depression of 1893—struck the country… Cleveland believed that prosperity could be restored only if Americans once more had confidence in the backing of their paper money. He felt sure that their faith in the nation’s currency had been shaken by the Sherman Silver Purchase Act… Because silver had been made so abundant, it was cheap. As a result, people were using silver to obtain paper money, converting the papers into gold—and then hoarding it… The only solution, Cleveland believed, was to place the country on a gold standard; that is, having a currency based solely on gold. Pursuing the conviction, he persuaded Congress to repeal the Silver Purchase Act before the first year of his term was over.","page":"114","tags":"history, trust, monetary-policy"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"Without scarcity, there is no need to economize--and therefore no economics… Economics is the study of the use of scarce resources which have alternative uses.","page":"1","tags":"economics, scarcity, trade-offs, first-principles"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"When some disaster suddenly makes those resources even more scarce than usual, it is important that prices reflect that underlying reality, so as to reduce the demands that each individual makes on the reduced supply.","page":"18","tags":"pricing, scarcity, markets, resource-allocation"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"If local electric power lines were put out of commission for a few days, the demand for flashlights in that community might suddenly increase, causing prices to rise before new shipments of flashlights could arrive. Had prices remained at their previous level, a family might buy several flashlights, so that each member could have one. But, at the suddenly higher prices, they would more likely buy only one or two, leaving more flashlights for others with a similarly urgent need. In short, prices force people to share, whether or not they are aware of sharing… While sharply higher prices may be resented during emergencies, their functions are even more urgently needed at such times.","page":"19","tags":"pricing, scarcity, markets, supply-demand"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"Prices not only ration existing supplies, they also act as powerful incentives to cause supplies to rise or fall in response to changing demand. When a crop failure in a given region creates a sudden increase in demand for imports of food into that region, food suppliers elsewhere rush to be that first to get there, in order to capitalize on high prices that will prevail until more supplies arrive and drive food prices back down again. What this means, from the standpoint of the hungry people in that region, is that food is being rushed to them at maximum speed by ‘greedy’ suppliers, probably much faster than if the same food were being transported to them by salaried government employees sent on a humanitarian mission… In short, people tend to do more for their own benefit than for the benefit of others. Freely fluctuating prices can make that turn out to be beneficial to others.","page":"19","tags":"pricing, incentives, markets, supply-demand"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"Economic policies need to be analyzed in terms of the incentives they create, rather than the hopes that inspired them… In New York City, for example, many buildings have been abandoned after their owners found it impossible to collect enough rent to cover the costs of services that they are legally required to provide, such as heat and hot water.","page":"27","tags":"incentives, unintended-consequences, government, policy"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"Such inefficiency in the allocation of resources means that people are sleeping outdoors on the pavement on cold winter nights—some dying of exposure—while the means of housing them already exist, but are not being used because of laws designed to make housing ‘affordable.’","page":"28","tags":"unintended-consequences, government, policy, resource-allocation"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"A surplus, like a shortage, is a price phenomenon. A surplus does not mean that there is some excess relative to the people. There was not ‘too much’ food relative to the population during the Great Depression. The people simply did not have enough money to buy everything that was produced at the artificially high prices set by the government.","page":"35","tags":"pricing, markets, scarcity, depression"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"Analyzing economic actions in cause-and-effect terms means examining the logic of the incentives being created, rather than simply the goals being sought. It also means examining the empirical evidence of what actually happens under such incentives.","page":"43","tags":"incentives, cause-and-effect, first-principles, critical-thinking"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"The painful fact that poor people end up paying more than affluent people for many goods and services has a very plain—and systemic—explanation. It often costs more to deliver goods and services in low-income neighborhoods. Higher insurance costs and higher costs for various security precautions, due to higher rates of crime and vandalism, are just some of the systemic reasons that get ignored by those seeking an explanation in terms of personal intentions.” (p. 45).","page":"","tags":"pricing, economics, poverty, systemic-factors"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"If everything were made affordable by government decree, there would still not be any more to go around than when things were prohibitively expensive. There would simply have to be some alternative rationing method. Whether that method was through ration coupons, political influence, black markets, or just fighting over things when they go on sale, the rationing would still have to be done, since artificially making things affordable does not create any more total output.","page":"51","tags":"scarcity, government, price-controls, rationing"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"Unfortunately, the real minimum wage is always zero, regardless of the laws, and that is the wage that many workers receive in the wake of the creation or escalation of a government-mandated minimum wages, because they lose their jobs.","page":"163","tags":"minimum-wage, unintended-consequences, government, employment"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"Federal disaster relief in the United States helps victims of floods, hurricanes, and other natural disasters to recover and rebuild. But, unlike insurance, it does not reduce the over-all risks. Often people rebuild homes and businesses in the well-known paths of hurricanes and floods, often to the applause of the media for their ‘courage.’ But the financial risks created are not paid by those who create them, as with insurance, but are instead paid by the taxpayers. In short, there is now more risk than if there were no disaster relief available and more risk than if private insurance companies were charging these people premiums which cover the full cost of their risky behavior.","page":"224","tags":"moral-hazard, incentives, government, insurance"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"While inflation has been a problem that is centuries old, at particular times and places deflation has also been devastating… the money supply in the United States declined by one-third from 1929 to 1932, making it impossible for Americans to buy as many goods and services as before at the old prices. Prices did come down… but some prices could not change because there were legal contracts involved. Mortgages on homes, farms, stores, and office buildings all specified monthly mortgage payments in money terms… Many home-owners, farmers, and businesses simply could not pay after the national money supply contracted… People with leases faced very similar problems, as it became increasingly difficult to come up with the money to pay the rent.","page":"264","tags":"monetary-policy, deflation, depression, money-supply"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"Small countries like South Korea and Taiwan depend on international trade to be able to produce many products on a scale far exceeding what can be sold domestically. In short, international trade is necessary for many countries to achieve economies of scale that will enable them to sell at prices that can compete with the prices of similar products in the world market.","page":"315","tags":"trade, economies-of-scale, international-trade, competitive-advantage"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"International trade creates greater efficiency by allowing more economies of scale around the world, even in countries whose domestic markets are not large enough to absorb all the output of mass production industries, as well as by taking advantage of each country’s absolute or competitive advantages.","page":"316","tags":"trade, economies-of-scale, efficiency, competitive-advantage"},{"book":"Basic Economics","author":"Thomas Sowell","year":"2004","text":"Regardless of the particular industry or the particular country, if a million new and well-paying jobs are created in companies scattered all across the country as a result of international free trade, that carries less weight politically than if half million jobs are lost in one industry where labor unions and employer associations are able to raise a clamor… Therefore laws are often passed restricting international trade for the benefit of some concentrated and vocal constituency, even though these restrictions may cause far more losses of jobs nationwide.","page":"326","tags":"trade, politics, perception, concentrated-interests"},{"book":"The Case for Faith","author":"Lee Strobel","year":"2000","text":"Imagine a bear in a trap and a hunter who, out of sympathy, wants to liberate him. He tries to win the bear's confidence, but he can't do it, so he has to shoot the bear full of drugs. The bear, however, thinks this is an attack and that the hunter is trying to kill him. He doesn't realize that this is being done out of compassion. Then, in order to get the bear out of the trap, the hunter has to push him further into the trap to release the tension on the spring. If the bear were semi conscious at that point, he would be even more convinced that the hunter was his enemy who was out to cause him suffering and pain. But the bear would be wrong. He reaches this incorrect conclusion because he's not a human being… How can anyone be certain that's not an analogy between us and God? I believe God does the same to us sometimes, and we can't comprehend why he does it any more than the bear can understand the motivations of the hunter. As the bear could have trusted the hunter comma so we can trust God.","page":"32","tags":"perspective, trust, misunderstanding, good-intentions"},{"book":"The Case for Faith","author":"Lee Strobel","year":"2000","text":"If God is all-powerful, he can do anything. If God is all-good, he wants only good. If God is all-wise, he knows what is good. So if all of those beliefs are true—and Christians believe they are—then it would seem that the consequence is that no evil can exist.","page":"36","tags":"philosophy, logic, theodicy, paradox"},{"book":"The Case for Faith","author":"Lee Strobel","year":"2000","text":"Attribute #1: God is All-Powerful\n\n•\tThat means he can do everything that is meaningful, everything is possible, everything that makes any sense at all. God cannot make himself to cease to exist. He cannot make good evil.”\n\n•\tPrecisely because he is all powerful, he can’t do some things. He can’t make mistakes. Only weak and stupid beings make mistakes… once God chose to create human beings with free will, then it was up to them, rather than to God, as to whether there was sin or not… he created the possibility of evil; people actualized that potentiality… Even an all-powerful God could not have created a world in which people had genuine freedom and yet there was no potentiality for sin, because our freedom includes the possibility of sin within its own meaning.” \n\n•\tReal love—our love of God and our love of each other—must involve a choice. But with the granting of that choice comes the possibility that people would choose instead to hate.","page":"37","tags":"philosophy, logic, paradox, definitions"},{"book":"The Case for Faith","author":"Lee Strobel","year":"2000","text":"Attribute #2: God is All-Knowing\n\n•\tHe [God] has demonstrated how the very worst thing that has ever happened in the history of the world ended up resulting in the very best thing that has ever happened in the history of the world… The death of God himself on the cross. At the time, nobody saw how anything good could ever result from this tragedy. And yet God foresaw that the result would be the opening of heaven to human beings… if the ultimate evil can result in the ultimate good it can happen elsewhere, even in our own individual lives.” (p.38)\n\nYou have to understand that people's character is not formed by decisions all at once, but by thousands of little choices they make every day without even knowing about it. Each day we're preparing ourselves for either being with God and his people and valuing the things he values, or choosing not to engage with those things.","page":"177","tags":"perspective, hindsight, hidden-value, outcomes"},{"book":"Civil Rights: Rhetoric or Reality?","author":"Thomas Sowell","year":"1984","text":"Both historical and contemporary observations on intergroup differences in work habits, discipline, reliability, sobriety, cleanliness, or cooperative attitude- anywhere in the world- are automatically dismissed as evidence only of the bias or bigotry of the observers… Self-employed farmers, for example, do not depend for their rewards on the biases of employers so the stereotypes of observers. Yet self-employed farmers of different ethnicity have fared very differently on the same land, even in earlier pre mechanization times, when the principal input was the farmer's own labor… That Jews earn far higher incomes than Hispanics in the United states might be taken as evidence that anti Hispanic bias is stronger than anti semitism- if one followed the logic of the civil rights vision. But this explanation is considerably weakened by the greater prosperity of Jews than Hispanics in Hispanic countries throughout Latin America.","page":"47","tags":"context, perception, epistemology"},{"book":"Civil Rights: Rhetoric or Reality?","author":"Thomas Sowell","year":"1984","text":"The percentage of employed blacks who were professional and technical workers rose less in the five years following the Civil Rights Act of 1964 than in the five years preceding it.","page":"49","tags":"unintended-consequences, policy, outcomes"},{"book":"Civil Rights: Rhetoric or Reality?","author":"Thomas Sowell","year":"1984","text":"Given the unique—and uniquely oppressive—history of blacks, it would follow almost inevitably from the civil rights vision that blacks would today suffer far more than other groups from low income, broken homes, and the whole litany of social pathology… Blacks do not have the lowest income, the lowest educational level, or the most broken homes among American ethnic groups… The difference between Japenese Americans and Puerto Ricans is even greater than the difference between blacks and whites, though most of the factors assumed to cause black-white differences are not present in differences between Japanese Americans and Puerto Ricans.","page":"74","tags":"context, perspective, comparative-analysis"},{"book":"Civil Rights: Rhetoric or Reality?","author":"Thomas Sowell","year":"1984","text":"Most black children, even under slavery, grew up in two-parent households. A teenage girl raising a child with no man present was a rarity among blacks, both during the era of slavery and as late as the 1920s.","page":"75","tags":"history, context, perspective"},{"book":"Civil Rights: Rhetoric or Reality?","author":"Thomas Sowell","year":"1984","text":"Black West Indians living in the United States are a group physically indistinguishable from black Americans, but with a cultural background that is quite different. If current employer racial discrimination is the primary determinant of below-average black income, West Indians’ incomes would be similarly affected. Yet West Indians family incomes are 94 percent of the US national average, while the family incomes of blacks as a group are only 62 percent of the national average.","page":"78","tags":"culture, context, misunderstanding"},{"book":"Civil Rights: Rhetoric or Reality?","author":"Thomas Sowell","year":"1984","text":"Harvard economist Richard Freeman compared blacks and whites whose homes included newspapers, magazines, and library cards, and who had also gone on to obtain the same number of years of schooling. There was no difference in the average income of these whites compared to these blacks.","page":"80","tags":"context, hidden-factors, comparative-analysis"},{"book":"Civil Rights: Rhetoric or Reality?","author":"Thomas Sowell","year":"1984","text":"Today, where husbands and wives are both college-educated, and both working, black families of this description earn slightly more than white families of this description—nationwide and without regard to age… The average income of blacks as a group remains far behind the average income of whites as a group. What we are trying to find out is the extent to which this is due to cultural differences rather than color differences that call forth racism and discrimination.","page":"81","tags":"context, hidden-factors, standards"},{"book":"Civil Rights: Rhetoric or Reality?","author":"Thomas Sowell","year":"1984","text":"Among the insidious dangers are the undermining of minority and female self-confidence by incessant reiteration of the themes of pervasive discrimination, hypocritical standards, and shadowy but malign enemies relentlessly opposing their progress.","page":"118","tags":"psychology, unintended-consequences, self-knowledge"},{"book":"Freakonomics","author":"Steven Levitt & Stephen Dubner","year":"2005","text":"Commissions are tricky… a 6 percent real-estate commission is typically split between the seller’s agent and the buyer’s. Each agent then kicks back roughly half of her take to the agency. Which means that only 1.5 percent of the purchase price goes directly into your agent’s pocket… What if, with a little more effort and patience and a few more newspaper ads, she could have sold it [your house] for $310,000 [instead of $300,000]? After the commission, that puts an additional $9,400 in your pocket. But the agent’s additional share—her personal 1.5 percent of the extra $10,000—is a mere $150. If you earn $9,400 while she earns only $150, maybe your incentives aren’t aligned after all… it turns out that a real-estate agent keeps her own home on the market an average of ten days longer and sells it for an extra 3-plus percent, or $10,000 on a $300,000 house. When she sells her own house, an agent holds out for the best offer; when she sells yours, she encourages you to take the first decent offer that comes along.","page":"6-7","tags":"incentives, principal-agent, misalignment"},{"book":"Freakonomics","author":"Steven Levitt & Stephen Dubner","year":"2005","text":"Election data show it is true that the candidate who spends more money in a campaign usually wins. But is money the cause of the victory?... Let’s say you are the kind of person who might contribute $1,000 to a candidate. Chances are you’ll give the money in one of two situations: a close race, in which you think the money will influence the outcome; or a campaign in which one candidate is a sure winner and you would like to bask in reflected glory or receive some future in-kind consideration. The one candidate you won’t contribute to is a sure loser… Now picture two candidates, one intrinsically appealing and the other not so. The appealing candidate raises much more money and wins easily. But was it the money that won him the votes, or was it his appeal that won the votes and the money?... the amount of money spent by the candidates hardly matters at all. A winning candidate can cut his spending in half and lose only 1 percent of the vote. Meanwhile, a losing candidate who doubles his spending can expect to shift the vote in his favor by only that same 1 percent.","page":"9-10","tags":"cause-and-effect, correlation-causation, critical-thinking"},{"book":"Freakonomics","author":"Steven Levitt & Stephen Dubner","year":"2005","text":"This book has been written from a very specific worldview, based on a few fundamental ideas: Incentives are the cornerstone of modern life. And understanding them—or, often, ferreting them out—is the key to solving just about any riddle… The conventional wisdom is often wrong… Dramatic effects often have distant, even subtle, causes… ‘Experts’—from criminologists to real-estate agents—use their informational advantage to serve their own agenda… Knowing what to measure and how to measure it makes a complicated world much less so.","page":"11-12","tags":"incentives, epistemology, second-order-thinking"},{"book":"Freakonomics","author":"Steven Levitt & Stephen Dubner","year":"2005","text":"When people are given a small stipend for donating blood rather than simply being praised for their altruism, they tend to donate less blood. The stipend turned a noble act of charity into a painful way to make a few dollars, and it wasn’t worth it.","page":"20","tags":"incentives, unintended-consequences, human-nature"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"Intellectuals, in the restricted sense which largely conforms to general usage, are ultimately unaccountable to the external world.","page":"8","tags":"accountability, responsibility, incentives"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"To demand that things justify themselves before the bar of reason, in a world where no one has even one percent of all consequential knowledge, is to demand ignorance be convinced and its permission obtained. How can a brain surgeon justify what he does to someone who now nothing about the brain or about surgery?","page":"28","tags":"distributed-knowledge, humility, epistemology"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"In terms of statistical categories, it is indeed true that both the amount of income and the proportion of all income received by those in the top 20 percent bracket have risen over the years, widening the gap between the top and bottom quintiles… in terms of people, the incomes of those particular taxpayers who were in the bottom 20 percent in income in 1996 rose 91 percent by 2005, while the incomes of those particular taxpayers who were in the top 20 percent in 1996 rose by 10 percent by 2005—and those in the top 5 percent and top one percent actually declined… flesh-and-blood human beings move from one statistical category to another over time. When those taxpayers who were initially in the lowest income bracket had their incomes nearly double in a decade, that moved many of them up and out of the bottom quintile.","page":"37","tags":"context, misunderstanding, categories-vs-individuals"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"Just over half of all Americans earning at or near the minimum wage are from 16 to 24 years of age—and of course these individuals cannot remain from 16 to 24 years of age indefinitely, though that age category can of course continue indefinitely, providing many intellectuals with data to fit their preconceptions. Only by focusing on the income brackets, instead of the actual people moving between those brackets, have the intelligentsia been able to verbally create a ‘problem’ for which a ‘solution’ is necessary. They have created a powerful vision of ‘classes’ with ‘disparities’ and ‘inequities’ in income, caused by ‘barriers’ created by ‘society’.","page":"39","tags":"context, categories-vs-individuals, statistical-fallacy"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"The reason for the large discrepancy between growth rate trends in household income and growth rate trends in individual income is very straightforward: The number of persons per household has been declining over the years… Despite such obvious and mundane facts, household or family income statistics continue to be widely cited in the media and in academia—and per capita income statistics widely ignored, despite the fact that households are variable in size, while per capita income always refers to the income of one person.","page":"40","tags":"context, misunderstanding, hidden-factors"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"Just as household statistics understate the rise in the American standard of living over time, they overstate the degree of income inequality, since lower income households tend to have fewer people than upper income households. While there are 39 million people in households whose incomes are in the bottom 20 percent, there are 64 million people in households whose incomes are in the top 20 percent.","page":"40","tags":"context, statistical-fallacy, misunderstanding"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"Even if every person in the entire country received exactly the same income, there would still be a significant ‘disparity’ between the average incomes received by households containing 64 million people compared to the average income received by households containing 39 million people.","page":"41","tags":"statistical-fallacy, definitions, misunderstanding"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"If, at any given time, three-quarters of the consumers prefer to buy the Acme brand of widgets to any other brand, then Acme Inc. will be said to ‘control’ three-quarters of the market, even though consumers control 100 percent of the market.","page":"65","tags":"definitions, misunderstanding, rhetoric"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"The verbal packaging of consumer choice as business ‘control’ has become so widespread that few people seem to feel a need to do anything so basic as thinking about the meaning of the words they are using… By saying that businesses have ‘power’ because they have ‘control’ of their markets, this verbal virtuosity opens the way to saying that government needs to exercise its ‘countervailing power’ in order to protect the public… government power is in fact power, since individuals do not have a free choice as to whether or not to obey government laws and regulations, while consumers are free to ignore the products marketed by even the biggest and supposedly most ‘powerful’ corporations in the world.","page":"66","tags":"rhetoric, definitions, control, consumer-behavior"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"When the actual well-being of prisoners conflicts with the symbolic issue of preventing more prisons from being built, prisoners become just another sacrifice on the altar to a vision. In many ways, on a whole range of issues, the revealed preference of intellectuals is to gain moral authority—or, vicariously, political power—or both, over the rest of society.","page":"106-107","tags":"means-vs-ends, revealed-preference, incentives, unintended-consequences"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"By thinking in terms of abstract people in an abstract world, intellectuals evade the responsibility and the arduous work of learning the real facts about real people in the real world—facts which often explain the discrepancies between what intellectuals see and what they would prefer to see. Many of what are called social problems are differences between the theories of intellectuals and the realities of the world—differences which many intellectuals interpret to mean that it is the real world that is wrong and needs changing.","page":"118","tags":"abstractions, epistemology, theory-vs-practice, intellectual-humility"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"After China’s communist government decided in the late twentieth century to make their economy increasingly capitalistic, the dramatically increased economic growth rate led to an estimate one million Chinese per month rising out of poverty… Yet virtually none of the intellectuals who have been preoccupied with poverty for years has shown any real interest in the actual reduction of poverty through market mechanisms in China, India or anywhere else. It did not happen in either the way they predicted or the way they preferred—so it was disregarded, as if it had not happened at all.","page":"154","tags":"outcomes, poverty, ideology, evidence"},{"book":"Intellectuals and Society","author":"Thomas Sowell","year":"2009","text":"Sweeping claims, alarming predictions, and heated moral crusades can generate a sense of importance for intellectuals in the mind of the public, as well as in their own minds. But to sustain that sense of importance, continuing and often strenuous efforts are necessary. In short, public intellectuals ‘cannot operate at room temperature’... It is hard to think of any decade within the past century when the intelligentsia were not embarked on some urgent crusade to save the world from some great danger to which ordinary folk were considered oblivious.","page":"296","tags":"incentives, self-interest, status, rhetoric"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Of the doctrines central to the Stoic worldview, perhaps the most important is the unwavering conviction that the world is organized in a rational and coherent way. More specifically, it is controlled and directed by an all-pervading force that the Stoics designated the term logos… On a cosmic level it is the rational principle that governs the organization of the universe. In this sense it is synonymous with ‘nature,’ ‘Providence,’ or ‘God’… All events are determined by the logos, and follow in an unbreakable chain of cause and effect.” (p. xx)","page":"","tags":"philosophy, order, first-principles, worldview"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Things outside our control have no ability to harm us. Acts of wrongdoing by a human agent harm the agent, not the victim. Acts of nature such as fire, illness, or death can harm us only if we choose to see them as harmful.” (p. xxix)","page":"","tags":"control, perception, stoicism, responsibility"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Everywhere, at each moment, you have the option:\n•\tTo accept this event with humility [will];\n•\tTo treat this person as he should be treated [action];\n•\tTo approach this thought with care, so that nothing irrational creeps in [perception].” (p. xxx)","page":"","tags":"decision-making, temperament, discipline, action"},{"book":"Meditations","author":"Marcus Aurelius","year":"","text":"Concentrate every minute like a Roman—like a man—on doing what’s in fr
