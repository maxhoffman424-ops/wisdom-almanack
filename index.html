 above-average rate, they have to have some kind of sustainable competitive advantage. These stocks generate high ROEs.","page":"78","tags":"growth, competitive-advantage, return-on-equity"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Say we have a business with $100 million in equity, and we make a $20 million profit. That's a 20 percent ROE. There is no dividend. If we took that $20 million at the end of the year and just put it in the bank, we'd earn, say, 2 percent interest on that money. But the rest of the business would continue to earn a 20 percent ROE. That 20 percent ROE will actually come down to about 17 percent in the first year and then 15 percent as the cash earning a 2 percent return blends in with the business earning a 20 percent return. So when you see a company that has an ROE of 20 percent year after year, somebody is taking the profit at the end of the year and recycling back in the business so that ROE can stay right where it is. A lot of people don't appreciate how important the ability to reinvest those profits and earn a high ROE is.","page":"79","tags":"return-on-equity, reinvestment, compounding"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Mauboussin suggests creating an industry map. This details all the players that touch an industry. For airlines this would include aircraft lessors (such as Air Lease), manufacturers (Boeing), parts suppliers (B/E Aerospace) and more... What Mouboussin aims to do is show where the profit in an industry winds up. These profit pools can guide you on where you might focus your energies.","page":"125","tags":"industry-analysis, profitability, value-chain"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Consider a business with $100 invested in it. Say it earns a 20 percent return on its capital in one year. That is a high return and would get Akre interested. A 20 percent return implies $20 in earnings. But the key to a really great idea would be a business that could then take that $20 and reinvest it alongside the original $100 and earn a 20 percent return again and again and again.","page":"171","tags":"return-on-capital, reinvestment, compounding"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"You shouldn't go dumpster diving if you want to turn up 100-baggers. Great stocks have a ready fan club, and many will spend most of their time near their 52-week highs, as you'd expect. It it rare to get a truly great business at dirt-cheap prices. If you spend your time trolling stocks with price-earnings ratios of five or trading at deep discounts to book value or the like, you're hunting in the wrong fields--at least as far as 100-baggers go. You may get lucky there, of course, but the targets are richer in less austere settings.","page":"176","tags":"quality, valuation, price-vs-value"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"People seem more comfortable investing in something about which they are entirely ignorant. There seems to be an unwritten rule on Wall Street: If you don't understand it, then put your life savings into it.","page":"24","tags":"circle-of-competence, ignorance-hypothesis, investor-education"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Gig my gigahertz and whetstone my megaflop, if you couldn't tell if that was a racehorse or a memory chip you should stay away from it, even though your broker will be calling to recommend it as the opportunity of the decade to make countless nanobucks.","page":"24","tags":"circle-of-competence, technology, complexity"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"It is personal preparation, as much as knowledge and research, that distinguishes the successful stockpicker from the chronic loser. Ultimately it is not the stock market nor even the companies themselves that determine an investor's fate. It is the investor.","page":"27","tags":"preparation, temperament, responsibility"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Wait for the earnings. You can get tenbaggers in companies that have already proven themselves. When in doubt, tune in later.","page":"152","tags":"patience, earnings-quality, proven-model"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Here's another way to think about earnings and assets. If you were a stock, your earnings and assets would determine how much an investor would be willing to pay for a percentage of your action. Evaluating yourself as you might evaluate General Motors is an instructive exercise, and it helps you get the hang of this phase of the investigation.","page":"156","tags":"intrinsic-value, earnings-quality, asset-plays"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"A slightly more complicated formula enables us to compare growth rates to earnings, while also taking the dividends into account. Find the long-term growth rate (say, Company X's is 12 percent), add the dividend yield (Company X pays 3 percent), and divide by the p/e ratio (Company X's is 10). 12 plus 3 divided by 10 is 1.5. Less than a 1 is poor, and 1.5 is okay, but what you're really looking for is a 2 or better. A company with a 15 percent growth rate, a 3 percent dividend, and a p/e of 6 would have a fabulous 3.","page":"199","tags":"valuation, price-earnings-ratio, growth"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"I always check to see if inventories are piling up. With a manufacturer or a retailer, an inventory buildup is usually a bad sign. When inventories grow faster than sales, it's a red flag.","page":"215","tags":"inventory, financial-analysis, warning-signs"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"There's no arbitrary limit to how high a stock can go, and if the story is still good, the earnings continue to improve, and the fundamentals haven't changed, 'can't go much higher' is a terrible reason to snub a stock.","page":"266","tags":"price-vs-value, fundamentals, mental-models"}];

{"id":"jentry030","ticker":"TSTL.L","name":"Tristel plc","exchange":"AIM","verdict":"watch","target_price":"320","tags":"UK, infection-prevention, healthcare, consumables, regulatory-moat, asset-light, AIM, hospital, chlorine-dioxide, US-optionality","irr_bear":"10","irr_base":"15","irr_bull":"22","summary":"AIM-listed UK infection prevention company. Proprietary chlorine dioxide (ClO2) chemistry used for hospital medical device decontamination (87% of revenue). Products approved in 40+ countries across ultrasound, endoscopy, ENT, ophthalmology, and urology. FY2025: Revenue £46.5M (+11%), gross margin 81%, adjusted PBT £10.1M (+23%), FCF £9.5M, net cash £6.97M, zero financial debt. 13-year revenue CAGR 12%, operating income CAGR 22%. EBIT/Sales ~15-22% range (adjusted). US FDA-cleared (Tristel ULT 2023, Tristel OPH 2025) via Parker Laboratories partnership — royalties only £108k FY2025 but sixfold growth in H1 FY2026. Core business fairly valued at 367p; US optionality effectively free at this price.","bull_case":"US royalties scale from £108k toward £3-5M by FY2030 as Parker Laboratories drives formulary adoption across 200+ engaged health systems. Second FDA clearance (OPH) opens ophthalmology as new vector. Geographic expansion (Spain, India, Austria) compounds on top. Owner earnings reach £15-18M. Multiple expands as US narrative confirmed. IRR: 20-25%.","base_case":"Core business continues 10-12% revenue CAGR driven by procedure volume growth, 3-4% annual pricing, and geographic maturity. US contributes £1-2M royalties by FY2030. Adjusted EBIT margins hold 21-22%. Owner earnings grow to ~£13-14M in 5 years. Multiple flat ~17x FCF. IRR: 14-16%.","bear_case":"US fails to convert engagement into volume — hospital procurement bureaucracy delays formulary inclusion 3+ more years. UK growth reverts to 5-7%. CEO instability delays international execution. Margins compress to 17-18% as headcount rises without revenue. IRR: 10-11%.","kill_thesis":"US royalties remain below £500k for 3 more years. New CEO hire weak on execution. Accounting restatements continue (3+ consecutive years). Parker Laboratories deprioritises Tristel ULT. EBIT margins compress to 17% range confirming operating leverage thesis wrong.","created":"2026-04-28T00:00:00.000Z","updated":"2026-04-28T00:00:00.000Z","ebit_stability":"PASSES at B+ grade. Adjusted EBIT/Sales: ~15-16% (FY2019), ~17-18% (FY2022), 17.2% (FY2023), 19.6% (FY2024), 21.7% (FY2025). Range 15-22% over 7 years with upward trend. Not as tight as KPG (27-34%) but passes the primary filter. COVID year dip forgivable for hospital-facing consumables.","entry_price":"367p","entry_price_num":3.67,"entry_shares":"47.7M","entry_market_cap":"£175M","entry_ev":"£168M","entry_date":"2026-04-28","owner_earnings":"~£9.8M (FCF £9.5M; OCF £10.3M less ~£0.5M maintenance capex)","log":[{"id":"jentry030l1","date":"2026-04-28T00:00:00.000Z","text":"Initial Research - April 2026 (367p, £175M market cap):\n- Proprietary chlorine dioxide chemistry for hospital medical device decontamination. 30 years of regulatory approvals in 40+ countries.\n- 87% revenue from Tristel-brand medical device decontamination. 8% Cache surface disinfection. 5% other.\n- ~61% international, ~39% UK. 16 direct subsidiaries. ~270 employees.\n- FY2025: Revenue £46.5M (+11%), gross margin 81%, adj. PBT £10.1M (+23%), FCF £9.5M, net cash £6.97M, zero financial debt.\n- 13yr revenue CAGR 12%, operating income CAGR 22%, net income CAGR 19%.\n\nMoat layers:\n- Regulatory approval per country/product/device = multi-year barrier. 40+ countries, 30 years of work cannot be quickly replicated.\n- Protocol entrenchment: once in hospital infection control protocol, switching requires committee re-approval, staff retraining, new regulatory sign-off.\n- Compatibility database: tested/approved on 1,000+ ultrasound transducer models. Invisible asset.\n- Formulation know-how: ClO2 chemistry is known but precise, safe, non-corrosive dosing for medical devices is 30-year manufacturing expertise.\n\nGrowth engine (key distinction from capital-deployment compounders):\n- NOT capital-deployment growth. Low reinvestment rate (~17%) is correct and fine.\n- Growth is asset-light: procedure volume (aging population), 3-4% annual pricing, geographic expansion within existing hospitals, new country approvals.\n- ROIC x reinvestment rate formula does NOT apply. Growth comes from income statement (SG&A market development), not balance sheet.\n- 83% dividend payout coexisting with 10-12% earnings growth is not a paradox - it is proof of capital-free growth.\n\nUS Opportunity (the free option):\n- FDA De Novo clearance Tristel ULT (ultrasound HLD) June 2023. Partner: Parker Laboratories (exclusive manufacture/distribution).\n- FDA clearance Tristel OPH (ophthalmology HLD) May 2025.\n- 215M ultrasound scans/year in US, ~20% requiring HLD = 43M procedures. At £0.38 royalty = £16.3M peak annual royalty potential.\n- FY2025 US royalties: £108k. H1 FY2026: ~£650k annualised (+6x YoY). Still immaterial but direction confirmed.\n- ~200 health systems engaged. AAMI standard updated Dec 2024 recognising ClO2 foam. AIUM guidelines expanded Nov 2025.\n- Clorox parallel (2008-2011 failed licence) noted. Parker is better partner but US hospital procurement is slow (2-5yr formulary cycle).\n\nManagement concerns:\n- Two consecutive short-tenure CEOs. Paul Swinney retired Sept 2024. Matt Sassone joined Sept 2024, left early 2026 (<2 years). Continuity risk.\n- Board insider ownership <1% (£1.2M on £175M market cap). Hired management, not owner-operators.\n- Successive minor accounting restatements FY2022, FY2023, FY2024. New CFO Anna Wasyl appointed 2025.\n- Capital allocation conservative: no debt, progressive dividend, no value-destructive M&A.\n\nValuation at 367p:\n- Owner earnings yield: ~5.6% (£9.8M / £175M)\n- Forward PE: ~20x | EV/FCF: ~17.7x | EV/EBITDA: ~13x\n- 15% IRR math: 5.6% yield + ~10% OE growth = ~15.6% base case. Barely clears with no margin of safety.\n- Buy zone: 300-320p (OE yield 6.5-7%, base case IRR 17-18%, US option essentially free)\n- Focused Compounding: No coverage found. Structural neglect by US value investing community."}],"scorecard":{"date":"Apr 2026","frameworks":[{"title":"Gannon","items":[{"criterion":"EBIT/Sales stability (primary filter)","rating":"pass","note":"Adjusted EBIT/Sales 15-22% over 7 years with upward trend. B+ grade - not as tight as KPG but passes. COVID dip forgivable."},{"criterion":"Owner earnings yield >4%","rating":"pass","note":"5.6% OE yield at 367p (£9.8M OE / £175M market cap). Adequate."},{"criterion":"Yield + growth clears 15% hurdle","rating":"warn","note":"5.6% + ~10% growth = ~15.6%. Barely clears. No margin of safety at 367p. Buy zone 300-320p."},{"criterion":"Maintenance capex minimal","rating":"pass","note":"£857k total capex vs £10.3M OCF = 8%. Effectively capital-free growth confirmed."}]},{"title":"Lynch","classification":"Fast Grower (transitioning to Stalwart)","items":[{"criterion":"PEG ratio < 1.5","rating":"pass","note":"Forward PE ~20x, earnings growth ~15-17%. PEG ~1.2-1.3. Acceptable for this quality."},{"criterion":"Simple, understandable product","rating":"pass","note":"Hospital wipes that kill pathogens on medical devices. Simple story, verifiable at point of use."},{"criterion":"Institutional neglect","rating":"pass","note":"AIM-listed, no US institutional coverage, no Focused Compounding coverage. Structural neglect."},{"criterion":"Insider ownership meaningful","rating":"fail","note":"<1% board ownership (£1.2M). Hired management. Weak for Lynch-style alignment."}]},{"title":"Mayer 100-Baggers","items":[{"criterion":"High ROIC (>15%)","rating":"pass","note":"15-16% reported; 80-100%+ on tangible capital. Formula understates economics for asset-light model."},{"criterion":"High reinvestment rate","rating":"warn","note":"Low reinvestment rate (~17%) by design - growth is capital-free. ROIC x reinvestment formula misapplied here."},{"criterion":"Long runway","rating":"pass","note":"40+ countries with low penetration. US barely started. Spain, India, Austria next. Runway genuinely long."},{"criterion":"Owner-operator DNA","rating":"fail","note":"Sub-1% insider ownership. Two consecutive short-tenure CEOs. Primary structural weakness."}]},{"title":"Buffett / Fin. Statements","items":[{"criterion":"Gross margin >40%","rating":"pass","note":"81% gross margin. Exceptional for a manufacturer. Closest analogy is software or pharma."},{"criterion":"Net margin trend positive","rating":"pass","note":"Rising: ~12% (FY2023) to 15% (FY2024). FY2025 at 14% depressed by one-off succession costs."},{"criterion":"Low debt / clean balance sheet","rating":"pass","note":"Zero financial debt. £12.8M cash. Net cash £6.97M. D/E 0.18 (lease liabilities only)."},{"criterion":"Capex <50% of net income","rating":"pass","note":"£857k capex vs £6.6M net income = 13%. Extraordinary capital efficiency."},{"criterion":"Accounting integrity","rating":"warn","note":"Successive minor restatements FY2022, FY2023, FY2024. Finance function has not kept pace with growth. Monitor closely."}]},{"title":"Phil Fisher","items":[{"criterion":"Sufficient market potential","rating":"pass","note":"Hospital infection prevention structurally growing. HAIs kill ~100k/year in US alone. Regulatory tightening globally."},{"criterion":"Management committed to new products","rating":"pass","note":"Active pipeline: Tristel OPH (FDA cleared 2025), Cache range, 3T digital compliance platform, VISICLEAN."},{"criterion":"Worthwhile and improving margins","rating":"pass","note":"81% gross, 22% adj. EBIT. Among the best at this size in any sector."},{"criterion":"Depth of management","rating":"fail","note":"Two CEO changes in 18 months. New CFO untested. Executive bench too thin for this growth phase."},{"criterion":"US distribution dependency","rating":"warn","note":"Parker Laboratories exclusive US partner. Fisher would prefer direct commercial control in world's largest market."}]},{"title":"Greenblatt","items":[{"criterion":"Earnings yield (EBIT/EV)","rating":"warn","note":"~5.7% EBIT/EV at 367p. Not a cheap screen but reasonable for quality."},{"criterion":"Return on tangible capital","rating":"pass","note":"80-100%+ ROIC on tangible assets. Greenblatt would rate quality extremely high."}]}]}},

        "date": "2026-03-19T00:00:00.000Z",
        "text": "Initial Research Notes (March 2026):\n- AIM-listed UK defence manufacturer. HQ Doncaster. Founded 1962. ~220M GBP market cap (~13.30/share x 16.5M shares)\n- Four divisions: Defence & Security (70% rev), Forgings (12%), Petrol Station Superstructures (13%), Corporate Branding (<5%)\n- FY2025 results (year ending April 30, 2025): Revenue 117.5M GBP (+7.2% YoY), PBT 20.1M GBP (vs 15.7M 2024), EPS 90p (vs 71p 2024), Net cash 27.8M GBP, zero debt\n- Defence division FY2025: Revenue 82.5M GBP (+22.6% YoY), EBIT 18M GBP = 21.8% divisional margin\n- H1 FY2026 (ended Oct 2025): Cash 35.7M GBP. Interim dividend raised to 6p. US Navy contract renewed Oct 2025.\n- FY2024 order intake: 100M+ GBP including Royal Navy, US Navy, German Navy (first deliveries FY2025)\n- Bell family controls the register. No debt, no dilution ever.\n\nInvestment Thesis:\n- NATO naval gun monopoly-lite: MSI is primary supplier of 30mm naval weapon systems to UK, US, and German navies. 10+ year military qualification cycles = enormous switching costs.\n- PALADIN counter-drone is a new, high-growth product line riding secular defence spending increase\n- Net cash 27-35M GBP on 220M GBP market cap = significant hidden balance sheet strength\n- P/E 14.8x on EPS 90p. EPS CAGR 20%+ (FY2023-FY2025). PEG ~0.7. ROIC ~48% TTM.\n\nKey Concerns (Gannon Lens):\n- FAILS Gannon's EBIT/Sales stability filter: PBT swung from 5.1M GBP (FY2023) to 20.1M (FY2025) on similar revenue base. Contract timing drives results. Not a quality compounder.\n- Customer concentration: largest customer = 37% of group revenue in FY2025 (was a DIFFERENT customer at 27% in FY2024). Binary risk.\n- Working capital lumpiness: FY2024 saw +38M GBP contract liabilities (cash-positive); FY2025 was minimal. Reported cash misleads. FCF 7.7M vs PBT 20.1M.\n- Forgings and Petrol Station divisions declining ~21% each in FY2025 — structural headwinds in 30% of the business.\n\nValuation Math (~13.30 GBP/share, ~220M GBP market cap):\n- EV = 220M - 28M cash = 192M GBP\n- Normalized owner earnings: ~10-12M GBP/year. FCF yield ~5-5.5%.\n- Return equation: 5% FCF yield + 10-12% EPS growth = 15-17% base case IRR\n- Bull case: multiple expansion 14x to 18-20x + EPS growth = 20%+ IRR\n- Bear case: contract miss, de-rates to 10x P/E = 5-7% IRR\n- Verdict: WATCH. Passes 15% hurdle in base/bull case. But EBIT/Sales instability and customer concentration are real concerns. Size conservatively until H2 FY2026 results confirm trend."

        "date": "2026-03-19T12:00:00.000Z",
        "text": "Research Log — March 19, 2026 | Price: ~1,210p | Verdict: PASS\n\nFull institutional-grade primer completed. PASS — and importantly, this is more of a circle of competence pass than a financial one. The historical numbers actually look quite attractive on the surface: 34% gross margins, 15.9% EBIT margin in FY2025, ~48% ROIC, zero debt, £28m net cash, strong insider alignment (Bell family ~37%). The financials alone wouldn't have killed this one.\n\nThe problem is I don't have sufficient edge to underwrite the forward assumptions this thesis requires. Defence procurement cycles, NATO budget politics, shifting weapons doctrine (30mm guns vs directed energy vs directed procurement), and government contract timing are all genuinely opaque to me. I can read the annual report but I can't meaningfully assess whether the US Navy renews the 30mm programme next year, whether counter-drone budgets expand or get cut in a budget review, or whether the German Navy order is a one-time event or the start of a European pipeline. That's a lot of weight resting on assumptions I can't independently verify.\n\nWhy Pass — The Honest Breakdown:\n1. Circle of competence, primarily. The industry is genuinely volatile and hard to forecast from the outside. The business involves lumpy point-in-time government contract delivery, shifting NATO procurement priorities, and defence doctrine uncertainty. These are structural features of the industry, not fixable information gaps.\n2. Fails Gannon's EBIT/Sales stability test. EBIT margins ranged from 5.6% (FY2023) to 15.9% (FY2025) in five years. That's not the stable, predictable margin profile of a quality compounder — it's a lumpy defence contractor whose revenue recognition swings around with contract delivery timing.\n3. Re-rating has already happened. The easy money was buying sub-£100m when PALADIN was ramping but not yet in the price. At £200m market cap the conglomerate discount is largely closed and you're paying for a defence story that is partially priced in.\n4. Cash conversion is unreliable. FY2024 operating cash: £39.2m. FY2025: £0.9m. Both years had similar underlying earnings. The progress payment cycle creates artificial OCF swings that make it very hard to know what the business is actually earning in real time.\n5. The industry is going to be volatile going forward. Even if I could understand it better, defence spending is subject to geopolitical cycles, government budget reviews, election outcomes, and procurement delays that make the future inherently lumpy. The volatility isn't just historical — it's structural to the business.\n\nIRR Math at 1,210p (~£173m EV):\n- Normalised owner earnings ~£12-13m → ~7.5% OE yield on EV\n- Need 7-8% sustained growth to hit 15% hurdle — achievable in bull case, fragile in base case\n- Bear case (US Navy pause + no new orders): sub-10% IRR"

        "date": "2026-04-15T00:00:00.000Z",
        "text": "Pass at $10.42. AMNF is a high-quality micro-cap ($76M revenue, $334M market cap) frozen food manufacturer—#1 U.S. foodservice pesto supplier with 56% ROIC, 31% operating margin, debt-free balance sheet, 100+ consecutive profitable quarters. Economics are exceptional: capital-light model ($2M annual capex), 100%+ cash conversion, returning 89% of FCF to shareholders via dividends (100+ consecutive quarters, $0.20/share annually) and buybacks ($12M authorized, 3.4% share count reduction in 2025).\n\nThe moat is real but narrow: 50-year incumbency in frozen pesto (invented the category), BRC AA certification (highest food safety rating), brand trust in B2B foodservice (switching costs for chains), scale advantages on commodity purchasing. Frozen format creates structural advantage vs. fresh pesto (18-24 month shelf life vs. 7 days, eliminates kitchen labor).\n\nHowever, AMNF fails Gannon critical EBIT/Sales stability test. Operating margins ranged from 7% (2020 COVID) to 31% (2025)—a 2,400 bps swing. Even excluding COVID, margins went from 15% (2021) to 31% (2025), driven by: (1) commodity agreements locking in pre-inflation pricing, (2) mix shift to higher-margin specialty sauces (chimichurri, harissa growing 15-20%/year), (3) operating leverage as revenue grew 31% while SG&A grew only 19%. Core question: is 31% the new normal or peak cycle?\n\nValuation offers no margin of safety at $10.42: 17.4x P/E, 12.3x EV/EBIT, 5.4% owner earnings yield, 1.7 PEG ratio. Base case IRR is 13% (5.4% yield + 7% growth + flat multiple)—below 15% hurdle. To hit 15%, need bull case: 28%+ margins hold, 10-12% revenue growth (QSR wins + international scaling), 3-5%/year buybacks, multiple expansion to 15x EBIT. Probability under 25%.\n\nComparison to portfolio: AMNF has KPG-like margins (31%) and ROIC (56%) but lacks KPG 8-year track record of margin stability. MUEL analogy is apt—both are high-quality businesses with expanding margins that have not yet proven durability         try { scorecard = JSON.parse(raw); } catch(e) { scorecard = {}; }
        window[cacheKey] = scorecard;
        renderScorecard(stockId, scorecard);
    } catch(e) {
        panel.innerHTML = `<div style="color:#991B1B;font-size:0.85rem">Could not generate scorecard. <button class="ai-refresh-btn" onclick="loadAiScorecard('${stockId}','${ticker}','${name}','${logJson}',true)">Retry</button></div>`;
    }
}

function renderScorecard(stockId, sc) {
    const panel = document.getElementById('ai-scorecard-' + stockId);
    if (!panel || !sc) return;

    const FRAMEWORKS = [
        { key: 'gannon',  label: '📐 Gannon (EBIT/Sales + 15% Math)',  color: '#1B3A57' },
        { key: 'lynch',   label: '📖 Lynch (Classification + PEG)',      color: '#2C5282' },
        { key: 'mayer',   label: '💯 Mayer (100-Baggers)',               color: '#1a5276' },
        { key: 'buffett', label: '🏦 Buffett (Financial Statements)',    color: '#154360' },
        { key: 'fisher',  label: '🔬 Fisher (15-Point Scuttlebutt)',     color: '#0e3251' }
    ];

    let html = `<div style="font-weight:600;font-size:0.9rem;color:var(--navy-dark);margin-bottom:0.75rem">📊 Framework Scorecards</div>`;
    if (sc.verdict) {
        html += `<div style="background:#EFF6FF;border-left:4px solid var(--navy);padding:0.6rem 0.9rem;margin-bottom:1rem;border-radius:0 4px 4px 0;font-size:0.88rem;color:var(--navy-dark)">${sc.verdict}</div>`;
    }

    for (const fw of FRAMEWORKS) {
        const items = sc[fw.key];
        if (!items || !items.length) continue;
        const pass = items.filter(i => i.status === '✅').length;
        const total = items.length;
        const pct = Math.round((pass/total)*100);
        html += `<div style="margin-bottom:0.9rem">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem">
                <span style="font-weight:600;font-size:0.82rem;color:${fw.color}">${fw.label}</span>
                <span style="font-size:0.78rem;font-weight:700;color:${pct>=75?'#10B981':pct>=50?'#F59E0B':'#EF4444'}">${pass}/${total} (${pct}%)</span>
            </div>
            ${items.map(i => `<div style="display:flex;gap:0.5rem;align-items:flex-start;padding:0.3rem 0;border-bottom:1px solid var(--grey-light);font-size:0.82rem">
                <span style="flex-shrink:0;width:1.2rem">${i.status}</span>
                <div><span style="font-weight:500">${i.label}</span> — <span style="color:var(--grey-dark)">${i.note}</span></div>
            </div>`).join('')}
        </div>`;
    }

    html += `<div style="text-align:right;margin-top:0.5rem"><button class="ai-refresh-btn" onclick="loadAiScorecard('${stockId}','${ticker}','${name}','${stockId}',true)">↺ Re-score</button></div>`;
    panel.innerHTML = html;
}

                `<div style="font-size:0.83rem;line-height:1.8;">
                    <p><strong>Step 1 — ROE as the first screen:</strong> Is ROE consistently 15%+? If yes, worth investigating further. If no (and not explained by intentional leverage), move on.</p>
                    <p style="margin-top:0.5rem;"><strong>Step 2 — ROIC for the real picture:</strong> Strip out leverage. Is ROIC above cost of capital? Is it 20%+? You may have a quality compounder.</p>
                    <p style="margin-top:0.5rem;"><strong>Step 3 — ROIIC for the forward view:</strong> What are they earning on <em>new</em> capital? Is ROIIC stable or expanding? This is where conviction is built — or destroyed.</p>
                    <p style="margin-top:0.5rem;"><strong>Step 4 — Gannon's EBIT/Sales stability:</strong> The final quality filter. Stable EBIT margins over 8+ years = the moat is real. Volatile margins = competitive pressure or commodity risk.</p>
                </div>`
            ) +
            fwInsight('<strong>The compounding equation:</strong> Intrinsic value growth ≈ ROIC × Reinvestment Rate. IRR = Owner Earnings Yield + Growth ± Multiple Change. All three metrics feed this equation — ROIC sets the ceiling, ROIIC confirms it\'s holding, ROE gives you the first signal.');
    }

    else if (id === 'realworld') {
        body.innerHTML =
            fwCard('Real-world patterns — what these metrics look like in practice',
                fwTable(['Business type','Typical ROE','Typical ROIC','Reinvestment rate','Pattern'],[
                    ['Capital-light compounder (software, roll-ups)','30–60%+','25–50%','High (60–100%)', fwTag('pass','100-bagger territory')],
                    ['Asset-light services (KPG, consulting)','20–40%','20–35%','Moderate-high (40–80%)', fwTag('pass','Strong compounder')],
                    ['Consumer staples (Coke, P&G)','40–80% (leverage)','15–25%','Low-moderate (20–50%)', fwTag('warn','Stalwart — steady but slow')],
                    ['Industrial / specialty manufacturer','10–20%','10–18%','Variable', fwTag('warn','Cyclical — watch EBIT/Sales stability')],
                    ['Capital-intensive (utilities, airlines)','8–15%','6–12%','Very high (forced)', fwTag('fail','Value trap — ROIC < WACC')],
                    ['Leveraged roll-up (debt-funded)','High (distorted)','10–15%','High', fwTag('fail','Fragile — watch debt trajectory')],
                ])
            ) +
            fwCard('Chris Mayer on reinvestment + ROIC (100 Baggers)',
                fwInsight('"Consider a business with $100 invested in it. Say it earns a 20% return on its capital in one year. That is a high return. A 20% return implies $20 in earnings. But the key to a really great idea would be a business that could then take that $20 and reinvest it alongside the original $100 and earn a 20% return again and again and again."') +
                `<p style="font-size:0.83rem;line-height:1.7;margin-top:0.75rem;">The two questions this forces: (1) Is ROIC genuinely high — above 20%? (2) Can the business actually <em>redeploy</em> earnings at that rate — is the reinvestment runway wide enough? A business with 25% ROIC but no reinvestment opportunity compounds intrinsic value at 0%. The multiple does the work — and multiple expansion is unreliable.</p>`
            ) +
            fwCard('Gannon\'s EBIT/Sales stability as the quality filter',
                `<p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.85rem;">Geoff Gannon's most important quality insight: look at EBIT/Sales (operating margin) over 8–10 years. A business with <strong>historically low volatility in EBIT/Sales</strong> demonstrates a durable moat. Margins that compress and expand with the cycle tell you the business has no pricing power — its returns are cyclical, not structural.</p>` +
                fwTable(['EBIT/Sales stability','What it implies','Impact on ROIC assessment'],[
                    ['Tight band (±2–3pp over 8 years)','Real moat — pricing power + cost control', fwTag('pass','ROIC is structural, trust the number')],
                    ['Moderate variance (±5–8pp)','Some pricing power, some cyclicality', fwTag('warn','Use normalized ROIC, not peak')],
                    ['High variance (±10pp+)','Commodity / competitive dynamics dominate', fwTag('fail','ROIC is cyclical — mean-revert the estimate')],
                ]) +
                fwInsight('<strong>Your portfolio examples:</strong> KPG passes (27–34% operating EBITDA margin over 8 years = structural moat). MUEL fails (rapid margin expansion from a low base = unproven durability). This single distinction drives the position sizing difference: 15–25% for KPG, 8–15% for MUEL.')
            );
    }
    else if (id === 'nwc') {
        body.innerHTML =
            fwCard('Net Working Capital (NWC) — the hidden cash flow variable',
                fwFormula('The definition', 'NWC = Current Assets − Current Liabilities',
                    'More precisely: (Accounts Receivable + Inventory + Prepaid Expenses) − (Accounts Payable + Accrued Liabilities + Deferred Revenue)') +
                `<p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.75rem;">NWC is the cash <em>tied up</em> in a business's operating cycle. When NWC grows, it <strong>consumes cash</strong> — the business has to fund more receivables or inventory before collecting from customers. When NWC shrinks (or is negative), the business <strong>generates float</strong> — it collects from customers before it has to pay suppliers.</p>` +
                fwInsight('<strong>Geoff Gannon\'s insight:</strong> Working capital is the most overlooked item in cash flow analysis. A business reporting $10M of net income can generate only $4M of owner earnings if working capital is consuming $6M per year as revenue grows. Always adjust for ΔWC in the owner earnings calculation.')
            ) +
            fwCard('The Cash Conversion Cycle (CCC)',
                fwFormula('CCC formula', 'CCC = DSO + DIO − DPO',
                    'DSO = Days Sales Outstanding (how long to collect from customers)<br>DIO = Days Inventory Outstanding (how long goods sit in inventory)<br>DPO = Days Payable Outstanding (how long before you pay suppliers)') +
                fwTable(['Component','Formula','What it means','Want it to be...'],[
                    ['DSO','(AR ÷ Revenue) × 365','Days to collect from customers', fwTag('pass','Low — fast collection')],
                    ['DIO','(Inventory ÷ COGS) × 365','Days goods sit in inventory', fwTag('pass','Low — fast turnover')],
                    ['DPO','(AP ÷ COGS) × 365','Days before paying suppliers', fwTag('pass','High — delay payments')],
                    ['CCC = DSO + DIO − DPO','—','Total days cash is tied up in the cycle', fwTag('pass','Low or negative = float business')],
                ]) +
                fwInsight('<strong>The shortcut formula:</strong> WC cash drag = Revenue Growth × (CCC ÷ 365)<br>Example: $15M new revenue × (45-day CCC ÷ 365) = $1.85M cash consumed just to fund one year of growth. This never appears in the income statement.')
            ) +
            fwGrid([
                `<div style="font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--navy);margin-bottom:0.65rem;">Float businesses (negative WC) — the best kind</div>` +
                `<div style="font-size:0.82rem;line-height:1.75;color:var(--grey-dark);">Customers pay before the business incurs costs. Every dollar of revenue growth <em>generates</em> cash rather than consuming it. CCC is negative. Examples: insurance (premiums in, claims later), SaaS with annual prepaid contracts, subscription media, retailers who pay suppliers in 60 days but collect at point-of-sale. KPG is structurally favorable — professional services with invoice-on-delivery and monthly retainers. No inventory. No WIP.</div>`,
                `<div style="font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--navy);margin-bottom:0.65rem;">WC traps — the dangerous kind</div>` +
                `<div style="font-size:0.82rem;line-height:1.75;color:var(--grey-dark);">Custom manufacturers, contractors, and project-based businesses often have long CCCs. Revenue is recognized on completion but cash is tied up in WIP and receivables for months. MUEL is the portfolio example: custom stainless equipment with DSO risk, WIP as % of revenue, and progress payment terms that swing wildly quarter to quarter. A surge in DSO or WIP is often the first signal a project has gone sideways — before the P&L shows it.</div>`,
            ]) +
            fwCard('WC in the Gannon Owner Earnings formula',
                fwFormula('Owner Earnings (Buffett/Gannon)', 'OE = Net Income + D&A − Maintenance CapEx ± ΔNWC',
                    'The ± ΔNWC adjustment is what separates true owner earnings from reported earnings. Positive ΔNWC = cash outflow (subtract). Negative ΔNWC = cash inflow (add).') +
                fwTable(['Business type','Typical WC behavior','OE vs Net Income','Primary monitoring metric'],[
                    ['Asset-light services (KPG)','Structurally favorable (fast collection, no inventory)', fwTag('pass','OE ≈ Net Income'),'Cash conversion ratio'],
                    ['Healthcare services (DR.TO)','Insurance reimbursement DSO is the key variable', fwTag('warn','OE can lag NI'),'DSO trend by payer mix'],
                    ['Custom manufacturer (MUEL)','Heavy WIP + lumpy project cash flows', fwTag('fail','OE often << NI'),'DSO + WIP as % of revenue'],
                    ['Industrial transformer (HPS.TO)','Copper/steel inventory + custom order deposits', fwTag('warn','Variable by cycle'),'Inventory turns + advance deposits'],
                ]) +
                fwInsight('<strong>The monitoring rule:</strong> For any business with a long CCC, track DSO and WIP as % of revenue every quarter. Rising DSO that outpaces revenue growth signals either collection problems or aggressive revenue recognition. This is a leading indicator of earnings quality deterioration — it shows up in the balance sheet before the income statement.')
            ) +
            fwCard('Portfolio application — WC profiles by holding',
                fwTable(['Stock','CCC profile','WC verdict','What to monitor'],[
                    ['KPG (ASX)','Near-zero CCC. Professional services, invoice on delivery, recurring monthly retainers. No inventory.', fwTag('pass','Float-like — WC is a non-issue'),'Cash conversion % vs historical 99.8% benchmark'],
                    ['MUEL (OTC)','Long CCC. Custom pharma/DC equipment. WIP sits for months. Progress payments are the key variable.', fwTag('fail','Primary cash flow risk'),'DSO trend, WIP as % of revenue, progress payment terms each quarter'],
                    ['DR.TO (TSX)','Moderate CCC. Healthcare services. No inventory, but insurance reimbursement DSO varies by payer mix.', fwTag('warn','Monitor DSO'),'AR aging by payer, government vs private mix'],
                    ['HPS.TO (TSX)','Moderate CCC. Copper/steel transformer inputs bought ahead, custom orders (possible deposits).', fwTag('warn','Cyclical inventory risk'),'Inventory turns, advance customer deposits, input cost timing'],
                ]) +
                `<p style="font-size:0.82rem;line-height:1.7;margin-top:0.85rem;color:var(--grey-dark);">The key asymmetry: for KPG, working capital is a structural advantage that we can essentially ignore in the owner earnings calculation. For MUEL, ΔNWC is the single most important cash flow adjustment — a $5M swing in WIP or DSO can make the difference between MUEL generating $20M or $10M of real owner earnings in a given year. This distinction directly drives the sizing difference (KPG 15–25%, MUEL 8–15%).</p>`
            );
    }

    // ── Growth Engine Taxonomy tabs ──────────────────────────────────────

    if (id === 'growth-formula') {
        document.querySelectorAll('[id^="pill-"]').forEach(p => p.style.background = '#fff');
        const pill = document.getElementById('pill-growth-formula');
        if (pill) pill.style.background = '#eef4fb';
        body.innerHTML =
            fwCard('The Standard Formula — and Its Hidden Assumption',
                fwFormula('Earnings Growth', 'Growth = ROIC × Reinvestment Rate',
                    'If a business earns £10M, retains £5M (50% reinvestment rate), and deploys that £5M at 20% ROIC → earnings grow £1M next year. 20% × 50% = 10%.') +
                `<p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.75rem;">This formula is correct and useful — but it has a hidden assumption baked in: that the <strong>only way to grow earnings is to deploy incremental capital</strong>. For capital-intensive businesses (manufacturers, retailers, serial acquirers), this is mostly true. For asset-light businesses, it is often completely wrong.</p>` +
                fwInsight('The formula measures capital-deployment growth. It says nothing about organic growth, pricing power, or operating leverage — which are the primary engines for the best businesses.') +
                fwTable(
                    ['Component', 'What it measures', 'What it misses'],
                    [
                        ['ROIC', 'Return on each new dollar deployed', 'Returns already embedded in the moat'],
                        ['Reinvestment Rate', 'Share of earnings retained & redeployed', 'Growth funded through the income statement (SG&A, R&D)'],
                        ['Formula output', 'Growth from capital deployment alone', 'Pricing, volume leverage, protocol expansion'],
                    ]
                )
            ) +
            fwCard('Three Sources of Earnings Growth',
                `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-bottom:1rem;">
                    <div style="background:#fff;border:1px solid var(--grey-light);border-radius:8px;padding:1rem 1.1rem;">
                        ${fwTag('pass','Formula applies')}
                        <div style="font-weight:600;font-size:0.83rem;margin:0.5rem 0 0.3rem;">1. Deploy more capital</div>
                        <div style="font-size:0.8rem;color:var(--grey-dark);line-height:1.6;">Retain earnings, deploy at high ROIC. The formula captures this perfectly. Requires active management decisions every year.</div>
                    </div>
                    <div style="background:#fff;border:1px solid var(--grey-light);border-radius:8px;padding:1rem 1.1rem;">
                        ${fwTag('warn','Formula partial')}
                        <div style="font-weight:600;font-size:0.83rem;margin:0.5rem 0 0.3rem;">2. Improve returns on existing capital</div>
                        <div style="font-size:0.8rem;color:var(--grey-dark);line-height:1.6;">Same revenue base, but margins expand. Operating leverage as fixed costs spread over higher volume. Formula misses this.</div>
                    </div>
                    <div style="background:#fff;border:1px solid var(--grey-light);border-radius:8px;padding:1rem 1.1rem;">
                        ${fwTag('fail','Formula blind')}
                        <div style="font-weight:600;font-size:0.83rem;margin:0.5rem 0 0.3rem;">3. Grow without any incremental capital</div>
                        <div style="font-size:0.8rem;color:var(--grey-dark);line-height:1.6;">More procedures performed, prices rise, new geographies opened via expensed SG&A. Formula completely misses this.</div>
                    </div>
                </div>`
            );
    }

    if (id === 'growth-types') {
        document.querySelectorAll('[id^="pill-"]').forEach(p => p.style.background = '#fff');
        const pill = document.getElementById('pill-growth-types');
        if (pill) pill.style.background = '#eef4fb';
        body.innerHTML =
            fwCard('Two Fundamentally Different Compounding Machines',
                fwTable(
                    ['', 'Capital-Deployment Compounder', 'Asset-Light Compounder'],
                    [
                        ['Growth engine', 'Deploy retained earnings at high ROIC', 'Volume, pricing, operating leverage'],
                        ['Reinvestment rate', 'High (60–80%) — necessary for growth', 'Low (15–30%) — growth does not require it'],
                        ['Dividend payout', 'Low — cash retained to fund acquisitions', 'High — cash paid out because not needed'],
                        ['Formula applicability', 'High — ROIC × reinvestment works well', 'Low — formula systematically understates growth'],
                        ['Growth stops when…', 'Acquisition pipeline dries up or returns fall', 'Moat erodes or TAM is fully penetrated'],
                        ['Management role', 'Capital allocator is the investment thesis', 'Mostly preserve the moat, not destroy it'],
                        ['Archetype examples', 'KPG, Judges Scientific, Constellation Software', 'TSTL, AMNF, early Microsoft Office'],
                    ]
                ) +
                fwInsight('Neither type is inherently superior. The key is not applying the wrong framework to the wrong type of business. Using ROIC × reinvestment rate on an asset-light business will cause you to systematically underestimate its growth potential.')
            ) +
            fwCard('The Paradox That Trips People Up',
                `<p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.75rem;">An asset-light business paying out 80%+ of earnings as dividends while still growing earnings 10–12% per year looks like a contradiction. It is not. It is the proof that the growth is capital-free.</p>
                <p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.75rem;">With a capital-deployment compounder, you must choose: take the dividend or fund the growth. You can't have both from the same dollar. With an asset-light compounder, the growth comes from somewhere else — so the dividend and the growth coexist.</p>` +
                fwInsight('High payout ratio + consistent earnings growth = strong evidence of capital-free, moat-protected compounding. This is actually the most desirable combination — you get both the income and the growth simultaneously.')
            );
    }

    if (id === 'growth-assetlight') {
        document.querySelectorAll('[id^="pill-"]').forEach(p => p.style.background = '#fff');
        const pill = document.getElementById('pill-growth-assetlight');
        if (pill) pill.style.background = '#eef4fb';
        body.innerHTML =
            fwCard('Where Asset-Light Growth Actually Comes From',
                `<p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.85rem;">The "reinvestment" that drives asset-light growth is real — it just flows through the income statement, not the balance sheet. It shows up as higher SG&A, R&D spend, or regulatory filing costs before it shows up as revenue. Once capitalised habits and protocols are established, the marginal cost of sustaining growth approaches zero.</p>` +
                `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-bottom:1rem;">
                    <div style="background:#fff;border:1px solid var(--grey-light);border-radius:8px;padding:1rem 1.1rem;">
                        ${fwTag('pass','No capital required')}
                        <div style="font-weight:600;font-size:0.83rem;margin:0.5rem 0 0.3rem;">Procedure / unit volume</div>
                        <div style="font-size:0.8rem;color:var(--grey-dark);line-height:1.6;">Aging population, more diagnostic imaging, more surgeries. Tristel earns more without doing anything — the installed hospital base performs more procedures.</div>
                    </div>
                    <div style="background:#fff;border:1px solid var(--grey-light);border-radius:8px;padding:1rem 1.1rem;">
                        ${fwTag('pass','No capital required')}
                        <div style="font-weight:600;font-size:0.83rem;margin:0.5rem 0 0.3rem;">Pricing power</div>
                        <div style="font-size:0.8rem;color:var(--grey-dark);line-height:1.6;">If you can raise prices 3–4% per year with no pushback, earnings grow 3–4% per year for free. The moat IS the pricing power.</div>
                    </div>
                    <div style="background:#fff;border:1px solid var(--grey-light);border-radius:8px;padding:1rem 1.1rem;">
                        ${fwTag('pass','No capital required')}
                        <div style="font-weight:600;font-size:0.83rem;margin:0.5rem 0 0.3rem;">Operating leverage on fixed costs</div>
                        <div style="font-size:0.8rem;color:var(--grey-dark);line-height:1.6;">Regulatory approvals, manufacturing setup, and sales infrastructure are largely fixed. Each incremental £1 of revenue above breakeven drops to the bottom line at very high margins.</div>
                    </div>
                    <div style="background:#fff;border:1px solid var(--grey-light);border-radius:8px;padding:1rem 1.1rem;">
                        ${fwTag('warn','Expensed, not capitalised')}
                        <div style="font-weight:600;font-size:0.83rem;margin:0.5rem 0 0.3rem;">Geographic / protocol expansion</div>
                        <div style="font-size:0.8rem;color:var(--grey-dark);line-height:1.6;">Entering Spain costs a country manager (SG&A, expensed). Once protocols are set, revenue is recurring with near-zero incremental cost. The investment is invisible on the balance sheet.</div>
                    </div>
                </div>`
            ) +
            fwCard('Why ROIC Looks "Low" for Asset-Light Businesses',
                `<p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.75rem;">Reported ROIC for asset-light businesses often looks unimpressive (15–20%) because the denominator includes goodwill and intangibles from acquisitions. Strip those out and calculate return on <em>tangible</em> capital — and you often find 80–200% returns.</p>
                <p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.75rem;">The real assets generating the returns are not on the balance sheet at all: regulatory approvals, protocol entrenchment, brand trust, a trained workforce, a compatibility database. These cost almost nothing to maintain but generate all the value.</p>` +
                fwInsight('For asset-light businesses, always calculate ROIC on tangible capital separately. The reported ROIC figure is distorted by accounting treatment of intangibles and understates the true economics of the business.')
            );
    }

    if (id === 'growth-examples') {
        document.querySelectorAll('[id^="pill-"]').forEach(p => p.style.background = '#fff');
        const pill = document.getElementById('pill-growth-examples');
        if (pill) pill.style.background = '#eef4fb';
        body.innerHTML =
            fwCard('KPG (Kelly Partners Group) — Capital-Deployment Compounder',
                fwFormula('KPG growth engine', 'Growth = ROIC on acquisitions × Reinvestment Rate',
                    'Every acquisition deploys capital (purchase price). That capital earns a return (NPATA from the acquired firm). Formula works well here.') +
                fwTable(
                    ['Metric', 'Value', 'What it means'],
                    [
                        ['Reinvestment rate', '~60–70%', 'Most earnings retained to fund next acquisition'],
                        ['Dividend payout', 'Low', 'Cash retained — not available to shareholders'],
                        ['Organic growth (ex-acq.)', '~4–5%', 'What you\'d get if Brett Kelly stopped buying firms'],
                        ['Formula applicability', 'High', 'ROIC × reinvestment rate is the right lens'],
                        ['Management role', 'Critical', 'Capital allocation IS the investment thesis'],
                        ['Growth stops when…', 'Acquisition targets dry up or prices paid rise', 'Pipeline and discipline are existential'],
                    ]
                ) +
                fwInsight('When you buy KPG, you are partly buying the business and partly buying Brett Kelly\'s future capital allocation decisions. The intrinsic value depends on him continuing to find acquisitions at good prices at scale.')
            ) +
            fwCard('TSTL (Tristel plc) — Asset-Light Organic Compounder',
                fwFormula('TSTL growth engine', 'Growth = Volume + Pricing + Geographic Expansion',
                    'None of these require meaningful capital. Growth flows through the income statement (SG&A for new markets), not the balance sheet.') +
                fwTable(
                    ['Metric', 'Value', 'What it means'],
                    [
                        ['Reinvestment rate', '~17%', 'Low by design — growth does not need capital'],
                        ['Dividend payout', '~83%', 'Cash returned because it is not needed to grow'],
                        ['Organic growth', '10–12%', 'This IS the growth — not an add-on'],
                        ['Formula applicability', 'Low', 'ROIC × reinvestment rate understates growth'],
                        ['Management role', 'Preserve moat', 'Do not destroy what 30 years built'],
                        ['Growth stops when…', 'Moat erodes or TAM fully penetrated', 'Structural, not execution-dependent'],
                    ]
                ) +
                fwInsight('The 83% dividend payout and 10–12% earnings growth coexisting is not a contradiction — it is the proof of capital-free compounding. You get the income AND the growth from the same investment.')
            ) +
            fwCard('Side-by-Side Summary',
                fwTable(
                    ['Question', 'KPG', 'TSTL'],
                    [
                        ['Formula ROIC × Reinvestment applies?', '✅ Yes', '❌ No — misleading'],
                        ['High reinvestment rate = good?', '✅ Essential for growth', '⚠️ Irrelevant — growth is capital-free'],
                        ['High dividend payout = bad?', '⚠️ Limits growth funding', '✅ Proof of capital-free model'],
                        ['Growth requires management action?', '✅ Every year', '⚠️ Mostly automatic'],
                        ['Key risk', 'Bad acquisition or overpaying', 'Moat erosion or US failure'],
                        ['Right valuation lens', 'ROIC × reinvestment IRR grid', 'OE yield + organic growth + optionality'],
                    ]
                )
            );
    }

    if (id === 'growth-diagnosis') {
        document.querySelectorAll('[id^="pill-"]').forEach(p => p.style.background = '#fff');
        const pill = document.getElementById('pill-growth-diagnosis');
        if (pill) pill.style.background = '#eef4fb';
        body.innerHTML =
            fwCard('Diagnosing Which Growth Engine You Are Looking At',
                `<p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.85rem;">Before applying any valuation framework, identify which type of compounder you are looking at. The wrong framework on the wrong business type will lead to systematically wrong conclusions.</p>` +
                fwTable(
                    ['Diagnostic question', 'Capital-deployment signal', 'Asset-light signal'],
                    [
                        ['Dividend payout ratio?', 'Low (<30%) — retaining for reinvestment', 'High (>60%) — capital not needed'],
                        ['Capex as % of OCF?', 'High (>30%) — deploying into the business', 'Minimal (<15%) — little physical investment'],
                        ['Does growth stop if acquisitions stop?', 'Yes — growth is acquired', 'No — growth is organic and structural'],
                        ['Is EBIT/Sales stable over cycles?', 'Possible — depends on acquisition mix', 'Yes — moat protects margins without effort'],
                        ['Staff costs as % of growth?', 'Acquisition costs dominate', 'SG&A for new markets (expensed investment)'],
                        ['What does management talk about on calls?', 'Deal pipeline, acquisition multiples, integration', 'Procedure volumes, regulatory approvals, geographies'],
                    ]
                )
            ) +
            fwCard('The Gannon EBIT/Sales Stability Test — Why It Works For Both',
                `<p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.75rem;">Gannon's primary filter (stable EBIT/Sales over many years) works as a quality test for <em>both</em> growth engine types, for different reasons.</p>
                <p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.75rem;">For capital-deployment compounders: stable margins mean acquisitions are being integrated at consistent quality. Margin expansion signals either discipline or mix shift; margin compression signals overpaying or poor integration.</p>
                <p style="font-size:0.83rem;line-height:1.7;margin-bottom:0.75rem;">For asset-light compounders: stable margins are the direct fingerprint of the moat. If competitors could take revenue, margins would compress. They don't, so the moat is real.</p>` +
                fwInsight('A business with expanding EBIT/Sales (like MUEL going from 1.5% to 14%) fails this test not because the expansion is bad, but because the expansion has not been proven durable across a full cycle. You need at minimum 5–8 years of stability to trust the number.') +
                fwCard('Quick Reference: Which Framework to Use',
                    fwTable(
                        ['Situation', 'Right tool'],
                        [
                            ['Serial acquirer, high reinvestment', 'ROIC × reinvestment rate IRR grid'],
                            ['Asset-light with moat, low reinvestment', 'OE yield + organic growth rate + optionality'],
                            ['Unclear / mixed', 'Run both; the more conservative estimate wins'],
                            ['Expanding margins, unproven', 'Apply discount; wait for 5+ years of stability'],
                            ['Any business, any type', 'EBIT/Sales stability test first — always'],
                        ]
                    )
                )
            );
    }
}

</script>

</body>
