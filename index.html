rnment, history, incentives"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"LBJ’s Great Society initiatives were a deliberate attack on the black family unit… [there were] rules that rendered poor mothers ineligible for benefits when an able-bodied male was present. Black women were instead encouraged, by their government, to raise children alone.","page":"50","tags":"government, incentives, second-order-thinking"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"In 1963, 72 percent of nonwhite families were married and together. By 2017 that data was almost exactly reversed: only 27 percent of black households were married… Policies that were purported to ‘empower’ black America actually resulted in the greatest family breakdown across all demographics.","page":"51","tags":"government, second-order-thinking, incentives"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"LBJ, arguably one of the greatest ‘politicians’ of twentieth-century America, both convinced black America that he was their greatest savior and ensured that they would forever be in need of saving. Black America was both freed and enslaved again within one presidency.","page":"54","tags":"government, incentives, second-order-thinking"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"’What if I took that kind of ‘welfare’ policy and implemented it in your family?... If I said to your sons, ‘Sweetie, you don’t have to work; I’ll take care of everything,’ and if I said to your daughters, ‘Sugar, you go ahead and have as many babies as you want; I’ll give you more money to take care of them,’ what do you think your family would be like in 20 years? I’ll tell you: Your sons would be living at home and not working, your daughters would be having kids out of wedlock, and your family would be a whole lot poorer.’","page":"54","tags":"incentives, human-nature, second-order-thinking"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"The same people who scream about black incarceration rates, economic disparities, and impoverished neighborhoods never lend their voices in attacks against the welfare system, which inspires all three.","page":"63","tags":"incentives, government, unintended-consequences"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"Standing up for inferior blacks must liberate liberals from having to assess their own flawed characters.","page":"103","tags":"human-nature, philosophy, incentives"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"With no one to blame but ourselves for failures, the weight of our own irresponsibility may seem too heavy a burden to bear. It is much easier to go through life with a white supremacist boogeyman.","page":"104","tags":"human-nature, responsibility, decision-making"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"To be clear, the belief that white people are to assume all responsibility for black America’s shortcomings is a form of white power. One must believe in black inferiority to accept the thesis that black America is not responsible for any of its own shortcomings in a free society.","page":"132","tags":"philosophy, human-nature, incentives"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"[LBJ:] These Negroes, they’re getting pretty uppity these days and that’s a problem for us since they’ve got something now they never had before, the political pull to back up their uppityness. Now we’ve got to do something about this, we’ve got to give them a little something, just enough to quiet them down, not enough to make a difference. For if we don’t move at all, then their allies will line up against us and there’ll be no way of stopping them, we’ll lose the filibuster and there’ll be no way of putting a brake on all sorts of wild legislation. It’ll be Reconstruction all over again.","page":"163","tags":"incentives, government, history"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"A never-ending source of political debate today surrounds the injustices of slavery and its (highly implausible) lingering effects some four hundred years later. Quite surprisingly, this topic gets the most airtime and discussion from white liberals seeking positions of power.","page":"239","tags":"incentives, government, history"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"I have since learned that the Left would much sooner believe in the paranormal, like the existence of black people who are supporters of white supremacy, than in the much more logical existence of black conservatism.","page":"264","tags":"human-nature, philosophy, epistemology"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"This is a vicious cycle: taxpayers pay government workers whose money goes to government unions, whose money goes to the campaigns of politicians, who approve more taxpayer money for unions, who then contribute more to the politicians.","page":"11","tags":"incentives, government, capital-allocation"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"Thanks to a housing bubble and artificially low interest rates, a lot of people borrowed money that they could not pay back in order to pay inflated prices for houses they could not afford.","page":"12","tags":"risk, capital-allocation, markets"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"The Fed also keeps interest rates artificially low. Were interest rates as high as the market would set them, and were dollars not being cheapened, people would have more incentive to save and less incentive to borrow.","page":"13","tags":"incentives, capital-allocation, markets"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"These days, because people are going into debt for the sake of consumption… then U.S. indebtedness grows while productive capacity does not.","page":"13","tags":"capital-allocation, productivity, debt"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"The tax credits and handouts draw rational businessmen to invest in technologies that don’t really add value. If these technologies were valuable, they wouldn’t need subsidies in order to draw investment.","page":"22","tags":"incentives, government, capital-allocation"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"Before 1913, banks were, in effect, issuing their own currencies… It was natural, then, for bankers to hatch an idea of a ‘banks’ bank.’ Banks could deposit some of their assets-commercial paper or gold-with the Fed, and the Fed in return would issue its own bank notes to the individual bank… The Fed, as it does today, controlled how much currency was in circulation, but back then, it operated within constraints, and without such ambitious goals.","page":"29","tags":"history, government, markets"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"Each Federal Reserve Note was backed 40 percent by gold and 100 percent by commercial paper (loans from other banks), meaning the Fed was limited in how much currency it could issue.","page":"30","tags":"history, government, monetary-policy"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"[the Fed] was simply trying to match the supply of money to the demand for money. When the economy was expanding and there was more to invest in and spend money on, the Fed would pump in dollars. When there was less demand for money, the Fed would take dollars out of the economy… Today, the Fed increases the money supply when the economy grows, then expands it even faster when it contracts.","page":"30","tags":"markets, monetary-policy, government"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"The Fed was at first prohibited from buying government debt… Woodrow Wilson, when he thrust the U.S. into World War I… had a novel way of financing the fight: selling bonds to the Fed… Wilson got Congress to change the law, and suddenly, the U.S. government had its own magic piggy bank.","page":"31","tags":"government, history, incentives"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"When the Fed buys U.S. bonds… the Fed gets bonds, and the Treasury gets money. The difference is that the Fed doesn’t have any less money than before it paid for the bonds. You see, the Fed ‘pays’ a bank by crediting that bank’s account at the Federal Reserve. There’s no balance from which the Fed deducts that money. It comes out of thin air. The dollars aren’t even printed. They exist only as numbers on a piece of paper or in a computer database.","page":"31","tags":"government, monetary-policy, capital-allocation"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"Without someone buying up mortgages, a bank is limited in how many loans it can make-after all, even with fractional reserve banking and loose reserve requirements, your loans still need to be backed up by some amount of assets. But once you have Fannie and Freddie buying mortgages, there’s no limit. Bank of America can lend money to a homebuyer and then sell the mortgage to Fannie. Bank of America now has its cash back and can lend it out again.","page":"45","tags":"incentives, risk, moral-hazard"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"But almost all government jobs that provide value would be taken up by the private sector if the government ceased taking care of them, meaning the government isn’t creating those jobs, it’s just taking them away from the private sector.","page":"59","tags":"government, economics, productivity"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"So a rational employer reacts by being extra careful when hiring minorities and women… hiring a minority brings added liabilities, in the form of a potential EEOC [Equal Employment Opportunity Commission] case, thus making these candidates less desirable. The perverse effect: antidiscrimination laws reward discrimination.” (p. 64, 65)","page":"","tags":"incentives, unintended-consequences, government"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"In 2007 the U.S. Congress applied the federal minimum wage to Samoa, a U.S. territory. The increases walloped the Samoan economy, with the unemployed rate soaring to 30 percent and inflation hitting double digits.","page":"70","tags":"unintended-consequences, government, incentives"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"Federal deposit insurance creates moral hazard and promotes risky bank behavior… thanks to FDIC, depositors do more market research before buying a $500 flat-screen TV than they do before depositing their life savings into a bank. Banks realize that their customers only care about low fees and high rates, and could not care less about how much risk a bank takes to provide them, so they have no incentive to be safe, and lots of incentive to be reckless.","page":"79","tags":"moral-hazard, incentives, risk, government"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"The standard economic argument about deflation is that when prices start falling, people postpone purchases in order to get lower prices, which slows economic activity to a crawl, which further depresses prices—thus, the ‘deflationary spiral.’","page":"118","tags":"monetary-policy, economics, human-nature"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"The truth is, falling prices do not discourage people from buying; they entice people to buy. The lower prices fall, the more people can afford to buy!","page":"121","tags":"pricing, economics, human-nature"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"Would it really be so bad if gas prices fell? How about health care—would it really be so bad if insurance premiums fell each year instead of rising? What about food? Would be such a disaster if food became less expensive? How about education? Would parents really consider it a tragedy if college tuitions went down instead of up? You get the point. For all the talk about the horror of deflation, I do not know anyone who would not benefit were it actually allowed to happen.","page":"121","tags":"monetary-policy, economics, pricing"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"In two different locations, the Constitution requires that ‘direct taxes’ must be ‘apportioned’—that is, collected from each state proportionate to each state’s population… if the taxpayer is directly sending a check to the government (or having it removed from his paycheck or insurance escrow) it’s a direct tax” (p. 127, 128)","page":"","tags":"government, history"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"No one envisioned that average Americans would ever be subject to the income tax, and even the wealthy did not get soaked too badly. The top rate was just 7 percent on incomes over $500,000, which is well over 10 million in today’s dollars.","page":"131","tags":"government, history"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"To paraphrase Chief Justice John Marshall, tax something high enough and you will actually destroy it. Politicians at times seem to understand this, which is why they create ‘sin taxes’ to discourage the use of tobacco or alcohol. So why do we tax savings, investment, and productive labor?","page":"135","tags":"incentives, government, capital-allocation"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"Soaking the rich doesn’t hurt the rich as much as it hurts those who depend on the rich.","page":"171","tags":"wealth, incentives, unintended-consequences"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"This is typical government action. Wreck an industry with subsidies and regulation; blame the ensuing failure on capitalism; then ‘solve’ the problem with a complete government takeover.","page":"191","tags":"government, markets, unintended-consequences"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"Why should banks risk money loaning to small businesses when they can loan risk free to students? Ironically, student-loan subsidies hurt job creators, thus making it harder for the indebted students to find jobs after they graduate.","page":"193","tags":"unintended-consequences, capital-allocation, incentives"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"Coverage for preexisting conditions… If we imposed the same regulations on property insurers, you could call Allstate while your house was burning and get insured for fire damage. Imagine if you could get insured for auto repairs after you in an accident.","page":"216","tags":"incentives, moral-hazard, risk"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"The conventional wisdom is that the Supreme Court interprets the Constitution. But the Constitution does not have to be interpreted. It’s not written in Chinese. The Constitution is clear. It means precisely what is says. The problem is that liberal judges do not like what the Constitution says so they change its meaning and call it interpretation.","page":"217","tags":"government, philosophy"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"As a society, we could continue to frown on it [marijuana] and discourage people from smoking pot—or at least have a debate over it. Legalizing something isn’t the same as encouraging its use… ask yourself how many people you know who are currently drug free, but who would start doing drugs if they were legal? Not many, I guess.” (p. 241, 242)","page":"","tags":"government, markets, responsibility"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"There is no solution to our current economic problem that doesn’t involve much higher interest rates. The biggest problem underlying the U.S. economy is artificially low interest rates. They are the root cause of the macro economic imbalances that are crippling us. Until rates are allowed to rise to reflect a true market price, a real economic recovery cannot take place.","page":"263","tags":"monetary-policy, interest-rates, risk"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"Interest rates are the price that lenders charge to loan out their savings. Low prices in anything signify a high supply relative to demand. But we don’t have a high supply of savings to loan out, so how do we get low interest rates? The answer is Fed manipulation.” (p. 263, 264)","page":"","tags":"monetary-policy, interest-rates, pricing"},{"book":"The Real Crash","author":"Peter Schiff","year":"2012","text":"If trailing CPI is 5 percent… Getting ahead of the inflation curve might require a 7 percent federal funds rate. However, at 7 percent we can no more afford to pay the interest on our debt than Greece could afford to pay the interest on its debt.","page":"269","tags":"monetary-policy, debt, interest-rates"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"Warren has learned that time will make him superrich when he invests in a company that has a durable competitive advantage working in its favor.","page":"11","tags":"long-term, competitive-advantage, compounding"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"Warren has figured out that these super companies come in three basic business models: They sell either a unique product or a unique service, or they are the low-cost buyer and seller of a product or service that the public constantly needs.","page":"12","tags":"competitive-advantage, business-quality, moats"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"Warren likes to think of these companies as owning a piece of the consumer’s mind, and when a company owns a piece of the consumer’s mind, it never has to change its products.","page":"13","tags":"competitive-advantage, moats, consumer-behavior"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"If the company doesn’t have to keep changing its product, then it won’t have to spend millions on research and development, nor will it have to spend billions retooling its plant to manufacture next year’s model. So the money piles up in the company’s coffers, which means that it doesn’t have to carry a lot of debt, which means that it doesn’t have to pay a lot in interest, which means that it ends up with lots of money to either expand its operations or buy back its stock, which will drive up earnings and the price of the company’s stock—which makes shareholders richer.","page":"16","tags":"moats, capital-allocation, business-quality, competitive-advantage"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"What he has found is that companies that have excellent long-term economics working in their favor tend to have consistently higher gross margins than those who don’t.","page":"33","tags":"competitive-advantage, business-quality, moats, margins"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"What creates a high gross profit margin is the company’s durable competitive advantage, which allows it the freedom to price the products and services it sells well in excess of its cost of goods sold… Companies with gross profit margins of 40% or better tend to be companies with some sort of durable competitive advantage.","page":"34","tags":"moats, pricing, competitive-advantage, margins"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"In the search for a company with a durable competitive advantage the lower the company’s SGA expenses, the better. If they can stay consistently low, all the better. In the world of business anything under 30% [of gross profit] is considered fantastic.","page":"40","tags":"competitive-advantage, cost-advantage, business-quality, margins"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"Companies that have to spend heavily on R&D have an inherent flaw in their competitive advantage that will always put their long-term economics at risk, which means they are not a sure thing.","page":"44","tags":"competitive-advantage, risk, innovation, moats"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"What Warren has figured out is that companies with a durable competitive advantage often carry little or no interest expense… As a rule, Warren’s favorite durable competitive advantage holders in the consumer products category all have interest payouts of less than 15% of operating income… The rule here is real simple: In any given industry the company with the lowest ratio of interest payments to operating income is usually the company most likely to have the competitive advantage.” (p. 51, 52)","page":"","tags":"competitive-advantage, debt, business-quality, moats"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"First on Warren’s list is whether or not the net earnings are showing a historical upward trend… companies with a durable competitive advantage will report a higher percentage of net earnings to total revenues than their competitors will.","page":"61","tags":"competitive-advantage, business-quality, profitability, moats"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"A simple rule… is that if a company is showing a net earnings history of more than 20% on total revenues, there is a real good chance that it is benefiting from some kind of long-term competitive advantage.","page":"62","tags":"competitive-advantage, profitability, business-quality, margins"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"What Warren looks for is a per-share earnings picture over a ten-year period that shows consistency and an upward trend.","page":"64","tags":"business-quality, consistency, competitive-advantage, long-term"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"If we see a lot of cash and marketable securities and little or no debt, chances are very good that the business will sail through the troubled times.","page":"79","tags":"margin-of-safety, business-quality, risk, financial-strength"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"A simple test to see exactly what is creating all the cash is to look at the past seven years of balance sheets… if we see a ton of cash piling up and little or no debt, and no sales of new shares or assets, and we also note a history of consistent earnings, we’re probably seeing and excellent business with the durable competitive advantage that Warren is searching for.","page":"80","tags":"business-quality, competitive-advantage, financial-strength, consistency"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"If a company is consistently showing a lower percentage of Net Receivables to Gross Sales than its competitors, it usually has some kind of competitive advantage working in its favor.","page":"84","tags":"competitive-advantage, business-quality, working-capital, moats"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"An odd thing occurs with companies that benefit from a durable competitive advantage… Wrigley, Pepsi Co., McDonald’s, and even Wal-Mart. Each of these companies benefits from having a durable competitive advantage tied directly to its name; yet the value of their greatest asset, their name, isn’t recognized on their balance sheets.","page":"97","tags":"competitive-advantage, intangible-assets, brand-value, accounting"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"What is interesting about the long-term investment account is that this asset class is carried on the books at their cost or market price, whichever is lower. But it cannot be marked to a price above cost even if the investments have appreciated in value. This means that a company can have a very valuable asset that it is carrying on its books at a valuation considerably below its market price.","page":"100","tags":"accounting, valuation, hidden-value, conservative-accounting"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"Coca-Cola has $43 billion in assets and a return on assets of 12%... But a company like Moody’s, which has $1.7 billion in assets, shows a 43% return on assets… Warren has discovered that really high returns on assets may indicate vulnerability in the durability of the company’s competitive advantage. Raising $43 billion to take on Coca-Cola is an impossible task… But raising $1.7 billion to take on Moody’s is within the realm of possibility… the durability of Moody’s competitive advantage is far weaker because of the lower cost of entry into its business.","page":"105","tags":"return-on-assets, capital-intensity, competitive-advantage, business-quality"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"If there have been ten years of operations with little or no long-term debt on the company’s balance sheet it is a good bet that the company has some kind of strong competitive advantage working in its favor.","page":"118","tags":"competitive-advantage, debt, financial-strength, moats"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"The simple rule here is that, unless we are looking at a financial institution, any time we see an adjusted debt to shareholders’ equity ratio below .80 (the lower the better), there is a good chance that the company in question has the coveted durable competitive advantage.","page":"125","tags":"financial-strength, debt, competitive-advantage, margin-of-safety"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"the rate of growth of a company’s retained earnings is a good indicator whether or not it is benefiting from having a durable competitive advantage… The theory here is simple: the more earnings that a company retains, the faster it grows its retained earnings pool, which, in turn will increase the growth rate for future earnings.","page":"134","tags":"retained-earnings, compounding, competitive-advantage, business-quality"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"Companies with a durable competitive advantage… tend to have lots of free cash that they can spend on buying back their shares. Thus one of the hallmarks of a company with a durable competitive advantage is the presence of treasury shares on the balance sheet.","page":"137","tags":"capital-allocation, share-buybacks, competitive-advantage, business-quality"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"What Warren discovered is that companies that benefit from a durable or long-term competitive advantage show higher-than-average returns on shareholders’ equity. Warren’s favorite, Coca-Cola, shows a return on shareholders’ equity of 30%... High returns on equity mean that the company is making good use of earnings that it is retaining.","page":"141","tags":"return-on-equity, competitive-advantage, capital-allocation, business-quality"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"As a rule, a company with a durable competitive advantage uses a smaller portion of its earnings for capital expenditures for continuing operations than do those without a competitive advantage… Warren has discovered that is a company is historically using 50% or less of its annual net earnings for capital expenditures, it is a good place to look.” (p. 153, 155)","page":"","tags":"capital-expenditures, competitive-advantage, capital-intensity, business-quality"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"In the late 1980s, Warren started buying shares in Coca-Cola for an average price of $6.50 a share against pretax earnings of $.70 a share, which equates to after-tax earnings of $.46 a share. Historically, Coca-Cola’s earnings had been growing at an annual rate of around 15%. Seeing this, Warren could argue that he just bought a Coca-Cola equity bond that is paying an initial pretax interest rate of 10.7% ($6.50 / $.70) on his $6.50 investment. He could also argue that the yield would increase over time at a projected annual rate of 15%.” (p. 162, 163)","page":"","tags":"valuation, compounding, competitive-advantage, case-study"},{"book":"Warren Buffett and the Interpretation of Financial Statements","author":"Mary Buffett & David Clark","year":"2008","text":"What Warren has learned is that if he buys a company with a durable competitive advantage, the stock market, over time, will price the company’s equity bonds/shares at a level that reflects the value of its earnings relative to the yield on long-term corporate bonds… In 2007, they [Coca-Cola] earned a pretax $3.96 per equity bond/share, which equates to an after-tax $2.57 per equity bond/share. Capitalized at the corporate interest rate of 6.5%, Coke’s pretax earnings of $3.96 are worth approximately $60 per equity bond/share   ($3.96 / .065 = $60). During 2007, the stock market valued Coca-Cola between $45 and $64 a share.","page":"165","tags":"valuation, competitive-advantage, earnings-yield, long-term"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"The CEOs at Berkshire’s various operating companies… are given a simple set of commands: to run their business as if (1) they are its sole owner, (2) it is the only asset they hold, and (3) they can never sell or merge it for a hundred years.” (p. 5,6)","page":"","tags":"management, incentives, long-term, owner-operator"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"Many professionals still believe that stock market prices always accurately reflect fundamental values, that the only risk that matters is the volatility of prices, and that the best way to manage that risk is to invest in a diversified group of stocks.","page":"8","tags":"efficient-market-theory, risk, volatility, diversification"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"the term ‘value investing’ is a redundancy. All true investing must be based on an assessment of the relationship between price and value. Strategies that do not employ this comparison of price and value do not amount to investing at all, but to speculation—the hope that price will rise, rather than the conviction that the price being paid is lower than the value being obtained.","page":"12","tags":"value-investing, price-vs-value, speculation, philosophy"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"What he has found is that companies that have excellent long-term economics working in their favor tend to have consistently higher gross margins than those who don’t.","page":"33","tags":"margins, competitive-advantage, business-quality, profitability"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"we would rather see Berkshire’s stock price at a fair level than a high level… We believe, however, that it affords Berkshire the best prospect of attracting long-term investors who seek to profit from the progress of the company rather than from investment mistakes of their partners.","page":"35","tags":"shareholder-base, long-term, partner-selection, intrinsic-value"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"a CEO who doesn’t perform is frequently carried indefinitely. One reason is that performance standards for his job seldom exist… At too many companies, the boss shoots the arrow of managerial performance and then hastily paints the bullseye around the spot where it lands.","page":"38","tags":"management, incentives, corporate-governance, accountability"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"We give each a simple mission: Just run your business as if: (1) you own 100% of it; (2) it is the only asset in the world that you and your family have or will ever have; and (3) you can’t sell or merge it for at least a century.","page":"43","tags":"management, long-term, owner-operator, incentives"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"A horse that can count to ten is a remarkable horse—not a remarkable mathematician.","page":"49","tags":"context, perspective, standards"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"Ronald Reagan’s creed: ‘It’s probably true that hard work never killed anyone, but I figure why take the chance.’","page":"60","tags":"humility, simplicity, philosophy"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"These institutions were then under the spell of academics at prestigious business schools who were preaching the newly-fashioned theory: the stock market was totally efficient, and therefore calculations of business value—and even thought, itself—were of no importance in investment activities. (We are enormously indebted to those academics: what could be more advantageous in an intellectual contest… than to have opponents who have been taught that thinking is a waste of energy?","page":"63","tags":"efficient-market-theory, contrarian, independent-thinking, epistemology"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"Mr. Market is there to serve you, not to guide you… If he shows up some day in a particularly foolish mood, you are free to either ignore him or to take advantage of him, but it will be disastrous if you fall under his influence.","page":"64","tags":"mr-market, volatility, contrarian, temperament"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"Ben’s Mr. Market allegory may seem out-of-date in today’s investment world, in which most professionals and academicians talk of efficient markets, dynamic hedging and betas… After all, what witch doctor has ever achieved fame and fortune by simply advising ‘Take two aspirins’?... The market may ignore business success for a while, but eventually will confirm it.","page":"65","tags":"mr-market, simplicity, contrarian, incentives"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"Only those who will be sellers of equities in the near future should be happy at seeing stocks rise. Prospective purchasers should much prefer sinking prices.","page":"66","tags":"contrarian, long-term, accumulation, temperament"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"The definition of arbitrage… has expanded to include the pursuit of profits from an announced corporate event such as sale of the company, merger, recapitalization, reorganization, liquidation, self-tender, etc. In most cases the arbitrageur expects to profit regardless of the behavior of the stock market. The major risk he usually faces instead is that the announced event won’t happen.","page":"68","tags":"arbitrage, special-situations, event-driven, risk-arbitrage"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"We believe that a policy of portfolio concentration may well decrease risk if it raises, as it should, both the intensity with which an investor thinks about a business and the comfort-level he must feel with its economic characteristics before buying into it.","page":"77","tags":"concentration, risk, decision-making, conviction"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"if you are a know-something investor, able to understand business economics and to find five to ten sensibly-priced companies that possess important long-term competitive advantages, conventional diversification makes no sense for you. It is apt simply to hurt your results and increase your risk.","page":"80","tags":"concentration, diversification, competitive-advantage, conviction"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"Volatility caused by money managers who speculate irrationally with huge sums will offer the true investor more chances to make intelligent investment moves. He can be hurt by such volatility only if he is forced, by either financial or psychological pressures, to sell at untoward times.","page":"83","tags":"volatility, opportunity, temperament, margin-of-safety"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"The investment shown by the discounted-flows-of-cash calculation to be the cheapest is the one that the investor should purchase—irrespective of whether the business grows or doesn’t, displays volatility or smoothness in its earnings, or carries a high price or low [price] in relation to its current earnings and book value.","page":"87","tags":"valuation, intrinsic-value, discounted-cash-flow"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"To suggest that [an] investor should sell off portions of his most successful investments simply because they have come to dominate his portfolio is akin to suggesting that the Bulls trade Michael Jordan because he has become so important to the team.","page":"91","tags":"concentration, conviction, portfolio-management"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"Your goal as an investor should simply be to purchase, at a rational price, a part interest in an easily-understandable business whose earnings are virtually certain to be materially higher five, ten and twenty years from now.","page":"94","tags":"long-term, business-quality, simplicity"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"We simply attempt to be fearful when others are greedy and to be greedy when others are fearful.","page":"127","tags":"contrarian, temperament, mr-market"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"We wish for very little trading activity. If we ran a private business with a few passive partners, we would be disappointed if those partners, and their replacements, frequently wanted to leave the partnership. Running a public company, we feel the same way.","page":"130","tags":"shareholder-base, long-term, partner-selection"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"Unrestricted earnings should be retained only when there is a reasonable prospect… that for every dollar retained by the corporation, at least one dollar of market value will be created for the owners.","page":"132","tags":"capital-allocation, retained-earnings, shareholder-value"},{"book":"The Essays of Warren Buffett","author":"Warren Buffet","year":"1997","text":"Intrinsic value can be defined simply: It is the discounted value of the cash that can be taken out of a business during its remaining life.","page":"200","tags":"intrinsic-value, valuation, discounted-cash-flow"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Focus on buying an existing business. He (Papa Patel – motel owner) bought an existing business with a well-defined business model and one with a long history of operations that he could analyze.","page":"35","tags":"case-study, business-quality, proven-model"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Buy simple businesses in industries with an ultra-slow rate of change. Only invest in businesses that are simple—ones where conservative assumptions about future cash flows are easy to figure out.","page":"57","tags":"simplicity, business-quality, predictability"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Buy distressed businesses in distressed industries. How do we get a list of distressed businesses or industries?\n1.\tIf you read the business headlines on a daily basis, you’ll find plenty of stories about publicly traded businesses. Many of these news clips reflect negative news about a certain business or industry.\n2.\tValue Line publishes a weekly summary of the stocks that have lost the most value in the preceding 13 weeks.\n3.\tLooking directly at the public filings… that institutional investors have to make. \n4.\tTake a look at Value Investors Club.” (p. 62,63)","page":"","tags":"distressed-investing, contrarian, opportunity"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Buy businesses with a durable competitive advantage—the moat. In the overwhelming majority of businesses, the various moats are mostly hidden or only in partial view. It takes some digging to get to the moat.","page":"67","tags":"moats, competitive-advantage, due-diligence"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Even businesses with durable moats don’t last forever… We are best off never calculating a discounted cash flow stream for longer than 10 years or expecting a sale in year 10 to be at anything greater than 15 times cash flows at that time (plus any excess capital in the business).","page":"69","tags":"moats, valuation, conservative-assumptions"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Bet heavily when the odds are overwhelmingly in your favor.","page":"69","tags":"conviction, margin-of-safety, risk-reward"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Focus on arbitrage. With arbitrage, we get decent returns with virtually no risk. The elimination of downside risk, even if upside is limited, is awesome.” (p. 85).","page":"","tags":"arbitrage, risk, downside-protection"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Buy businesses at big discounts to their underlying intrinsic value.","page":"85","tags":"price-vs-value, margin-of-safety, intrinsic-value"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Look for low-risk, high-uncertainty businesses. Low risk and low uncertainty is loved by Wall Street, and stock prices of these securities sport some of the highest trading multiples. Avoid investing in these businesses.","page":"108","tags":"risk, uncertainty, contrarian"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Ultra-high uncertainty and ultra-low risk. If presented with such a scenario, Wall Street will irrationally collapse the quoted value of the business. Always take advantage of a situation where Wall Street gets confused between risk and uncertainty. The results will usually be quite acceptable.","page":"114","tags":"risk, uncertainty, market-inefficiency"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"When extreme fear sets in, there is likely to be irrational behavior. In that situation, the stock market resembles a theater that is filled to capacity. Someone sees smoke and yells ‘Fire, Fire!’ There is a mad rush for the exits. In the theater called the stock market, you can only exit if someone else buys your seat—each share has to be held by someone! If there is a mass rush to leave the burning theater, what price do you think these seats would go for? The trick is to only buy seats in those theaters where there is a mass exodus and you know that there is no real fire, or it’s already well on its way to being put out. Read voraciously and wait patiently, and from time to time these amazing bets will present themselves.","page":"129","tags":"mr-market, temperament, panic-selling"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"It’s better to be a copycat than an innovator. In seeking to make investments in the public equity markets, ignore the innovators. Always seek out businesses run by people who have demonstrated their ability to repeatedly lift and scale. It is the Dhandho way.","page":"145","tags":"management, proven-operators, copycat-advantage"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Here are seven questions that an investor ought to be thinking about before entering any stock market venture:\n1.\tIs it a business I understand very well—squarely within my circle of competence?\n2.\tDo I know the intrinsic value of the business today and, with a high degree of confidence, how it is likely to change over the next few years?\n3.\tIs the business priced at a large discount to its intrinsic value today and in two to three years? Over 50 percent?\n4.\tWould I be willing to invest a large part of my net worth into this business?\n5.\tIs the downside minimal?\n6.\tDoes the business have a moat?\n7.\tIs it run by able and honest managers?","page":"150","tags":"circle-of-competence, checklist, decision-making"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Any stock that you buy cannot be sold at a loss within two to three years of buying it unless you can say with a high degree of certainty that current intrinsic value is less than the current price the market is offering.","page":"153","tags":"temperament, long-term, intrinsic-value, price-vs-value"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"Here are other ponds where we are likely to find more of these fifty-cent dollars:\n1.\tThe Value Investors’ Club (VIC) web site… If an investor just analyzed stocks that are on the Magic Formula [website] and have a VIC write-up, they are likely to do quite well.\n2.\tLook at the 52-week lows on the New York Stock Exchange (NYSE) daily… Most stocks will be ones you’ve never heard of. Ignore these. Fixate on familiar names and then dig deeper on any that pique your interest.\n3.\tSubscribe to Outstanding Investor Digest and Value Investor Insight.\n4.\tSubscribe to Portfolio Reports… it lists the recent buying activity of some of the best money managers in North America.\n5.\tAnother web site that is free and can partly replace Portfolio Reports is Guru Focus.\n6.\tA sister publication of Value Investor Insight is Super Investor Insight. It took tracks the 13-F filings of the super investors of our time.\n7.\tSubscribe to major business publications… The more you read up on the different companies, people, and industries in these publications, the better you’ll get at securities analysis.","page":"175-177","tags":"information-advantage, market-inefficiency, value-investing, proven-model"},{"book":"The Dhandho Investor","author":"Mohnish Pabrai","year":"2007","text":"The Dhandho investor only invests in simple, well-understood businesses. That requirement along likely eliminates 99 percent of possible investment alternatives.","page":"177","tags":"circle-of-competence, simplicity, due-diligence"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"He [an analyst] looked at 19 100-baggers. He drew four conclusions:\n•\tThe most powerful stock moves tended to be during extended periods of growing earnings accompanied by an expansion of the P/E ratio.\n•\tThese periods of P/E expansion often seem to coincide with periods of accelerating earnings growth. \n•\tSome of the most attractive opportunities occur in beaten down, forgotten stocks, which perhaps after years of losses are returning to profitability.\n•\tDuring such periods of rapid share price appreciation, stock prices can reach lofty P/E ratios. This shouldn’t necessarily deter one from continuing to hold the stock.","page":"32","tags":"case-study, earnings-yield, valuation, compounding"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Earnings per share grew by a factor of 12.4x. But if the company only grew earnings by 12.4x, how did the stock grow 100x? The answer lies in the price to earnings (P/E) multiple expansion. Investors in MTY went from paying roughly 3.5x earnings when it was left for dead in 2003 to a more optimistic 26x earnings in 2013.","page":"33","tags":"valuation, price-vs-value, mr-market, compounding"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Our analysis of the 100x stocks suggests that their essence lies in the alchemy of give elements forming the acronym SQGLP:\n•\tS—Size is small\n•\tQ—Quality is high for both business and management\n•\tG—Growth in earnings is high\n•\tL—Longevity in both Q and G\n•\tP—Price is favorable for good returns.","page":"37","tags":"business-quality, proven-model, growth, valuation"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"It’s a good study. Some conclusions:\n•\tThere is no magic formula to find long-term multibaggers. \n•\tA low entry price relative to the company’s long-term profit potential is critical.\n•\tSmall is beautiful: 68 percent of multibaggers in the selected sample were trading below a $300 million market cap at their low.\n•\tGreat stocks often offer extensive periods during which to buy them.\n•\tPatience is critical.","page":"38","tags":"value-investing, price-vs-value, market-inefficiency, opportunity"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"If you buy a stock that returns about 20 percent annually for 25 years, you’ll get your 100-bagger. But if you sell in year 20, you’ll get ‘only’ about 40 to 1—before taxes. The last five years will more than double your overall return. So, you must wait.","page":"44","tags":"long-term, compounding, patience, temperament"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"If a company has a high ROE for four or five years in a row—and earned it not with leverage but from high profit margins—that’s a great place to start… But ROE alone does not suffice… The second piece requires some feel and judgement. It is the capital allocation skills of the management team.","page":"79","tags":"return-on-equity, capital-allocation, management, profitability"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"The ROE doesn’t have to be a straight line… If in an off year ROE is 10 percent, and in a good year it’s 30 percent, then that counts as a 20 percent average. I’m comfortable buying that kind of stock, and ideally, I’m buying in an off-year.","page":"79","tags":"return-on-equity, context, opportunity, business-quality"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"People with their own wealth at risk make better decisions as a group than those who are hired guns. The end result is that shareholders do better with these owner-operated firms.","page":"85","tags":"owner-operator, management, incentives, accountability"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"It’s [share buybacks] a potential clue. When you find a company that drives its shares outstanding lower over time and seems to have a knack for buying at good prices, you should take a deeper look. You may have found a candidate for a 100-bagger.","page":"119","tags":"share-buybacks, capital-allocation, management, shareholder-value"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Moats take various forms. Here are some:\n•\tYou have a strong brand\n•\tIt costs a lot to switch… When you look at the numbers, people tend to stay at their banks for six to seven years. The reason is it’s a pain in the neck to change banks.\n•\tYou enjoy network effects.\n•\tYou do something cheaper than everybody else.\n•\tYou are the biggest.","page":"122","tags":"moats, competitive-advantage, consumer-behavior, brand-value"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"High gross margins are the most important single factor of long run performance. The resilience of gross margins pegs companies to a level of performance. Scale and track record also stand out as useful indicators. That part about pegging means that if a company started with a high gross profit margin, it tended to keep it. Conversely, when it started off with a low gross profit margin, it tended to stay there as well.","page":"127","tags":"margins, business-quality, consistency, predictability"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"If you can’t see how or where a company adds value for customers in its business model, then you can be pretty sure that it won’t be a 100-bagger.","page":"128","tags":"business-quality, simplicity, customer-value"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Operating expenses are volatile. When an underperformer improves, this is often an area where you see the improvement. Put another way, if gross margins are sticky and persistent, then a good turnaround candidate would be one with a high gross profit margin and a low operating margin. The latter is easier to fix than the former.","page":"128","tags":"margins, distressed-investing, turnaround, hidden-value"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Sosnoff’s Law: the price of a stock varies inversely with the thickness of its research file. The fattest files are found in stocks that are the most troublesome and will decline the furthest. The thinnest files are reserved for those that appreciate the most. In other words, the best ideas are often the simplest.","page":"146","tags":"simplicity, contrarian, independent-thinking, opportunity"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"As Buffett notes: For years the traditional wisdom—long on tradition, short on wisdom—held that inflation protection was best provided by businesses laden with natural resources, plants and machinery, or other tangible assets. It doesn’t work that way. Asset-heavy businesses generally earn low rates of return—rates that often barely provide enough capital to fund the inflationary needs of the existing business, with nothing left over for real growth, for distribution to owners, or for acquisition of new businesses… In a world of monetary depreciation, the asset-light company wins… The ideal business during an inflationary time is one that can (a) raise prices easily and (b) doesn’t require investment in a lot of assets.","page":"152","tags":"capital-intensity, return-on-assets, intangible-assets, profitability"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Over a period of years, our thinking has focused more and more on the issue of reinvestment as the single most critical ingredient in a successful investment idea, once you have already identified an outstanding business.","page":"171","tags":"capital-allocation, reinvestment, compounding, business-quality"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"The most important principle is so important it’s worth repeating again: you need a business with a high return on capital with the ability to reinvest and earn that high return on capital for years and years.","page":"172","tags":"return-on-capital, reinvestment, compounding, long-term"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"You don’t want to pay stupid prices. Let’s say you pay 50 times earnings for a company that generated $1 in earnings last year. Think what you need to happen to make it a 100-bagger. You need earnings to go up a hundredfold and you need the price-earnings ratio to stay where it is at 50. If the price-earnings ratio falls to 25, then you need earnings to rise 200-fold.","page":"176","tags":"valuation, price-vs-value, compounding, conservative-assumptions"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"The PEG ratio is simply the (P/E Ratio) / (Annual EPS Growth Rate). If earnings grow 20%, for example, then a P/E of 20 is justified. Anything too far above 1x could be too expensive.","page":"179","tags":"valuation, pricing, growth"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"A 100-bagger requires a high return on capital for a long time. A moat, by definition, is what allows a company to get that return.","page":"179","tags":"moats, return-on-capital, long-term, competitive-advantage"},{"book":"100 Baggers","author":"Christopher Mayer","year":"2015","text":"Dividends are an expensive luxury for an investor seeking maximum growth… When you buy a cow to milk, don’t plan to race her against your neighbor’s horse.","page":"180","tags":"capital-allocation, reinvestment, growth, compounding"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Mohnish Pabrai] He had no MBA from a fancy school such as Warton or Columbia, no qualification as a certified financial analyst, no experience on Wall Street. But Pabrai, who regards his entire life as a game, expected his rigorous application of Buffett’s methodology to give him an edge over all of the fools who failed to follow the Sage of Omaha.","page":"9","tags":"proven-model, copycat-advantage, independent-thinking"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Mohnish Pabrai] There are no prizes for frenetic activity. Rather, investing is mostly a matter of waiting for these rare moments when the odds of making money vastly outweigh the odds of losing it.","page":"10","tags":"patience, opportunity, selectivity, temperament"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Mohnish Pabrai] First, says Pabrai, one of Buffett’s ‘core commandments’ is that you can invest in a company only if it falls within your circle of competence… Second, the company has to trade at a large enough discount to its underlying value to provide a significant margin of safety… Third, under Munger’s influence, Buffett gradually shifted away from stocks that were merely cheap toward an emphasis on buying better businesses… Fourth, the company’s financial statements should be clear and simple… If it isn’t easy to figure out how the business generates cash today and roughly how much it’s likely to generate in the years to come, Buffett relegates it to what he calls the ‘too hard’ pile.","page":"15","tags":"circle-of-competence, margin-of-safety, intrinsic-value"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Mohnish Pabrai] The key principles were not that difficult to identify and clone. Be patient and selective, saying no to almost everything. Exploit the market’s bipolar mood swings. Buy stocks at a big discount to their underlying value. Stay within your circle of competence. Avoid anything too hard. Make a small number of mispriced bets with minimal downside and significant upside.","page":"18","tags":"patience, contrarian, price-vs-value, circle-of-competence"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Mohnish Pabrai] As I considered Pabrai’s life and what I should learn from him, several principles particularly resonated with me.\n\nRule 1: Clone like crazy.\nRule 2: Hang out with people who are better than you.\nRule 3: Treat life as a game, not as a survival contest or a battle to the death.\nRule 4: Be in alignment with who you are; don’t do what you don’t want to do or what’s not right for you.\nRule 5: Live by an inner scorecard; don’t worry about what others think of you; don’t be defined by external validation.","page":"27","tags":"copycat-advantage, partner-selection, temperament"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Sir John Templeton] First of all, said Templeton, beware of emotion: ‘Most people get led astray by emotions in investing. They get led astray by being excessively careless and optimistic when they have big profits, and by getting excessively pessimistic and too cautious when they have big losses.","page":"44","tags":"temperament, human-nature, mr-market, contrarian"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Sir John Templeton] Second, said Templeton, beware of your own ignorance, which is ‘probably an even bigger problem than emotion… So many people buy something with the tiniest amount of information. They don’t really understand what it is that they’re buying.","page":"45","tags":"due-diligence, epistemology, humility"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Sir John Templeton] Third, said Templeton, you should diversify broadly to protect yourself from your own fallibility.","page":"45","tags":"diversification, humility, risk"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Sir John Templeton] Fourth, said Templeton, successful investing requires patience.","page":"46","tags":"patience, long-term"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Sir John Templeton] Fifth, said Templeton, the best way to find bargains is to study whichever assets have performed most dismally in the past five years, then to assess whether the cause of those woes is temporary or permanent.","page":"46","tags":"contrarian, opportunity, distressed-investing"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Howard Marks] In a world where nothing is stable or dependable and almost anything can happen, the first rule of the road is to be honest with ourselves about our limitation and vulnerabilities.","page":"59","tags":"humility, uncertainty, epistemology"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Howard Marks] Marks regards the efficient-market hypothesis as a ‘very powerful concept.’ Still, there’s a big enough difference between academic theory and real-world practice for him to have earned billions for himself and his clients.","page":"61","tags":"efficient-market-theory, market-inefficiency"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Howard Marks] Marks drew a simple but life-changing lesson from these academic debates: if he wanted to add value as an investor, he should avoid the most efficient markets and focus exclusively on less efficient ones.","page":"61","tags":"market-inefficiency, information-advantage, opportunity"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Howard Marks] Any asset, however ugly, can be worth buying if the price is low enough. Indeed, Marks believes that ‘buying cheap’ is the single most reliable route to investment riches—and that overpaying is the greatest risk. Thus, the essential question to ask about any potential investment should be ‘Is it cheap?’","page":"64","tags":"price-vs-value, valuation, downside-protection"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Howard Marks] For a rational skeptic, the point is not to be permanently pessimistic; it’s to question what ‘everyone’ believes to be true… ‘Skepticism calls for pessimism when optimism is excessive. But it is also calls for optimism when pessimism is excessive.’","page":"76","tags":"contrarian, independent-thinking, temperament, mr-market"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Howard Marks] Five critical ideas come up again and again:\n-\tThe importance of admitting that we can’t predict or control the future.\n-\tThe benefits of studying patterns of the past and using them as a rough guide to what could happen next.\n-\tThe inevitability that cycles will reverse and reckless excess will be punished.\n-\tThe possibility of turning cyclicality to our advantage by behaving countercyclically.\n-\tThe need for humility, skepticism, and prudence in order to achieve long-term financial success in an uncertain world.","page":"78","tags":"uncertainty, history, risk, humility"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Joel Greenblatt] Once you realize that your entire mission is to value businesses and pay much less for them than they’re worth, it’s incredibly liberating.","page":"122","tags":"value-investing, price-vs-value, simplicity"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Joel Greenblatt] Depending on the business, Greenblatt uses some combination of four standard valuation techniques. Method 1: he performs a discounted cash flow analysis, calculating the net present of the company’s estimated future earnings. Method 2: he assesses the company’s relative value, comparing it to the price of similar businesses. Method 3: he estimates the company’s acquisition value, figuring out what an informed buyer might pay for it. Method 4: he calculates the company’s liquidation value, analyzing what it would be worth if it closed and sold its assets.","page":"124","tags":"valuation, discounted-cash-flow, due-diligence"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Joel Greenblatt] The hitch is that you can never tell how long the process of convergence between price and value will take. Still, he says, ‘I’m a firm believer that, in 90 percent of the cases, the market will recognize that value within two to three years.’","page":"125","tags":"price-vs-value, patience, mr-market"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Tom Gayner] Resounding victories tend to be the result of small, incremental advances and improvements sustained over long stretches of time. ‘If you want the secret to great success, it’s just to make each day a little bit better than the day before,’ says Gayner. ‘There are different ways you can go about doing that, but that’s the story…. Just making progress over and over again is the critical part.","page":"172","tags":"compounding, long-term, consistency"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Charlie Munger] This, then, is the first mental trick we should learn from Munger as a safeguard against stupidity: imagine a dreadful outcome; work backward asking yourself what misguided actions might lead you to that sorry fate; and then scrupulously avoid that self-destructive behavior.","page":"203","tags":"mental-models, inversion, decision-making"},{"book":"Richer, Wiser, Happier","author":"William Green","year":"2021","text":"[Charlie Munger] When I ask if he has a mental process that helps him to defuse self-defeating emotions, he replies, ‘I know that anger is stupid. I know that resentment is stupid. I know self-pity is stupid. So I don’t do them…. I’m trying not to be stupid every day, all day.","page":"225","tags":"temperament, mental-models, human-nature"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Twenty years in this business convinces me that any normal person using the customary three percent of the brain can pick stocks just as well, if not better, than the average Wall Street expert.","page":"13","tags":"independent-thinking, circle-of-competence, contrarian"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"It’s impossible to be a credit-card-carrying American consumer without having done a lot of fundamental analysis on dozens of companies.","page":"14","tags":"circle-of-competence, due-diligence, consumer-behavior"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"The nice thing about investing in familiar companies such as L’eggs or Dunkin’ Donuts is that when you try on the stockings or sip the coffee, you’re already doing the kind of fundamental analysis that they pay Wall Street analysts to do. Visiting stores and testing products is one of the critical elements of the analyst’s job.","page":"23","tags":"due-diligence, information-advantage, circle-of-competence"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Investing in stocks is an art, not a science, and people who’ve been trained to rigidly quantify everything have a big disadvantage.","page":"32","tags":"epistemology, decision-making, independent-thinking"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Under the current system, a stock isn’t truly attractive until a number of large institutions have recognized its suitability and an equal number of respected Wall Street analysts have put it on the recommended list. With so many people waiting for others to make the first move, it’s amazing that anything gets bought.","page":"41","tags":"contrarian, market-inefficiency, independent-thinking"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"If seven out of ten of my stocks perform as expected, then I’m delighted. If six out of ten of my stocks perform as expected, then I’m thankful. Six out of ten is all it takes to produce an enviable record on Wall Street.","page":"62","tags":"portfolio-management, selectivity, temperament"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Before you buy a share of anything, there are three personal issues that ought to be addressed: (1) Do I own a house? (2) Do I need the money? And (3) Do I have the personal qualities that will bring me success in stocks?","page":"65","tags":"decision-making, risk-reward, standards"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"What Stock Market?\nThe market ought to be irrelevant. If I could convince you of this one thing, I’d feel this book had done its job. And if you don’t believe me, believe Warren Buffett. ‘As far as I’m concerned,’ Buffett has written, ‘the stock market doesn’t exist. It is there only as a reference to see if anybody is offering to do anything foolish.","page":"78","tags":"mr-market, independent-thinking, intrinsic-value"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Though people who buy stocks about which they are ignorant may get lucky and enjoy great rewards, it seems to me they are competing under unnecessary handicaps, just like the marathon runner who decides to stake his reputation on a bobsled race.","page":"88","tags":"circle-of-competence, due-diligence, risk"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Investing without research is like playing stud poker and never looking at the cards.","page":"96","tags":"due-diligence, risk, information-advantage"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Everything else being equal, you’ll do better with smaller companies… Once I’ve established the size of the company relative to other in a particular industry, next I place it into one of six general categories: slow growers, stalwarts, fast growers, cyclicals, asset plays, and turnarounds.","page":"99","tags":"business-quality, growth, case-study"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"The Slow Growers \nUsually these large and aging companies are expected to grow slightly faster than the gross national product… Another sure sign of a slow grower is that it pays a generous and regular dividend… companies pay generous dividends when they can’t dream up new ways to use the money to expand the business.","page":"100-101","tags":"business-quality, capital-allocation, growth"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"The Stalwarts\nStalwarts are companies such as Coca-Cola, Bristol-Myers, Procter and Gamble… These multibillion-dollar hulks are not exactly agile climbers, but they’re faster than slow growers… When you traffic in stalwarts, you’re more or less in the foothills: 10 to 12 percent annual growth in earnings.","page":"104","tags":"business-quality, growth, predictability"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"The Fast Growers\nThese are among my favorite investments: small, aggressive new enterprises that grow at 20 to 25 percent a year… A fast-growing company doesn’t necessarily have to belong to a fast-growing industry.","page":"108","tags":"growth, business-quality, opportunity"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"The Cyclicals\nA cyclical is a company whose sales and profits rise and fall in regular if not completely predictable fashion… Cyclicals are the most misunderstood of all the types of stocks. It is here that the unwary stock picker is most easily parted from his money, and in stocks that he considers safe.” \t        (p. 109, 112)","page":"","tags":"cyclicals, misunderstanding, risk"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"Turnarounds\nTurnarounds candidates have been battered, depressed, and often can barely drag themselves into Chapter 11. These aren’t slow growers; these are no growers.","page":"113","tags":"turnaround, distressed-investing, case-study"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"The Asset Plays\nAn asset play is any company that’s sitting on something valuable that you know about, but that the Wall Street crowd has overlooked.","page":"115","tags":"hidden-value, market-inefficiency, special-situations"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"If it’s a choice between owning a stock in a fine company with excellent management in a highly competitive and complex industry, or a humdrum company with mediocre management in a simpleminded industry with no competition, I’d take the latter.","page":"121","tags":"simplicity, competition, business-quality"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"You never find the perfect company, but if you can imagine it, then you’ll know how to recognize favorable attributes, the most important thirteen of which are as follows:\n\n1 – It Sounds Dull—or, Even Better, Ridiculous\n-\tIf you discover an opportunity early enough, you probably will get a few dollars off the price just for the dull or odd name.\n\n2 – It Does Something Dull\n-\tA company that does boring things is almost as good as a company that has a boring name, and both together is terrific… If a company with terrific earnings and a strong balance sheet also does dull things, it gives you a lot of time to purchase the stock at a discount.\n\n3 – It Does Something Disagreeable \n\n4 – It’s a Spinoff\n-\tLarge parent companies do not want to spin off divisions and then see those spinoffs get into trouble, because that would bring embarrassing publicity that would reflect back on the parents. Therefore, the spinoffs normally have strong balance sheets and are well-prepared to succeed as independent entities. \n\n5 – The Institutions Don’t Own It, and the Analysts Don’t Follow It\n\n6 – The Rumors Abound: It’s Involved with Toxic Waste and/or the Mafia\n\n7 – There’s Something Depressing about It\n\n8 – It’s a No-Growth Industry\n-\tFor every single product in a hot industry, there are a thousand MIT graduates trying to figure out how to make it cheaper in Taiwan… In a no-growth industry, especially one that’s boring and upsets people there’s no problem with competition.\n\n9 – It’s Got a Niche\n\n10 – People Have to Keep Buying It\n\n11 – It’s a User of Technology\n-\tInstead of investing in a company that makes automatic scanners, why not invest in the supermarkets that install the scanners?\n\n12 – The Insiders Are Buyers\n\n13 – The Company Is Buying Back Shares","page":"122-136","tags":"business-quality, contrarian, checklist"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"If a company must acquire something, I’d prefer it to be a related business, but acquisitions in general make me nervous. There’s a strong tendency for companies that are flush with cash and feeling powerful to overpay for acquisitions, expect too much from them, and then mismanage them.","page":"150","tags":"capital-allocation, acquisitions, management"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"If the loss of one customer would be catastrophic to a supplier, I’d be wary of investing in the supplier… Short of cancellation, the big customer has incredible leverage in extracting price cuts and other concessions that will reduce the supplier’s profits.","page":"153","tags":"risk, customer-concentration, competitive-advantage"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"The p/e ratio can be thought of as the number of years it will take the company to earn back the amount of your initial investment—assuming, of course, that the company’s earnings stay constant.","page":"164","tags":"valuation, earnings-yield, price-vs-value"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"There are five basic ways a company can increase earnings: reduce costs; raise prices; expand into new markets; sell more of its product in the old markets; or revitalize, close, or otherwise dispose of a losing operation. These are the factors to investigate as you develop the story. If you have an edge, this is where it’s going to be most helpful.","page":"169","tags":"profitability, growth, business-quality"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"When I’m interested in a company because of a particular product the first thing I want to know is what that product means to the company in question. What percent of sales does it represent?","page":"198","tags":"due-diligence, product-analysis, revenue-concentration"},{"book":"One Up on Wall Street","author":"Peter Lynch","year":"1989","text":"The p/e ratio of any company that’s fairly priced will equal its growth rate… But if the p/e ratio is less than the growth rate, you may have found yourself a bargain. A company, say, with a growth rate of 12 percent a year and a p/e ratio of 6 is a very attractive prospect… In general, a p/e ratio that’s half the growth rate is very positive, and one that’s twice the growth rate is very negative. We use this measure all the time in analyzing stocks for the mutual funds.","page":"199",
