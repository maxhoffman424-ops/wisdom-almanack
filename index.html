<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wisdom Almanack</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --navy-dark: #1B3A57;
    --navy: #2C5282;
    --navy-light: #4A90E2;
    --grey-bg: #F5F7FA;
    --grey-light: #E8ECF1;
    --grey-mid: #CBD5E0;
    --grey-dark: #6B7280;
    --white: #FFFFFF;
    --text: #1F2937;
    --gold: #F59E0B;
}

body { 
    font-family: 'IBM Plex Sans', -apple-system, sans-serif; 
    background: var(--grey-bg); 
    color: var(--text); 
    line-height: 1.65; 
}

.app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

.sidebar { 
    background: var(--navy-dark); 
    color: white; 
    padding: 2.5rem 0;
    box-shadow: 2px 0 12px rgba(0,0,0,0.15);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
}

.logo { 
    padding: 0 2rem; 
    font-size: 1.75rem; 
    font-weight: 700; 
    margin-bottom: 0.25rem; 
    font-family: 'IBM Plex Serif', serif;
}

.tagline { 
    padding: 0 2rem; 
    font-size: 0.7rem; 
    opacity: 0.7; 
    text-transform: uppercase; 
    letter-spacing: 0.15em; 
    margin-bottom: 3rem; 
}

.nav-section { margin-bottom: 2rem; }
.nav-label { 
    padding: 0 2rem; 
    font-size: 0.65rem; 
    font-weight: 600; 
    text-transform: uppercase; 
    letter-spacing: 0.12em; 
    opacity: 0.6; 
    margin-bottom: 0.75rem; 
}

.nav-item { 
    padding: 0.8rem 2rem; 
    cursor: pointer; 
    border-left: 3px solid transparent; 
    opacity: 0.8;
    transition: all 0.2s;
    font-size: 0.95rem;
}

.nav-item:hover { opacity: 1; background: rgba(255,255,255,0.1); }
.nav-item.active { 
    opacity: 1; 
    background: rgba(255,255,255,0.12); 
    border-left-color: var(--navy-light); 
    font-weight: 500; 
}

.main { 
    max-width: 1400px; 
    width: 100%;
    margin: 0 auto; 
    padding: 4rem 4rem 4rem 5rem;
}

.page-title { 
    font-family: 'IBM Plex Serif', serif;
    font-size: 3.5rem; 
    font-weight: 700; 
    margin-bottom: 0.5rem; 
    color: var(--navy-dark); 
    letter-spacing: -0.02em;
}

.page-subtitle { 
    font-size: 1.1rem; 
    color: var(--grey-dark); 
    margin-bottom: 3rem; 
    font-weight: 400;
}

.quote-card { 
    background: var(--white); 
    padding: 2.5rem 3rem; 
    margin-bottom: 2rem; 
    border-left: 5px solid var(--navy); 
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: all 0.25s;
    position: relative;
    border-radius: 2px;
}

.quote-card:hover { 
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); 
    transform: translateY(-3px); 
}

.favorite-star {
    position: absolute;
    top: 1.5rem;
    right: 2rem;
    font-size: 1.5rem;
    cursor: pointer;
    opacity: 0.3;
    transition: all 0.2s;
}

.favorite-star:hover { opacity: 1; transform: scale(1.2); }
.favorite-star.active { opacity: 1; color: var(--gold); }

.quote-text { 
    font-family: 'IBM Plex Serif', serif;
    font-size: 1.45rem; 
    line-height: 1.85; 
    margin-bottom: 2rem; 
    color: var(--text);
}

.quote-meta { 
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 1.5rem; 
    border-top: 1px solid var(--grey-light); 
    font-size: 1rem; 
    color: var(--grey-dark); 
}

.book-title { 
    font-weight: 600; 
    color: var(--navy-dark); 
    cursor: pointer;
    font-family: 'IBM Plex Serif', serif;
}

.book-title:hover { text-decoration: underline; }
.page-ref { margin-left: 1rem; color: var(--grey-mid); font-size: 0.9rem; }

.tags { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.25rem; }
.tag { 
    font-size: 0.8rem; 
    padding: 0.4rem 1rem; 
    background: var(--grey-light); 
    color: var(--navy-dark); 
    border-radius: 3px;
    cursor: pointer; 
    transition: all 0.2s;
    font-weight: 500;
}

.tag:hover { background: var(--navy); color: white; transform: translateY(-1px); }

.btn-primary { 
    padding: 1rem 2.5rem; 
    background: var(--navy); 
    color: white; 
    border: none; 
    border-radius: 4px;
    cursor: pointer; 
    font-size: 1rem; 
    font-weight: 600; 
    font-family: 'IBM Plex Sans', sans-serif;
    transition: all 0.2s;
    margin-right: 1rem;
}

.btn-primary:hover { background: var(--navy-dark); transform: translateY(-1px); }

.btn-secondary {
    padding: 1rem 2.5rem; 
    background: white; 
    color: var(--navy); 
    border: 2px solid var(--navy); 
    border-radius: 4px;
    cursor: pointer; 
    font-size: 1rem; 
    font-weight: 600; 
    font-family: 'IBM Plex Sans', sans-serif;
    transition: all 0.2s;
    margin-right: 1rem;
}

.btn-secondary:hover { background: var(--grey-bg); }

.search-section { 
    background: var(--white); 
    padding: 2rem; 
    margin-bottom: 3rem; 
    border-radius: 4px;
}

.search-box { 
    width: 100%; 
    padding: 1rem; 
    border: 2px solid var(--grey-light); 
    border-radius: 4px;
    font-size: 1.05rem; 
    margin-bottom: 1.25rem; 
}

.filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
.filter-select { 
    padding: 1rem; 
    border: 2px solid var(--grey-light); 
    border-radius: 4px;
    font-size: 0.95rem;
}

.form-section { 
    background: var(--white); 
    padding: 2.5rem; 
    margin-bottom: 2.5rem; 
    border-radius: 4px;
}

.form-section h3 { 
    font-size: 1.5rem; 
    margin-bottom: 2rem; 
    color: var(--navy-dark); 
    padding-bottom: 1rem;
    border-bottom: 2px solid var(--grey-light);
}

.form-group { margin-bottom: 1.75rem; }
label { 
    display: block; 
    font-size: 0.75rem; 
    font-weight: 600; 
    margin-bottom: 0.6rem; 
    color: var(--navy-dark); 
    text-transform: uppercase;
}

input, textarea, select { 
    width: 100%; 
    padding: 0.95rem; 
    border: 2px solid var(--grey-light); 
    border-radius: 4px;
    font-size: 1rem; 
    font-family: 'IBM Plex Sans', sans-serif;
}

textarea { min-height: 140px; resize: vertical; }

.hidden { display: none; }

.success { 
    background: #10B981; 
    color: white; 
    padding: 1.25rem; 
    border-radius: 4px;
    margin-bottom: 2rem; 
}

.new-book-toggle {
    color: var(--navy-light);
    cursor: pointer;
    font-size: 0.9rem;
    margin-top: 0.5rem;
    display: inline-block;
}
.new-book-toggle:hover { text-decoration: underline; }
#newBookFields { display: none; margin-top: 1.5rem; padding: 1.5rem; background: var(--grey-bg); border-radius: 4px; }

/* ── Bulk entry ── */
.quote-row {
    background: var(--white);
    border: 2px solid var(--grey-light);
    border-radius: 6px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    position: relative;
    transition: border-color 0.2s;
}
.quote-row:focus-within { border-color: var(--navy-light); }
.quote-row-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
}
.quote-row-num {
    background: var(--navy);
    color: white;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 600;
    flex-shrink: 0;
}
.quote-row-fields { display: grid; grid-template-columns: 1fr 140px; gap: 1rem; margin-bottom: 1rem; }
.quote-row textarea {
    width: 100%; min-height: 100px; resize: vertical;
    border: 2px solid var(--grey-light); border-radius: 4px;
    padding: 0.75rem; font-size: 0.95rem;
    font-family: 'IBM Plex Serif', serif; line-height: 1.6;
}
.quote-row textarea:focus { outline: none; border-color: var(--navy-light); }
.quote-row input[type=text] {
    padding: 0.75rem; border: 2px solid var(--grey-light);
    border-radius: 4px; font-size: 0.95rem; width: 100%;
}
.quote-row input[type=text]:focus { outline: none; border-color: var(--navy-light); }
.remove-row-btn {
    position: absolute; top: 1rem; right: 1rem;
    background: none; border: none; cursor: pointer;
    color: var(--grey-mid); font-size: 1.2rem; line-height: 1;
    transition: color 0.2s;
}
.remove-row-btn:hover { color: #e53e3e; }

/* ── Tag combobox ── */
.tag-combobox { position: relative; }
.tag-combobox-input-wrap {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem;
    border: 2px solid var(--grey-light); border-radius: 4px;
    padding: 0.45rem 0.6rem; background: var(--white);
    cursor: text; transition: border-color 0.2s;
    min-height: 42px;
}
.tag-combobox-input-wrap:focus-within { border-color: var(--navy-light); }
.tag-chip {
    display: flex; align-items: center; gap: 0.3rem;
    background: var(--navy); color: white;
    padding: 0.2rem 0.55rem; border-radius: 3px; font-size: 0.78rem;
    white-space: nowrap;
}
.tag-chip button {
    background: none; border: none; color: rgba(255,255,255,0.65);
    cursor: pointer; font-size: 0.9rem; line-height: 1; padding: 0;
}
.tag-chip button:hover { color: white; }
.tag-combobox-text {
    border: none; outline: none; font-size: 0.88rem;
    font-family: inherit; background: transparent;
    min-width: 120px; flex: 1; padding: 0.15rem 0;
}
.tag-dropdown {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--white); border: 2px solid var(--grey-light);
    border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    z-index: 100; max-height: 220px; overflow-y: auto;
}
.tag-dropdown.open { display: block; }
.tag-drop-item {
    padding: 0.55rem 0.85rem; font-size: 0.88rem; cursor: pointer;
    transition: background 0.12s; color: var(--text);
}
.tag-drop-item:hover, .tag-drop-item.active { background: var(--grey-bg); }
.tag-drop-item.create-new { color: var(--navy-light); font-style: italic; }
.tag-drop-item.create-new:hover { background: rgba(74,144,226,0.08); }
.tag-drop-empty { padding: 0.55rem 0.85rem; font-size: 0.85rem; color: var(--grey-dark); }

.add-row-btn {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.9rem 1.5rem;
    border: 2px dashed var(--grey-mid);
    border-radius: 6px; cursor: pointer;
    color: var(--grey-dark); font-size: 0.95rem;
    background: transparent; width: 100%;
    transition: all 0.2s; margin-bottom: 1.5rem;
    font-family: inherit;
}
.add-row-btn:hover { border-color: var(--navy); color: var(--navy); background: rgba(44,82,130,0.04); }

.bulk-save-bar {
    background: var(--white);
    border: 2px solid var(--grey-light);
    border-radius: 6px;
    padding: 1.5rem;
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.quote-count-badge {
    background: var(--grey-bg); border-radius: 4px;
    padding: 0.4rem 0.8rem; font-size: 0.85rem; color: var(--grey-dark);
}

/* ── Investment Journal ── */
.journal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2.5rem;
}
.stock-card {
    background: var(--white);
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-top: 4px solid var(--navy);
    padding: 1.75rem;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
}
.stock-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.12); transform: translateY(-2px); }
.stock-card.verdict-buy { border-top-color: #10B981; }
.stock-card.verdict-watch { border-top-color: var(--gold); }
.stock-card.verdict-pass { border-top-color: #6B7280; }
.stock-card.verdict-sell { border-top-color: #EF4444; }
.stock-ticker {
    font-family: 'IBM Plex Serif', serif;
    font-size: 1.6rem; font-weight: 700;
    color: var(--navy-dark); margin-bottom: 0.15rem;
}
.stock-name { font-size: 0.85rem; color: var(--grey-dark); margin-bottom: 1rem; }
.verdict-badge {
    display: inline-block; padding: 0.3rem 0.85rem;
    border-radius: 3px; font-size: 0.75rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 1rem;
}
.verdict-badge.buy { background: #D1FAE5; color: #065F46; }
.verdict-badge.watch { background: #FEF3C7; color: #92400E; }
.verdict-badge.pass { background: #F3F4F6; color: #374151; }
.verdict-badge.sell { background: #FEE2E2; color: #991B1B; }
.stock-irr {
    font-size: 0.82rem; color: var(--grey-dark);
    margin-bottom: 0.75rem;
}
.stock-irr strong { color: var(--navy-dark); }
.stock-summary {
    font-size: 0.9rem; line-height: 1.6; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
    margin-bottom: 1rem;
}
.stock-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.stock-tag {
    font-size: 0.75rem; padding: 0.25rem 0.65rem;
    background: var(--grey-light); color: var(--navy-dark);
    border-radius: 3px; font-weight: 500;
}
.stock-footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 1rem; margin-top: 1rem;
    border-top: 1px solid var(--grey-light);
    font-size: 0.78rem; color: var(--grey-mid);
}
.stock-log-count { font-size: 0.78rem; color: var(--grey-dark); }

/* Detail view */
.journal-detail-header {
    display: flex; align-items: flex-start; gap: 2rem;
    margin-bottom: 2rem; flex-wrap: wrap;
}
.journal-detail-meta { flex: 1; }
.journal-section {
    background: var(--white); border-radius: 6px;
    padding: 2rem; margin-bottom: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.journal-section h3 {
    font-size: 1rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--navy-dark);
    margin-bottom: 1.25rem; padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--grey-light);
}
.case-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
.case-box {
    padding: 1rem; border-radius: 4px; font-size: 0.88rem; line-height: 1.6;
}
.case-box.bull { background: #F0FDF4; border-left: 3px solid #10B981; }
.case-box.base { background: #EFF6FF; border-left: 3px solid var(--navy-light); }
.case-box.bear { background: #FFF7ED; border-left: 3px solid #F59E0B; }
.case-box h4 { font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 0.5rem; }
.case-box.bull h4 { color: #065F46; }
.case-box.base h4 { color: var(--navy); }
.case-box.bear h4 { color: #92400E; }

.log-entry {
    padding: 1.25rem 1.5rem; border-left: 3px solid var(--grey-mid);
    margin-bottom: 1rem; background: var(--grey-bg); border-radius: 0 4px 4px 0;
    font-size: 0.92rem; line-height: 1.65;
}
.log-entry-date {
    font-size: 0.75rem; font-weight: 600; color: var(--grey-dark);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem;
}
.log-entry-text { white-space: pre-wrap; }
.log-entry-actions {
    margin-top: 0.75rem; display: flex; gap: 0.5rem;
}
.log-entry-actions button {
    font-size: 0.75rem; padding: 0.25rem 0.65rem;
    border-radius: 3px; cursor: pointer; font-family: inherit;
}
.btn-edit-log { background: white; border: 1px solid var(--grey-mid); color: var(--grey-dark); }
.btn-del-log { background: white; border: 1px solid #EF4444; color: #EF4444; }
.btn-del-log:hover { background: #FEE2E2; }

.irr-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; }
.irr-cell {
    text-align: center; padding: 1rem; background: var(--grey-bg); border-radius: 4px;
}
.irr-cell .irr-val { font-size: 1.5rem; font-weight: 700; color: var(--navy-dark); }
.irr-cell .irr-label { font-size: 0.75rem; color: var(--grey-dark); margin-top: 0.25rem; }

.journal-toolbar {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    margin-bottom: 2rem;
}
.journal-search {
    flex: 1; min-width: 200px; padding: 0.75rem 1rem;
    border: 2px solid var(--grey-light); border-radius: 4px; font-size: 0.95rem;
}
.verdict-filter {
    padding: 0.75rem 1rem; border: 2px solid var(--grey-light);
    border-radius: 4px; font-size: 0.9rem;
}
.new-stock-btn {
    padding: 0.75rem 1.75rem; background: var(--navy);
    color: white; border: none; border-radius: 4px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    font-family: inherit; white-space: nowrap; transition: all 0.2s;
}
.new-stock-btn:hover { background: var(--navy-dark); }

/* AI Research Context Panel */
.ai-context-panel {
    background: var(--white);
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    margin-bottom: 1.5rem;
    overflow: hidden;
    border-left: 4px solid var(--navy-light);
}
.ai-context-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1rem 2rem; cursor: pointer;
    background: linear-gradient(135deg, #EFF6FF 0%, var(--white) 100%);
    border-bottom: 1px solid var(--grey-light);
    user-select: none;
}
.ai-context-header:hover { background: #E8F0FE; }
.ai-context-title {
    font-size: 0.95rem; font-weight: 700; color: var(--navy-dark);
    text-transform: uppercase; letter-spacing: 0.07em;
    display: flex; align-items: center; gap: 0.6rem;
}
.ai-context-chevron { font-size: 0.8rem; color: var(--grey-dark); transition: transform 0.2s; }
.ai-context-chevron.open { transform: rotate(180deg); }
.ai-context-body { padding: 1.75rem 2rem; display: none; }
.ai-context-body.open { display: block; }
.ai-insight-block {
    padding: 1rem 1.25rem;
    background: var(--grey-bg);
    border-radius: 4px;
    font-size: 0.9rem; line-height: 1.75;
    margin-bottom: 0.75rem;
    white-space: pre-wrap;
}
.ai-insight-block:last-child { margin-bottom: 0; }
.ai-insight-label {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--navy); margin-bottom: 0.4rem;
}
.ai-loading {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 1.25rem 2rem; color: var(--grey-dark); font-size: 0.9rem;
}
.ai-loading-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--navy-light);
    animation: ai-pulse 1.2s ease-in-out infinite;
}
.ai-loading-dot:nth-child(2) { animation-delay: 0.2s; }
.ai-loading-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes ai-pulse { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }
.ai-refresh-btn {
    font-size: 0.78rem; padding: 0.25rem 0.75rem;
    background: white; border: 1px solid var(--grey-mid);
    border-radius: 3px; cursor: pointer; color: var(--grey-dark);
    font-family: inherit; transition: all 0.15s;
}
.ai-refresh-btn:hover { border-color: var(--navy-light); color: var(--navy); }

/* Live metrics bar */
.metrics-bar {
    display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center;
    background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8e 100%);
    border-radius: 8px; padding: 1.1rem 1.75rem; margin-bottom: 1.5rem;
    color: white;
}
.metric-item { display: flex; flex-direction: column; gap: 0.15rem; }
.metric-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.7; font-weight: 600; }
.metric-value { font-size: 1.1rem; font-weight: 700; font-family: 'IBM Plex Serif', serif; }
.metric-value.positive { color: #6ee7b7; }
.metric-value.negative { color: #fca5a5; }
.metric-divider { width: 1px; height: 2.5rem; background: rgba(255,255,255,0.2); flex-shrink: 0; }
.metric-52w-bar { display: flex; flex-direction: column; gap: 0.4rem; min-width: 160px; }
.metric-52w-track { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; }
.metric-52w-fill { position: absolute; left: 0; top: 0; height: 100%; background: #6ee7b7; border-radius: 2px; }
.metric-52w-dot { position: absolute; top: -4px; width: 12px; height: 12px; background: white; border-radius: 50%; transform: translateX(-6px); }
.metric-52w-labels { display: flex; justify-content: space-between; font-size: 0.65rem; opacity: 0.65; }
.metrics-loading { font-size: 0.82rem; opacity: 0.7; display: flex; align-items: center; gap: 0.5rem; }

/* EBIT/Sales stability badge */

.ebit-unknown { background: var(--grey-light); color: var(--grey-dark); }

/* AI scorecard */

":"2018","quotes":[]},{"title":"How to Win Friends and Influence People","author":"Dale Carnegie","year":"1936","quotes":[]},{"title":"Why Nations Fail","author":"Daron Acemoglu and James Robinson","year":"2012","quotes":[]},{"title":"We Who Wrestle with God","author":"Jordan Peterson","year":"2024","quotes":[]},{"title":"Trust the Plan","author":"Greg Spira","year":"2023","quotes":[]},{"title":"Future Ready","author":"Steve Morlidge & Steve Player","year":"2012","quotes":[]},{"title":"The Advantage","author":"Patrick Lencioni","year":"2012","quotes":[]},{"title":"The 5 Types of Wealth","author":"Sahil Bloom","year":"2025","quotes":[]},{"title":"Poor Charlie’s Almanack","author":"Charlie Munger","year":"2023","quotes":[]}]</script>

<script>
// ─── Global bundled journal data (accessible across functions) ───────────────
let bundled2 = [];
let bundledQuotes = [];

// ─── Storage shim (no-op when not running inside Claude artifact env) ───────
if (!window.storage || typeof window.storage.get !== 'function') {
    window.storage = {
        get: async () => null,
        set: async () => null,
        delete: async () => null,
        list: async () => ({ keys: [] })
    };
}

// ─── State ───────────────────────────────────────────────
const baseBooks = JSON.parse(document.getElementById('data').textContent);
let customQuotes = [];
let favorites = [];
let allQuotes = [];
let allBooks = [];
let storageReady = false;

// ─── Storage helpers ──────────────────────────────────────
async function loadStorage() {
    try { const r = await window.storage.get('customQuotes'); if (r) customQuotes = JSON.parse(r.value); } catch(e) {}
    try { const r = await window.storage.get('favorites');    if (r) favorites    = JSON.parse(r.value); } catch(e) {}
    // Fallback: when storage unavailable (GitHub Pages), seed quotes from bundled data
    if (!customQuotes.length && typeof bundledQuotes !== 'undefined' && bundledQuotes.length) customQuotes = [...bundledQuotes];
    rebuildData();
    storageReady = true;
}

async function saveFavorites() {
    try { await window.storage.set('favorites', JSON.stringify(favorites)); } catch(e) {}
}

async function saveCustomQuotes() {
    try { await window.storage.set('customQuotes', JSON.stringify(customQuotes)); } catch(e) {}
}

function rebuildData() {
    allBooks = JSON.parse(JSON.stringify(baseBooks));
    // Merge custom quotes into books or create new entries
    customQuotes.forEach(cq => {
        let book = allBooks.find(b => b.title === cq.book);
        if (!book) {
            book = { title: cq.book, author: cq.author, year: cq.year || '', quotes: [] };
            allBooks.push(book);
        }
        book.quotes.push({ text: cq.text, page: cq.page || '', tags: cq.tags || '' });
    });
    // Sort each book's quotes by page number
    allBooks.forEach(book => {
        book.quotes.sort((a, b) => {
            const pa = parseInt(a.page) || Infinity;
            const pb = parseInt(b.page) || Infinity;
            return pa - pb;
        });
    });
    allQuotes = [];
    allBooks.forEach(book => {
        book.quotes.forEach(q => {
            allQuotes.push({ text: q.text, book: book.title, author: book.author, page: q.page || '', tags: q.tags || '' });
        });
    });
}

// ─── Nav ──────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
        showView(item.dataset.view);
    });
});

function showView(view) {
    const views = { daily: renderDaily, browse: renderBrowse, favorites: renderFavorites, add: renderAdd, export: renderExport, journal: renderJournal, frameworks: renderFrameworks };
    if (views[view]) views[view]();
}

// ─── Daily ────────────────────────────────────────────────
function renderDaily() {
    const today = new Date().toDateString();
    const seed = today.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
    const quote = allQuotes[seed % allQuotes.length];
    document.getElementById('content').innerHTML = `
        <h1 class="page-title">Daily Wisdom</h1>
        <p class="page-subtitle">${new Date().toLocaleDateString('en-US', {weekday:'long',month:'long',day:'numeric',year:'numeric'})}</p>
        ${renderQuoteCard(quote, allQuotes.indexOf(quote))}
        <button class="btn-primary" onclick="randomQuote()">🎲 Get Another Quote</button>
    `;
}

function randomQuote() {
    const quote = allQuotes[Math.floor(Math.random() * allQuotes.length)];
    const idx = allQuotes.indexOf(quote);
    const card = document.querySelector('.quote-card');
    if (card) card.outerHTML = renderQuoteCard(quote, idx);
}

// ─── Quote card renderer ──────────────────────────────────
function formatQuoteText(text) {
    // Detect bullet/numbered lines: lines starting with •·–-*  or  1. 2. etc.
    const BULLET = /^(\s*(?:[•·\-\*–—]|\d+[\.\)])\s+)/;
    const lines = text.split('\n');
    if (lines.length < 2 || !lines.some(l => BULLET.test(l))) {
        // No list content — just preserve intentional line breaks
        return lines.map(l => l.trim()).filter(Boolean).join('<br>');
    }
    // Mixed content: intro line(s) + bullet lines
    let html = '';
    let inList = false;
    for (const raw of lines) {
        const line = raw.trim();
        if (!line) continue;
        if (BULLET.test(line)) {
            if (!inList) { html += '<ul style="margin:0.5rem 0 0 1.25rem;padding:0;list-style:disc">'; inList = true; }
            html += '<li style="margin-bottom:0.3rem">' + line.replace(BULLET, '') + '</li>';
        } else {
            if (inList) { html += '</ul>'; inList = false; }
            html += (html ? '<br>' : '') + line;
        }
    }
    if (inList) html += '</ul>';
    return html;
}

function renderQuoteCard(q, index) {
    if (!q) return '';
    const isFav = favorites.includes(index);
    const tags = q.tags ? q.tags.split(',').map(t =>
        `<span class="tag" onclick="filterByTag('${t.trim().replace(/'/g,"\\'")}')">
            ${t.trim()}</span>`
    ).join('') : '';
    const bookEsc = q.book.replace(/'/g,"\\'");
    return `
        <div class="quote-card">
            <div class="favorite-star ${isFav?'active':''}" onclick="toggleFav(${index})" title="${isFav?'Remove from favorites':'Add to favorites'}">★</div>
            <div class="quote-text">${formatQuoteText(q.text)}</div>
            <div class="quote-meta">
                <div>
                    <span class="book-title" onclick="filterByBook('${bookEsc}')">${q.book}</span>
                    <span> — ${q.author}</span>
                    ${q.page ? `<span class="page-ref">p. ${q.page}</span>` : ''}
                </div>
            </div>
            ${tags ? `<div class="tags">${tags}</div>` : ''}
        </div>`;
}

// ─── Toggle favorite ──────────────────────────────────────
async function toggleFav(index) {
    if (favorites.includes(index)) {
        favorites = favorites.filter(i => i !== index);
    } else {
        favorites.push(index);
    }
    await saveFavorites();
    const activeView = document.querySelector('.nav-item.active')?.dataset.view || 'daily';
    showView(activeView);
    showSuccess(favorites.includes(index) ? 'Added to favorites!' : 'Removed from favorites');
}

// ─── Browse ───────────────────────────────────────────────
function renderBrowse() {
    const tagCounts = {};
    allQuotes.forEach(q => { if(q.tags) q.tags.split(',').map(t=>t.trim()).filter(Boolean).forEach(t => { tagCounts[t]=(tagCounts[t]||0)+1; }); });
    const allTags = Object.keys(tagCounts).sort();
    const bookOptions = [...allBooks].sort((a,b) => a.title.localeCompare(b.title)).map(b => `<option value="${b.title}">${b.title} (${b.quotes.length})</option>`).join('');
    const tagOptions = allTags.map(t => `<option value="${t}">${t} (${tagCounts[t]})</option>`).join('');
    document.getElementById('content').innerHTML = `
        <h1 class="page-title">Browse Collection</h1>
        <p class="page-subtitle">${allQuotes.length} quotes from ${allBooks.length} books</p>
        <div class="search-section">
            <input type="text" class="search-box" id="search" placeholder="Search quotes, books, authors..." oninput="filterQuotes()">
            <div class="filter-row">
                <select class="filter-select" id="bookFilter" onchange="filterQuotes()">
                    <option value="">All Books</option>${bookOptions}
                </select>
                <select class="filter-select" id="tagFilter" onchange="filterQuotes()">
                    <option value="">All Tags</option>${tagOptions}
                </select>
            </div>
        </div>
        <div id="results"></div>
    `;
    filterQuotes();
}

function filterQuotes() {
    const search = (document.getElementById('search')?.value || '').toLowerCase();
    const book = document.getElementById('bookFilter')?.value || '';
    const tag = document.getElementById('tagFilter')?.value || '';
    const filtered = allQuotes.filter(q => {
        const matchSearch = !search || q.text.toLowerCase().includes(search) || q.book.toLowerCase().includes(search) || q.author.toLowerCase().includes(search);
        const matchBook = !book || q.book === book;
        const matchTag = !tag || (q.tags && q.tags.split(',').map(t=>t.trim()).includes(tag));
        return matchSearch && matchBook && matchTag;
    });
    const resultsEl = document.getElementById('results');
    if (!resultsEl) return;
    if (filtered.length === 0) {
        resultsEl.innerHTML = '<p style="text-align:center;padding:3rem;color:var(--grey-dark);">No quotes found</p>';
        return;
    }
    resultsEl.innerHTML = filtered.slice(0, 100).map(q => renderQuoteCard(q, allQuotes.indexOf(q))).join('');
}

function filterByBook(book) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector('[data-view="browse"]').classList.add('active');
    renderBookEdit(book);
}

function renderBookEdit(bookTitle) {
    const book = allBooks.find(b => b.title === bookTitle);
    if (!book) return;
    const quotes = book.quotes;
    const ct = document.getElementById('content');
    ct.innerHTML = '';

    const h1 = document.createElement('h1');
    h1.className = 'page-title'; h1.textContent = bookTitle;
    const meta = document.createElement('p');
    meta.className = 'page-subtitle';
    meta.style.cssText = 'display:flex;align-items:center;gap:1.5rem';
    const span = document.createElement('span');
    span.textContent = book.author + (book.year ? ' · ' + book.year : '') + ' · ' + quotes.length + ' quote' + (quotes.length !== 1 ? 's' : '');
    const back = document.createElement('button');
    back.textContent = '← Back to Browse';
    back.style.cssText = 'background:none;border:none;color:var(--navy-light);font-size:0.9rem;cursor:pointer;padding:0;font-family:inherit';
    back.onclick = () => renderBrowse();
    meta.append(span, back);
    const container = document.createElement('div');
    ct.append(h1, meta, container);

    if (!quotes.length) {
        container.innerHTML = '<p style="color:var(--grey-dark);padding:2rem 0">No quotes yet for this book.</p>';
        return;
    }

    quotes.forEach((q, i) => {
        const row = document.createElement('div');
        row.id = 'eq-' + i;
        row.style.cssText = 'background:white;border:2px solid var(--grey-light);border-radius:6px;padding:1.25rem;margin-bottom:0.75rem;display:grid;grid-template-columns:1fr 90px auto;gap:0.75rem;align-items:start';

        const ta = document.createElement('textarea');
        ta.id = 'eqt-' + i; ta.value = q.text;
        ta.style.cssText = 'width:100%;border:2px solid var(--grey-light);border-radius:4px;padding:0.65rem;font-size:0.95rem;line-height:1.6;resize:vertical;min-height:72px;font-family:IBM Plex Serif,serif';

        const pageWrap = document.createElement('div');
        const lbl = document.createElement('label');
        lbl.textContent = 'Page';
        lbl.style.cssText = 'font-size:0.7rem;font-weight:600;text-transform:uppercase;color:var(--navy-dark);display:block;margin-bottom:0.35rem';
        const pg = document.createElement('input');
        pg.type = 'text'; pg.id = 'eqp-' + i; pg.value = q.page || '';
        pg.style.cssText = 'width:100%;border:2px solid var(--grey-light);border-radius:4px;padding:0.65rem';
        pageWrap.append(lbl, pg);

        const btnWrap = document.createElement('div');
        btnWrap.style.cssText = 'display:flex;flex-direction:column;gap:0.5rem;padding-top:1.8rem';
        const sv = document.createElement('button');
        sv.id = 'sb-' + i; sv.textContent = 'Save';
        sv.style.cssText = 'padding:0.45rem 0.85rem;background:var(--navy);color:white;border:none;border-radius:4px;cursor:pointer;font-size:0.82rem;font-weight:600';
        sv.onclick = () => saveEditedQuote(bookTitle, i);
        const dl = document.createElement('button');
        dl.textContent = 'Delete';
        dl.style.cssText = 'padding:0.45rem 0.85rem;background:white;color:#e53e3e;border:2px solid #e53e3e;border-radius:4px;cursor:pointer;font-size:0.82rem;font-weight:600';
        dl.onclick = () => deleteQuote(bookTitle, i);
        btnWrap.append(sv, dl);

        row.append(ta, pageWrap, btnWrap);
        container.appendChild(row);
    });
}

async function saveEditedQuote(bookTitle, idx) {
    const newText = (document.getElementById('eqt-' + idx)?.value || '').trim();
    const newPage = (document.getElementById('eqp-' + idx)?.value || '').trim();
    if (!newText) { alert('Quote cannot be empty.'); return; }
    // Find by position: nth quote for this book in customQuotes
    let count = -1;
    const ci = customQuotes.findIndex(cq => {
        if (cq.book === bookTitle) count++;
        return cq.book === bookTitle && count === idx;
    });
    if (ci !== -1) {
        customQuotes[ci].text = newText;
        customQuotes[ci].page = newPage;
        await saveCustomQuotes();
        rebuildData();
    }
    const btn = document.getElementById('sb-' + idx);
    if (btn) {
        btn.textContent = 'Saved!'; btn.style.background = '#10B981';
        setTimeout(() => { btn.textContent = 'Save'; btn.style.background = 'var(--navy)'; }, 1500);
    }
}

async function deleteQuote(bookTitle, idx) {
    // Replace the delete button with inline confirm to avoid browser dialog issues
    const btn = document.querySelector('#eq-' + idx + ' button:last-child');
    if (btn && btn.textContent === 'Delete') {
        btn.textContent = 'Sure?';
        btn.style.background = '#e53e3e';
        btn.style.color = 'white';
        btn.onclick = () => _doDelete(bookTitle, idx);
        setTimeout(() => {
            if (btn.textContent === 'Sure?') {
                btn.textContent = 'Delete';
                btn.style.background = 'white';
                btn.style.color = '#e53e3e';
                btn.onclick = () => deleteQuote(bookTitle, idx);
            }
        }, 3000);
        return;
    }
    _doDelete(bookTitle, idx);
}

async function _doDelete(bookTitle, idx) {
    let count = -1;
    const ci = customQuotes.findIndex(cq => {
        if (cq.book === bookTitle) count++;
        return cq.book === bookTitle && count === idx;
    });
    if (ci !== -1) {
        customQuotes.splice(ci, 1);
        await saveCustomQuotes();
        rebuildData();
        renderBookEdit(bookTitle);
    } else {
        // Fallback: dump debug info
        const bookQuotes = customQuotes.filter(cq => cq.book === bookTitle);
        alert('Debug: customQuotes has ' + customQuotes.length + ' total, ' + bookQuotes.length + ' for "' + bookTitle + '", looking for idx ' + idx);
    }
}



function filterByTag(tag) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector('[data-view="browse"]').classList.add('active');
    renderBrowse();
    setTimeout(() => {
        const sel = document.getElementById('tagFilter');
        if (sel) { sel.value = tag; filterQuotes(); }
    }, 50);
}

// ─── Favorites ────────────────────────────────────────────
function renderFavorites() {
    const favQuotes = favorites.map(i => allQuotes[i]).filter(Boolean);
    document.getElementById('content').innerHTML = `
        <h1 class="page-title">Favorites ⭐</h1>
        <p class="page-subtitle">${favQuotes.length} starred quote${favQuotes.length !== 1 ? 's' : ''}</p>
        ${favQuotes.length ? favQuotes.map((q,i) => renderQuoteCard(q, favorites[i])).join('') :
        '<p style="text-align:center;padding:3rem;color:var(--grey-dark);">No favorites yet. Click ★ on any quote to save it!</p>'}
    `;
}

// ─── Add Quotes (Bulk) ────────────────────────────────────
let usingNewBook = false;
let customTagPool = []; // extra tags created this session

function getTagPool() {
    const base = new Set(allQuotes.flatMap(q => q.tags ? q.tags.split(',').map(t=>t.trim()) : []));
    customTagPool.forEach(t => base.add(t));
    return [...base].sort();
}

function renderAdd() {
    usingNewBook = false;

async function importQuotes() {
    const book = getBookInfo();
    if (!book) { alert('Please select or enter a book first.'); return; }
    const raw = (document.getElementById('rawPaste')?.value||'').trim();
    if (!raw) { alert('Please paste some quotes first.'); return; }

    // Split into blocks: a new block starts only when a line begins with an
    // opening quotation mark. Continuation lines belong to the current block.
    const OPEN = /^[\u201c\u201e"]/;
    const blocks = [];
    let cur = null;
    for (const line of raw.split('\n')) {
        if (OPEN.test(line.trim())) {
            if (cur !== null) blocks.push(cur);
            cur = line;
        } else if (cur !== null) {
            cur += '\n' + line;  // continuation of multi-line quote
        } else {
            cur = line;          // line before any quote — start a block
        }
    }
    if (cur !== null) blocks.push(cur);

    const PAGE_RE = /\(p\.?\s*(\d+(?:\s*[-\u2013\u2014]\s*\d+)?)\)\s*$|\((\d+)\)\s*$/i;
    const toAdd = [];
    for (const block of blocks) {
        const trimmed = block.trim();
        if (!trimmed) continue;
        const m = trimmed.match(PAGE_RE);
        let text = trimmed, page = '';
        if (m) {
            page = (m[1] || m[2] || '').replace(/\s/g, '');
            text = trimmed.slice(0, m.index).trim();
        }
        // Strip surrounding open/close quote chars
        text = text.replace(/^[\u201c\u201e"']/, '').replace(/[\u201d\u201f"']$/, '').trim();
        if (text) toAdd.push({book:book.title, author:book.author, year:book.year, text, page, tags:''});
    }

    if (!toAdd.length) { alert('No quotes found.'); return; }
    customQuotes.push(...toAdd);
    await saveCustomQuotes(); rebuildData();
    showSuccess(`Added ${toAdd.length} quote${toAdd.length!==1?'s':''} from "${book.title}"!`);
    document.getElementById('rawPaste').value = '';
    document.getElementById('importStatus').textContent = `${toAdd.length} quotes added \u2713`;
}

async function tagAllQuotes(retag) {
    const toTag = retag ? customQuotes : customQuotes.filter(q => !q.tags);
    if (!toTag.length) { showSuccess('Nothing to tag!'); return; }

    const prog = document.getElementById('tag-progress');
    const BATCH = 20;
    let done = 0;

    // Collect existing tags for consistency
    const existingTags = [...new Set(customQuotes.flatMap(q => q.tags ? q.tags.split(',').map(t=>t.trim()) : []))].filter(Boolean).sort();

    for (let i = 0; i < toTag.length; i += BATCH) {
        const batch = toTag.slice(i, i + BATCH);
        if (prog) prog.textContent = `Tagging ${done} / ${toTag.length}...`;

        const prompt = `You are tagging quotes from a personal reading collection for a value investor.

Existing tags in use (reuse these where appropriate, create new ones only when needed):
${existingTags.length ? existingTags.join(', ') : 'none yet'}

For each quote below, assign 1-4 tags. Tags should be lowercase, 1-3 words, specific enough to be useful for filtering. Consider the quote content, the book it's from, and the author.

Good tag categories to draw from (but not limited to): investing, value-investing, mental-models, business-quality, moats, management, valuation, capital-allocation, risk, margin-of-safety, contrarian, patience, human-nature, incentives, epistemology, decision-making, economics, markets, pricing, competition, innovation, history, philosophy, ethics, wealth, compounding, concentration, diversification, position-sizing, spinoffs, special-situations, accounting, information-advantage.

Respond with ONLY a JSON array. Each element: {"idx": <number>, "tags": "<comma-separated tags>"}

Quotes to tag:
${batch.map((q, j) => `${j}. [${q.book} by ${q.author}] "${q.text.slice(0,300)}${q.text.length>300?'...':''}"`).join('\n')}`;

        try {
            const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'claude-sonnet-4-5',
                    max_tokens: 1000,
                    messages: [{ role: 'user', content: prompt }]
                })
            });
            const data = await res.json();
            const text = data.content?.[0]?.text || '';
            const clean = text.replace(/```json|```/g,'').trim();
            const results = JSON.parse(clean);
            for (const r of results) {
                const q = batch[r.idx];
                const ci = customQuotes.indexOf(q);
                if (ci !== -1) customQuotes[ci].tags = r.tags;
                // Update existingTags for next batch
                r.tags.split(',').map(t=>t.trim()).forEach(t => { if(t && !existingTags.includes(t)) existingTags.push(t); });
            }
            done += batch.length;
            await saveCustomQuotes();
            rebuildData();
        } catch(e) {
            if (prog) prog.textContent = 'Error on batch ' + (i/BATCH+1) + ': ' + e.message;
            break;
        }
    }
    if (prog) prog.textContent = `Done! Tagged ${done} quotes.`;
    showSuccess(`Tagged ${done} quotes!`);
    renderExport();
}

function exportData(format) {
    let content = '';
    if (format === 'csv') {
        content = 'Book,Author,Quote,Page,Tags\n';
        allQuotes.forEach(q => {
            content += `"${q.book}","${q.author}","${q.text.replace(/"/g,'""')}","${q.page}","${q.tags}"\n`;
        });
    } else if (format === 'json') {
        content = JSON.stringify(allQuotes, null, 2);
    } else {
        allQuotes.forEach(q => {
            content += `${q.text}\n— ${q.book} by ${q.author}${q.page ? ' (p.'+q.page+')' : ''}\n\n`;
        });
    }
    downloadFile(content, 'wisdom.' + format);
    showSuccess('Exported successfully!');
}

function exportFavorites() {
    const favQuotes = favorites.map(i => allQuotes[i]).filter(Boolean);
    let content = 'Book,Author,Quote,Page,Tags\n';
    favQuotes.forEach(q => {
        content += `"${q.book}","${q.author}","${q.text.replace(/"/g,'""')}","${q.page}","${q.tags}"\n`;
    });
    downloadFile(content, 'favorites.csv');
    showSuccess(`Exported ${favQuotes.length} favorites!`);
}

function downloadFile(content, filename) {
    const blob = new Blob([content], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

}

function journalId() { return 'j' + Date.now() + Math.random().toString(36).slice(2,6); }

function fmtDate(iso) {
    if (!iso) return '';
    // Parse YYYY-MM-DD directly to avoid UTC→local timezone shift showing wrong day
    const parts = iso.slice(0, 10).split('-');
    const d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ─── AI Framework Scorecard ──────────────────────────────────
function renderScorecardBody(stockId, sc) {
    const body = document.getElementById('scorecard-body-' + stockId);
    if (!body) return;

    const frameworks = [
        { key: 'gannon', title: '📊 Gannon (EBIT/Sales First)', color: '#1e3a5f' },
        { key: 'lynch', title: '🏃 Lynch Framework', color: '#065f46' },
        { key: 'mayer', title: '💯 Mayer 100-Baggers', color: '#7c2d12' },
        { key: 'buffett', title: '📖 Buffett / Fin. Statements', color: '#1d4ed8' },
        { key: 'fisher', title: '🔎 Phil Fisher 15-Point', color: '#6b21a8' }
    ];

    let html = '<div class="scorecard-grid">';
    for (const fw of frameworks) {
        const d = sc[fw.key];
        if (!d) continue;
        const items = d.items || [];
        const passes = items.filter(i => i.rating === 'pass').length;
        const warns = items.filter(i => i.rating === 'warn').length;
        const fails = items.filter(i => i.rating === 'fail').length;

        html += `<div class="scorecard-framework">
            <div class="scorecard-framework-title" style="color:${fw.color}">${fw.title}${d.classification ? ' · <em style="font-weight:400;text-transform:none">' + d.classification + '</em>' : ''}</div>
            ${items.map(item => `
            <div class="scorecard-criterion">
                <span class="scorecard-icon">${ratingIcon(item.rating)}</span>
                <div><strong>${item.criterion}</strong>${item.note ? '<br><span style="color:var(--grey-dark);font-size:0.83rem">' + item.note + '</span>' : ''}</div>
            </div>`).join('')}
            <div class="scorecard-score-bar">
                <span class="scorecard-overall">Score</span>
                <div class="scorecard-dots">
                    ${Array(passes).fill('<div class="scorecard-dot dot-pass"></div>').join('')}
                    ${Array(warns).fill('<div class="scorecard-dot dot-warn"></div>').join('')}
                    ${Array(fails).fill('<div class="scorecard-dot dot-fail"></div>').join('')}
                </div>
                <span style="font-size:0.75rem;color:var(--grey-dark);margin-left:0.25rem">${passes}/${items.length}</span>
            </div>
        </div>`;
    }
    html += '</div>';
    body.innerHTML = html;
}

function renderJournal() {
    const search = (document.getElementById('j-search')?.value || '').toLowerCase();
    const vf = document.getElementById('j-verdict')?.value || '';
    let stocks = [...stockJournal];
    if (search) stocks = stocks.filter(s =>
        s.ticker.toLowerCase().includes(search) ||
        (s.name||'').toLowerCase().includes(search) ||
        (s.summary||'').toLowerCase().includes(search) ||
        (s.tags||'').toLowerCase().includes(search)
    );
    if (vf) stocks = stocks.filter(s => s.verdict === vf);
    stocks.sort((a,b) => (b.updated||'').localeCompare(a.updated||''));

    document.getElementById('content').innerHTML = `
        <h1 class="page-title">Stock Journal</h1>
        <p class="page-subtitle">${stockJournal.length} position${stockJournal.length!==1?'s':''} tracked · your living thesis notebook</p>
        <div class="journal-toolbar">
            <input type="text" class="journal-search" id="j-search" placeholder="Search tickers, names, notes…" oninput="renderJournal()" value="${search}">
            <select class="verdict-filter" id="j-verdict" onchange="renderJournal()">
                <option value="">All Verdicts</option>
                <option value="buy" ${vf==='buy'?'selected':''}>✅ Buy</option>
                <option value="watch" ${vf==='watch'?'selected':''}>👀 Watch</option>
                <option value="pass" ${vf==='pass'?'selected':''}>⏭ Pass</option>
                <option value="sell" ${vf==='sell'?'selected':''}>🚫 Sell</option>
            </select>
            <button class="new-stock-btn" onclick="openStockModal()">+ New Position</button>
        </div>
        ${stocks.length === 0
            ? `<div style="text-align:center;padding:4rem 2rem;color:var(--grey-dark)">
                <div style="font-size:3rem;margin-bottom:1rem">📈</div>
                <div style="font-size:1.1rem;margin-bottom:0.5rem">No positions yet</div>
                <div style="font-size:0.9rem">Click "+ New Position" to add your first stock thesis</div>
               </div>`
            : `<div class="journal-grid">${stocks.map(s => renderStockCard(s)).join('')}</div>`
        }
    `;
}

function renderStockCard(s) {
    const v = s.verdict || 'watch';
    const logCount = (s.log||[]).length;
    const tags = (s.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
    return `
    <div class="stock-card verdict-${v}" onclick="openStockDetail('${s.id}')">
        <div class="stock-ticker">${s.ticker}</div>
        <div class="stock-name">${s.name||''}${s.exchange ? ' · <span style="font-size:0.78rem">'+s.exchange+'</span>' : ''}</div>
        <div class="verdict-badge ${v}">${v.toUpperCase()}</div>
        ${s.irr_base ? `<div class="stock-irr">Base IRR: <strong>${s.irr_base}%</strong>${s.target_price?' · Target: <strong>$'+s.target_price+'</strong>':''}</div>` : ''}
        ${s.summary ? `<div class="stock-summary">${s.summary}</div>` : ''}
        ${tags.length ? `<div class="stock-tags">${tags.map(t=>`<span class="stock-tag">${t}</span>`).join('')}</div>` : ''}
        <div class="stock-footer">
            <span>${logCount} log entr${logCount===1?'y':'ies'}</span>
            <span>Updated ${fmtDate(s.updated)}</span>
        </div>
    </div>`;
}

function updateValuationBoxes(boxId, g_bear, g_base, g_bull) {
    const spEl   = document.getElementById(boxId + '-stockprice');
    const shEl   = document.getElementById(boxId + '-shares');
    const oeEl   = document.getElementById(boxId + '-oe');
    const yrsEl  = document.getElementById(boxId + '-years');
    if (!spEl || !shEl || !oeEl || !yrsEl) return;

    const sp  = parseFloat(spEl.value)  || 0;
    const sh  = parseFloat(shEl.value)  || 0;
    const oe  = parseFloat(oeEl.value)  || 0;
    const yrs = parseInt(yrsEl.value)   || 5;
    // mkt cap = stock price × shares (both in matching units; price in $, shares in M → mkt in $M)
    const mkt = (sp > 0 && sh > 0) ? sp * sh : 0;
    if (mkt <= 0 || oe <= 0) return;

    const yieldPct = (oe / mkt * 100);
    const yieldFmt = yieldPct.toFixed(1);
    const impliedG = (15 - yieldPct).toFixed(1);
    const gColor   = parseFloat(impliedG) <= 5  ? '#10B981'
                   : parseFloat(impliedG) <= 12 ? '#F59E0B' : '#EF4444';

    // ── Reverse DCF ─────────────────────────────────────────────────────────
    const rdcfEl = document.getElementById(boxId + '-rdcf');
    if (rdcfEl) rdcfEl.innerHTML = `
        <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--navy);margin-bottom:0.9rem">📐 Reverse DCF — Implied Growth Rate</div>
        <div style="font-size:0.8rem;color:var(--grey-dark);margin-bottom:1rem;line-height:1.6">
            At a <strong>15% IRR hurdle</strong>, the market must price in:
        </div>
        <div style="display:flex;align-items:baseline;gap:0.5rem;margin-bottom:0.75rem">
            <span style="font-size:2.8rem;font-weight:700;color:${gColor};line-height:1">${impliedG}%</span>
            <span style="font-size:0.85rem;color:var(--grey-dark)">annual growth required</span>
        </div>
        <div style="border-top:1px solid var(--grey-light);padding-top:0.85rem;display:flex;flex-direction:column;gap:0.4rem">
            <div style="display:flex;justify-content:space-between;font-size:0.82rem">
                <span style="color:var(--grey-dark)">Owner earnings yield</span>
                <span style="font-weight:600;color:var(--navy)">${yieldFmt}%</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:0.82rem">
                <span style="color:var(--grey-dark)">+ Required growth</span>
                <span style="font-weight:600;color:${gColor}">${impliedG}%</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:0.82rem;border-top:1px dashed var(--grey-light);padding-top:0.4rem;margin-top:0.2rem">
                <span style="color:var(--grey-dark);font-weight:600">= Hurdle IRR</span>
                <span style="font-weight:700;color:var(--navy)">15.0%</span>
            </div>
        </div>`;

    // ── Owner Earnings IRR ───────────────────────────────────────────────────
    const irrEl = document.getElementById(boxId + '-irr');
    if (irrEl) {
        const scenRows = [
            { label:'Bear', g:g_bear, color:'#F59E0B', bg:'#FFFBEB' },
            { label:'Base', g:g_base, color:'#1e3a5f', bg:'#EFF6FF' },
            { label:'Bull', g:g_bull, color:'#10B981', bg:'#ECFDF5' },
        ].filter(r => r.g > 0).map(r => {
            const irr   = (yieldPct + r.g).toFixed(1);
            const meets = parseFloat(irr) >= 15;
            return `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.55rem 0.75rem;border-radius:5px;background:${r.bg}">
                <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:${r.color};width:36px">${r.label}</div>
                <div style="flex:1;font-size:0.82rem;color:var(--grey-dark)">${yieldFmt}% yield + ${r.g}% growth</div>
                <div style="font-size:1.1rem;font-weight:700;color:${r.color}">${irr}%</div>
                <div style="font-size:0.85rem">${meets ? '✅' : '❌'}</div>
            </div>`;
        }).join('');

        irrEl.innerHTML = `
            <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--navy);margin-bottom:0.9rem">⚖️ Owner Earnings IRR</div>
            <div style="font-size:0.78rem;color:var(--grey-dark);margin-bottom:0.85rem;font-style:italic;line-height:1.5">
                Yield + Growth = Total Return &nbsp;·&nbsp; Hurdle: 15%
            </div>
            <div style="font-size:0.82rem;color:var(--grey-dark);margin-bottom:0.75rem">
                OE yield: <strong style="color:var(--navy)">${yieldFmt}%</strong>
                &nbsp;<span style="color:var(--grey-dark);font-size:0.76rem">($${oe}M OE ÷ $${mkt.toFixed(1)}M mkt cap${sp>0?' @ $'+sp.toFixed(2)+'/sh':''})</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:0.4rem">${scenRows}</div>`;
    }

    // ── Sensitivity matrix ───────────────────────────────────────────────────
    const matEl = document.getElementById(boxId + '-matrix');
    if (!matEl) return;

    const growthCols = [0, 5, 10, 15, 20, 25];
    const multRows   = [10, 15, 20, 25, 30];

    const headerCells = growthCols.map(g =>
        `<th style="padding:0.35rem 0.6rem;font-size:0.72rem;font-weight:600;color:var(--grey-dark);text-align:center;white-space:nowrap">${g}% g</th>`
    ).join('');

    const tableRows = multRows.map(mult => {
        const cells = growthCols.map(g => {
            const fwdOE  = oe * Math.pow(1 + g/100, yrs);
            const exit   = fwdOE * mult;
            const irrN   = (Math.pow(exit / mkt, 1/yrs) - 1) * 100;
            const irrNf  = irrN.toFixed(0);
            const bg     = irrN >= 20 ? '#D1FAE5' : irrN >= 15 ? '#FEF9C3' : irrN >= 10 ? '#FFF3CD' : '#FEE2E2';
            const fc     = irrN >= 20 ? '#065F46' : irrN >= 15 ? '#92400E' : irrN >= 10 ? '#78350F' : '#991B1B';
            const bld    = irrN >= 15 ? 'font-weight:700' : '';
            return `<td style="padding:0.35rem 0.6rem;text-align:center;background:${bg};color:${fc};${bld};font-size:0.8rem">${irrNf}%</td>`;
        }).join('');
        return `<tr>
            <td style="padding:0.35rem 0.75rem;font-size:0.75rem;font-weight:600;color:var(--grey-dark);white-space:nowrap;background:var(--grey-bg)">${mult}x exit</td>
            ${cells}
        </tr>`;
    }).join('');

    matEl.innerHTML = `
        <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--navy);margin-bottom:0.6rem">📊 ${yrs}-Year IRR Sensitivity — Growth Rate × Exit Multiple</div>

        <table style="border-collapse:collapse;width:100%;min-width:400px">
            <thead><tr>
                <th style="padding:0.35rem 0.75rem;font-size:0.72rem;font-weight:600;color:var(--grey-dark);text-align:left;background:var(--grey-bg)">Multiple</th>

            </tr></thead>
            <tbody>${tableRows}</tbody>
        </table>
        </div>
        <div style="display:flex;gap:1rem;margin-top:0.6rem;flex-wrap:wrap">
            <span style="font-size:0.7rem;display:flex;align-items:center;gap:0.3rem"><span style="display:inline-block;width:10px;height:10px;background:#D1FAE5;border-radius:2px"></span>≥20%</span>
            <span style="font-size:0.7rem;display:flex;align-items:center;gap:0.3rem"><span style="display:inline-block;width:10px;height:10px;background:#FEF9C3;border-radius:2px"></span>15–20%</span>

        </div>`;
}

async function loadAiContext(stockId, ticker, name, forceRefresh) {
    const loadEl = document.getElementById('ai-loading-' + stockId);
    const resEl  = document.getElementById('ai-results-' + stockId);
    const badge  = document.getElementById('ai-panel-badge-' + stockId);
    if (!loadEl || !resEl) return;

    // Show loading
    loadEl.style.display = 'flex';
    resEl.style.display = 'none';
    if (badge) badge.textContent = '';

    // Check session cache unless forced refresh
    const cacheKey = '_aiCtx_' + ticker;
    if (!forceRefresh && window[cacheKey]) {
        renderAiResults(stockId, window[cacheKey]);
        return;
    }

    try {
        // Call Claude API to summarize past research for this ticker
        const systemPrompt = `You are an investment research assistant. The user maintains a personal stock journal. 
You will be given context about past research conversations on a specific stock. 
Extract and summarize the KEY INVESTMENT INSIGHTS only — focus on:
- Business quality assessment (moat, margins, capital allocation)
- Valuation conclusions (owner earnings yield, IRR estimates)  
- Key risks identified
- Management / jockey assessment
- Any Gannon/Lynch/Mayer/Buffett framework conclusions
- Outstanding questions or monitoring items

Format your response as a JSON array of insight blocks, each with:
{ "label": "short category label", "text": "the insight in 2-5 sentences" }

Return ONLY valid JSON. No markdown, no preamble. If no relevant research found, return [].
Maximum 6 blocks. Be dense and specific — no fluff.`;

        const userMsg = `Summarize all past research and analysis you have done on ${ticker}${name ? ' (' + name + ')' : ''} from our previous conversations in this project. Extract the most actionable investment insights.`;

        const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: 'claude-sonnet-4-5',
                max_tokens: 1000,
                system: systemPrompt,
                messages: [{ role: 'user', content: userMsg }]
            })
        });

        const data = await res.json();
        const raw = (data.content?.[0]?.text || '').replace(/```json|```/g, '').trim();
        let insights = [];
        try { insights = JSON.parse(raw); } catch(e) { insights = []; }

        // Cache in session
        window[cacheKey] = insights;
        renderAiResults(stockId, insights);

    } catch(e) {
        loadEl.style.display = 'none';
        resEl.style.display = 'block';
        resEl.innerHTML = `<div style="color:var(--grey-dark);font-size:0.88rem;padding:0.5rem 0">Could not load past analysis. <button class="ai-refresh-btn" onclick="loadAiContext('${stockId}','${ticker}','${name}',true)">Try again</button></div>`;
    }
}

function renderAiResults(stockId, insights) {
    const loadEl = document.getElementById('ai-loading-' + stockId);
    const resEl  = document.getElementById('ai-results-' + stockId);
    const badge  = document.getElementById('ai-panel-badge-' + stockId);
    if (loadEl) loadEl.style.display = 'none';
    if (!resEl) return;
    resEl.style.display = 'block';

    if (!insights || insights.length === 0) {
        resEl.innerHTML = `<div style="color:var(--grey-dark);font-size:0.9rem;padding:0.25rem 0">No past research found for this ticker in this project. Conduct a research session in chat and it will appear here automatically.</div>`;
        if (badge) badge.textContent = '0';
        return;
    }

    if (badge) badge.textContent = insights.length;
    resEl.innerHTML = insights.map(ins => `
        <div class="ai-insight-block">
            <div class="ai-insight-label">${ins.label || 'Insight'}</div>
            <div>${ins.text || ''}</div>
        </div>
    `).join('');
}

async function addLogEntry(stockId) {
    const text = (document.getElementById('new-log-text')?.value||'').trim();
    if (!text) return;
    const s = stockJournal.find(x => x.id === stockId);
    if (!s) return;
    if (!s.log) s.log = [];
    s.log.push({ id: journalId(), date: new Date().toISOString(), text });
    s.updated = new Date().toISOString();
    await saveJournal();
    openStockDetail(stockId);
}

async function deleteLogEntry(stockId, logId) {
    const s = stockJournal.find(x => x.id === stockId);
    if (!s) return;
    const el = document.getElementById('le-' + logId);
    if (el) {
        const btn = el.querySelector('.btn-del-log');
        if (btn && btn.textContent === 'Delete') {
            btn.textContent = 'Sure?'; btn.style.background = '#FEE2E2';
            setTimeout(() => { if(btn.textContent==='Sure?'){btn.textContent='Delete';btn.style.background='white';} }, 3000);
            return;
        }
    }
    s.log = (s.log||[]).filter(l => l.id !== logId);
    s.updated = new Date().toISOString();
    await saveJournal();
    openStockDetail(stockId);
}

function editLogEntry(stockId, logId) {
    const s = stockJournal.find(x => x.id === stockId);
    if (!s) return;
    const l = (s.log||[]).find(x => x.id === logId);
    if (!l) return;
    const el = document.getElementById('le-' + logId);
    if (!el) return;
    el.innerHTML = `
        <div class="log-entry-date">${fmtDate(l.date)}</div>
        <textarea style="width:100%;border:2px solid var(--grey-light);border-radius:4px;padding:0.65rem;font-size:0.92rem;line-height:1.6;resize:vertical;min-height:80px;font-family:'IBM Plex Sans',sans-serif">${l.text}</textarea>
        <div class="log-entry-actions" style="margin-top:0.5rem">
            <button class="btn-edit-log" onclick="saveLogEdit('${stockId}','${logId}')">Save</button>
            <button class="btn-del-log" onclick="openStockDetail('${stockId}')">Cancel</button>
        </div>`;
}

async function saveLogEdit(stockId, logId) {
    const s = stockJournal.find(x => x.id === stockId);
    if (!s) return;
    const l = (s.log||[]).find(x => x.id === logId);
    if (!l) return;
    const el = document.getElementById('le-' + logId);
    const ta = el?.querySelector('textarea');
    if (!ta) return;
    l.text = ta.value.trim();
    s.updated = new Date().toISOString();
    await saveJournal();
    openStockDetail(stockId);
}

            s.updated = now;
        }
    } else {
        stockJournal.push({
            id: journalId(),
            ticker,
            name: document.getElementById('m-name')?.value||'',
            exchange: document.getElementById('m-exchange')?.value||'',
            verdict: document.getElementById('m-verdict')?.value||'watch',
            target_price: document.getElementById('m-target')?.value||'',
            tags: document.getElementById('m-tags')?.value||'',
            irr_bear: document.getElementById('m-irr-bear')?.value||'',
            irr_base: document.getElementById('m-irr-base')?.value||'',
            irr_bull: document.getElementById('m-irr-bull')?.value||'',
            summary: document.getElementById('m-summary')?.value||'',
            bull_case: document.getElementById('m-bull')?.value||'',
            base_case: document.getElementById('m-base')?.value||'',
            bear_case: document.getElementById('m-bear')?.value||'',
            kill_thesis: document.getElementById('m-kill')?.value||'',
            created: now,
            updated: now,
            log: []
        });
    }
    await saveJournal();
    closeModal();
    showSuccess((existingId ? 'Position updated' : 'Position added') + '!');
    renderJournal();
}

async function deleteStock(id) {
    const s = stockJournal.find(x => x.id === id);
    if (!s) return;
    // inline confirm using a toast-style check
    if (!window._deleteConfirm || window._deleteConfirm !== id) {
        window._deleteConfirm = id;
        showSuccess(`Click Delete again to confirm removing ${s.ticker}`);
        setTimeout(() => { if (window._deleteConfirm === id) window._deleteConfirm = null; }, 4000);
        return;
    }
    window._deleteConfirm = null;
    stockJournal = stockJournal.filter(x => x.id !== id);
    await saveJournal();
    showSuccess(`${s.ticker} removed from journal`);
    renderJournal();
}

"economics, incentives, government"},{"book":"Economics in One Lesson","author":"Henry Hazlitt","year":"1946","text":"Emotional economics has given birth to theories that calm examination cannot justify","page":"143","tags":"economics, decision-making, epistemology"},{"book":"Economics in One Lesson","author":"Henry Hazlitt","year":"1946","text":"In a free economy, in which wages, costs and prices are left to the free play of the competitive market, the prospect of profits decides what articles will be made, and in what quantities – and what articles will not be made at all","page":"161","tags":"markets, economics, pricing, competition"},{"book":"Economics in One Lesson","author":"Henry Hazlitt","year":"1946","text":"Profits are achieved not by raising prices, but by introducing economies and efficiencies that cut costs of production… Therefore the largest profits go to the firms that have achieved the lowest costs of production","page":"162","tags":"pricing, competition, economics, cost-advantage"},{"book":"Economics in One Lesson","author":"Henry Hazlitt","year":"1946","text":"Profits… not only tells us which goods it is most economical to make, but which are the most economical ways to make them","page":"162","tags":"economics, incentives, capital-allocation"},{"book":"Economics in One Lesson","author":"Henry Hazlitt","year":"1946","text":"Inflation itself is a form of taxation… it is a tax not only on every individual’s expenditures, but on his savings account and life insurance. It is, in fact, a flat capital levy, without exemptions, in which the poor man pays as high a percentage as the rich man","page":"176","tags":"economics, government, wealth"},{"book":"Economics in One Lesson","author":"Henry Hazlitt","year":"1946","text":"If no effort is made to tamper with money rates through inflationary governmental policies, increased savings create their own demand by lowering interest rates in a natural manner. The greater the supply of savings seeking investment forces savers to accept lower rates","page":"187","tags":"capital-allocation, markets, government"},{"book":"Economics in One Lesson","author":"Henry Hazlitt","year":"1946","text":"Until everything can be produced at no cost at all – there is no assignable limit to the amount of new capital that can be absorbed","page":"189","tags":"capital-allocation, economics"},{"book":"Economics in One Lesson","author":"Henry Hazlitt","year":"1946","text":"When we study the effects of various proposals, not merely on special groups in the short run, but on all groups in the long run, the conclusions we arrive at usually correspond with those of unsophisticated common sense","page":"193","tags":"long-term, second-order-thinking, economics"},{"book":"Economics in One Lesson","author":"Henry Hazlitt","year":"1946","text":"Wherever competition exists, in fact, each producer is compelled to put forth his utmost efforts to raise the highest possible crop on his own land. In this way the forces of self-interest… are harnessed to maximum output","page":"196","tags":"competition, incentives, economics"},{"book":"Economics in One Lesson","author":"Henry Hazlitt","year":"1946","text":"To see the problem as a whole, and not in fragments: that is the goal of economic science","page":"199","tags":"second-order-thinking, mental-models, economics"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"The functioning of the economy and society required each individual to do things for other people; it was simply the motivation behind these acts-- whether moral or economic-- which was ultimately self-centered. In both his moral and his economic analyses, Smith relied on incentives rather than dispositions to get the job done.","page":"15","tags":"incentives, human-nature, economics"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"Godwin referred to ‘men as they hereafter been made,’ in contrast to Burke’s view: ‘we cannot change the Nature of things and of men—but must act upon them the best we can.’","page":"16","tags":"human-nature, epistemology"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"Implicit in the unconstrained vision is the notion that the potential is very different from the actual, and that means exist to improve human nature toward its potential, so that man will do the right thing for the right reason, rather than for ulterior psychic or economic rewards… Man is, in short, ‘perfectible’… Efforts must be made to ‘wake the sleeping virtues of mankind.’","page":"18","tags":"human-nature, incentives, philosophy"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"Intentions, which were crucial in the unconstrained vision of Godwin, were irrelevant in the constrained vision of Smith. What mattered to Smith were the systemic characteristics of a competitive economy, which he saw as producing social benefits from unsavory individual intentions.","page":"21","tags":"incentives, markets, human-nature"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"In the unconstrained vision, there are no intractable reasons for social evils and therefore no reason why they cannot be solved, with sufficient moral commitment. But in the constrained vision, whatever artifices or strategies restrain or ameliorate inherent human evils will themselves have costs… so that all that is possible is a prudent trade-off.","page":"25","tags":"second-order-thinking, trade-offs, human-nature"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"The Constitution of the United States, with its elaborate checks and balances, clearly reflected the view that no one was ever to be completely trusted with power… To the Federalists, the evil was inherent in man, and institutions were simply ways of trying to cope with it.","page":"26","tags":"incentives, government, human-nature"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"Running through the tradition of the unconstrained vision is the conviction that foolish or immoral choices explain the evils of the world—and that wiser or more moral and humane social policies are the solution.","page":"32","tags":"decision-making, human-nature, epistemology"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"The constrained vision sees the evils of the world as deriving from the limited and unhappy choices available, given the inherent moral and intellectual limitations of human beings.","page":"33","tags":"human-nature, decision-making, trade-offs"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"In the unconstrained vision, the best conduct of social activities depends upon the special knowledge of the few being used to guide the actions of the many.","page":"43","tags":"epistemology, decision-making, centralized-knowledge"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"With knowledge conceived of as both fragmented and widely dispersed, systemic coordination among the many supersedes the special wisdom of the few. Nor was the systemic coordination to be planned or imposed by the wise few.","page":"46","tags":"epistemology, markets, distributed-knowledge"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"With the constrained vision, the issue is not whether one individual or group is wiser than another, but whether systemic experience is wiser than both.","page":"","tags":"epistemology, experience, humility"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"It is consistent for the unconstrained vision to promote equalitarian ends by unequalitarian means.","page":"55","tags":"philosophy, incentives, means-vs-ends"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"Language is perhaps the purest example of an evolved social process- a systemic order without a deliberate overall design… language is, in effect, a model for social processes in legal, economic, political, and other systems, as viewed within the constrained vision.” (p. 70, 71)","page":"","tags":"distributed-knowledge, economics, philosophy"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"in more sophisticated versions of the unconstrained vision, whole societies remain readily manageable, though by experts rather than by the mass of ordinary people.","page":"77","tags":"centralized-knowledge, government, epistemology"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"To Hayek, it is a delusion ‘that all the relevant facts are known to some one mind’ making a decision and considering its wider ramifications.","page":"86","tags":"distributed-knowledge, centralized-knowledge, epistemology"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"Justice is likewise a process characteristic in the constrained vision: If a foot race is conducted under fair conditions, then the result is just… Results do not define justice.","page":"95","tags":"philosophy, means-vs-ends, trade-offs"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"These intellectual and moral pioneers become the surrogate decision-makers, pending the eventual progress of mankind to the point where all can make social decisions.","page":"110","tags":"centralized-knowledge, government, epistemology"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"What is at the heart of the difference between them is the question as to whether human capabilities or potential permit social decisions to be made collectively through the articulated rationality of surrogates, so as to produce the specific social results desired.","page":"123","tags":"centralized-knowledge, distributed-knowledge, decision-making"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"Equality is a process characteristic in the constrained vision and a result characteristic in the unconstrained vision… A social process which assures equal treatment thus represents equality in the constrained vision, whether or not the actual results are equal.","page":"133","tags":"philosophy, means-vs-ends, trade-offs"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"Some have little because others have much, according to this reasoning, which has been part of the unconstrained vision for centuries.","page":"138","tags":"wealth, economics, philosophy"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"Government, as a limited set of decision-makers, cannot possess all the knowledge in a society, or anything approaching it, and therefore lacks the omniscience in fact to prescribe just or equal results.","page":"143","tags":"centralized-knowledge, distributed-knowledge, government"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"Both visions also recognize that most people are horrified at certain crimes and would be morally incapable of committing them… The constrained vision of human nature sees this revulsion at the thought of committing certain crimes as the product of social conditioning- a sense of general morality, personal honor, and humane feelings, all cultivated by the many traditions and institutions of society. The unconstrained vision sees human nature as itself adverse to crime, and society as undermining this natural aversion through its own injustices.","page":"163","tags":"human-nature, philosophy, incentives"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"While the constrained vision takes people’s motives and predispositions as given, and emphasizes incentives to lead to socially desired behavior, the unconstrained vision attempts to change people’s motives and predispositions, so that incentives in general are less important… The unconstrained vision seeks a solution.","page":"203","tags":"incentives, human-nature, philosophy"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"Much of what the unconstrained vision sees as morally imperative to do, the constrained vision sees man as incapable of doing.","page":"226","tags":"philosophy, human-nature, trade-offs"},{"book":"A Conflict of Visions","author":"Thomas Sowell","year":"2007","text":"In the unconstrained vision, in which man can master social complexities sufficiently to apply directly the logic and morality of the common good, the presence of highly educated and intelligent people diametrically opposed to policies aimed at that common good is either an intellectual puzzle or a moral outrage… Those with the constrained vision tend to refer to their adversaries as well-meaning but mistaken, or unrealistic in their assumptions, with seldom a suggestion that they are deliberately opposing the common good or are too stupid to recognize it.” (p. 257).","page":"","tags":"centralized-knowledge, epistemology, philosophy"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"I often make the statement that liberalism is a symptom of remarkable privilege. In times of true injustice, no one debates gender pronouns and microaggressions. In times of real conflict, no one demands the government come take their guns.","page":"20","tags":"human-nature, trade-offs, philosophy"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"Leftism is defined as any political philosophy that seeks to infringe upon individual liberties in its demand for a higher moral good.","page":"37","tags":"government, philosophy, trade-offs"},{"book":"Blackout","author":"Candace Owens","year":"2020","text":"During Johnson’s first twenty years in the U.S. Senate, he voted down every single civil rights measure that made the floor.","page":"49","tags":"gove
